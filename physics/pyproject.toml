[project]
name = "curvatura"
version = "0.1.0"
description = "Núcleo de cálculo de métricas de curvatura: tensores, condiciones de energía y presupuestos de masa-energía."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "../LICENSE" }
authors = [{ name = "Pablo Nolasco" }]
dependencies = ["numpy>=2.0", "sympy>=1.13", "scipy>=1.13"]

[project.optional-dependencies]
# Laboratorio de fórmulas: velocidad (symengine, numba), rigor (python-flint, z3), reescritura (egglog).
lab = ["symengine>=0.14", "python-flint>=0.9", "mpmath>=1.3", "numba>=0.68", "z3-solver>=4.15", "egglog>=14; python_version >= '3.12'", "lark>=1.2"]
# Descubrir fórmulas a partir de datos (instala Julia la primera vez, varios cientos de MB).
descubrir = ["pysr>=2.7"]

[project.scripts]
curvatura-lab = "curvatura.lab.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["curvatura"]

[tool.pytest.ini_options]
testpaths = ["tests"]
