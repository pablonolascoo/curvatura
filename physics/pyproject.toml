[project]
name = "curvatura"
version = "0.1.0"
description = "Núcleo de cálculo de métricas de curvatura: tensores, condiciones de energía y presupuestos de masa-energía."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "../LICENSE" }
authors = [{ name = "Pablo Nolasco" }]
dependencies = ["numpy>=2.0", "sympy>=1.13", "scipy>=1.13"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["curvatura"]

[tool.pytest.ini_options]
testpaths = ["tests"]
