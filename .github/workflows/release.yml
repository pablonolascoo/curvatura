name: release

# Se dispara con cada etiqueta vX.Y.Z (la crea `bun run deploy`) o a mano.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            triple: universal-apple-darwin
          - platform: windows-latest
            args: ""
            triple: x86_64-pc-windows-msvc
          - platform: ubuntu-22.04
            args: ""
            triple: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown${{ matrix.platform == 'macos-latest' && ',aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri -> target
            solvers/rust -> target
      - name: Dependencias de Linux
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: bun install --frozen-lockfile
      - name: uv (Python nativo) para esta plataforma
        shell: bash
        run: bash scripts/fetch-uv.sh ${{ matrix.triple }}
      # Firma de Apple solo si hay certificado «Developer ID» (de pago). Si el secreto no existe, GitHub
      # lo pasa vacío y Tauri intentaría importarlo: aquí solo se exporta cuando tiene contenido.
      # Sin él la app se firma ad hoc; con APPLE_ID, APPLE_PASSWORD y APPLE_TEAM_ID además se notariza.
      - name: Firma de Apple (si hay certificado)
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          C: ${{ secrets.APPLE_CERTIFICATE }}
          CP: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SI: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          AI: ${{ secrets.APPLE_ID }}
          AP: ${{ secrets.APPLE_PASSWORD }}
          AT: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$C" ]; then
            {
              echo "APPLE_CERTIFICATE<<FIN_CERT"; echo "$C"; echo "FIN_CERT"
              echo "APPLE_CERTIFICATE_PASSWORD=$CP"
              echo "APPLE_SIGNING_IDENTITY=$SI"
              if [ -n "$AI" ]; then echo "APPLE_ID=$AI"; echo "APPLE_PASSWORD=$AP"; echo "APPLE_TEAM_ID=$AT"; fi
            } >> "$GITHUB_ENV"
          else
            echo "Sin certificado de Apple: firma ad hoc."
          fi
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Firma de las actualizaciones (obligatoria): `bun scripts/firma.ts --github` da los comandos.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: bunx tauri
          tagName: ${{ github.ref_name }}
          releaseName: "Curvatura ${{ github.ref_name }}"
          releaseBody: "Aplicación de escritorio de Curvatura. Novedades en CHANGELOG.md."
          releaseDraft: false
          includeUpdaterJson: true
          prerelease: false
          args: ${{ matrix.args }}
