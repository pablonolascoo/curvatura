name: vigilar

# Cada lunes: papers nuevos (arXiv, OpenAlex), países, relevancia y patentes relacionadas.
# Solo se publican metadatos y el índice bibliográfico de patentes; el texto completo se queda en local.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/cache@v4
        with:
          path: datos/patentes/_vistos.json
          key: patentes-vistos-${{ github.run_id }}
          restore-keys: patentes-vistos-
      - name: Papers nuevos
        run: |
          python3 -I library/tools/harvest.py all || true
          python3 -I library/tools/enrich.py countries || true
          python3 -I library/tools/relevance.py
      - name: Patentes
        run: uv run --project ia --python 3.13 python -m curvatura_ia.patentes --max 250 --fuentes google,epo,uspto,lens
        env:
          EPO_OPS_KEY: ${{ secrets.EPO_OPS_KEY }}
          EPO_OPS_SECRET: ${{ secrets.EPO_OPS_SECRET }}
          USPTO_ODP_API_KEY: ${{ secrets.USPTO_ODP_API_KEY }}
          LENS_API_TOKEN: ${{ secrets.LENS_API_TOKEN }}
      - name: Guardar
        run: |
          git config user.name "curvatura-vigilante"
          git config user.email "actions@users.noreply.github.com"
          git add library/papers library/patentes
          git diff --cached --quiet || (git commit -m "library: vigilancia semanal $(date +%F)" && git push)
