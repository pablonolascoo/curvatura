name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - uses: astral-sh/setup-uv@v6
      - run: bun install --frozen-lockfile
      - name: Motor de fórmulas
        run: bun --filter '@curvatura/formula' test
      - name: Física (Python)
        run: uv --directory physics run pytest -q
      - name: Solvers (C++)
        run: make -C solvers/cpp test CXX=g++
      - name: Web
        run: bun --filter web build
