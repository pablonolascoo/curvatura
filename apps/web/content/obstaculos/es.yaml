  summary: "En teorías modificadas, una burbuja razonable sigue violando las condiciones geométricas de convergencia nula y temporal. Un acoplamiento gravitacional variable impuesto por un metamaterial rompe la conservación local, y su versión dinámica está excluida por medidas del Sistema Solar con $|\\gamma - 1| \\lesssim 10^{-5}$. Las vías restantes, como el espín en Einstein-Cartan, piden una densidad de espín cuya realización con materia conocida no está demostrada."
