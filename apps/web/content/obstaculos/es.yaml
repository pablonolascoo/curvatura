- id: analogos-laboratorio
  subsystem: V
  status: parcial
  title: Los análogos solo prueban la cinemática, no la fuente
  summary: "La métrica de Alcubierre es la métrica acústica de un flujo, y ya se han medido emisión de Hawking estimulada en canales de agua y espontánea en condensados de Bose-Einstein. Estos sistemas reproducen cómo se propagan las perturbaciones, pero no el tensor energía-momento ni la retroacción. Parte de los resultados en agua se obtuvieron en régimen no lineal, lo que complica su lectura."
  evidence: [barcelo-2011, weinfurtner-2011, kolobov-2019, euve-2021]
  leads:
    - text: "Simular secciones 1+1 de la burbuja con cadenas de SQUID en líneas de transmisión superconductoras, con parámetros ya acotados."
      papers: [sabin-2017, sabin-2022]
    - text: "Crear flujos transónicos en 2D con fluidos de luz y extraer parámetros de espectros ruidosos con inferencia basada en simulación."
      papers: [jacquet-2020b, solidoro-2026]
