  summary: "Varias afirmaciones de energía positiva fallaron porque solo se evaluó al observador euleriano; en un perfil irrotacional, esa lectura omite cerca del 73 % de las violaciones de la WEC en la pared. También hay errores de hasta 21 órdenes de magnitud en invariantes publicados. Hoy existen certificados por intervalos que comprueban la NEC, la WEC y la SEC para todas las direcciones causales."
