[package]
name = "curvatura-desktop"
version = "0.1.0"
edition = "2021"
description = "Curvatura: biblioteca, ecuaciones y laboratorio del motor de curvatura."
license-file = "../../../LICENSE"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
curvatura-core = { path = "../../../solvers/rust" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
