[package]
name = "curvatura-desktop"
version = "0.1.0"
edition = "2021"
description = "Curvatura: biblioteca, ecuaciones y laboratorio del motor de curvatura."
license-file = "../../../LICENSE"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tokio = { version = "1", features = ["time", "process", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
curvatura-core = { path = "../../../solvers/rust", features = ["parallel", "gpu"] }
tauri-plugin-shell = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
