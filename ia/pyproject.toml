[project]
name = "curvatura-ia"
version = "0.1.0"
description = "IA de investigación de Curvatura: corpus completo, análisis, vectores multimodales, patentes y agente con RAG."
requires-python = ">=3.13"
license = { file = "../LICENSE" }
authors = [{ name = "Pablo Nolasco" }]
dependencies = [
  "curvatura[lab]",
  "lancedb>=0.40",
  "pyarrow>=18",
  "fastembed>=0.9",
  "numpy>=2.0",
  "pillow>=11",
  "pypdfium2>=5",
  "mcp>=1.10",
  "anthropic>=0.70",
  "openai>=1.100",
  "pyyaml>=6",
]

[project.optional-dependencies]
# PDF difíciles (escaneados, ecuaciones en imagen): docling con fórmulas a LaTeX. Pesado (PyTorch).
pdf = ["docling>=2.140", "rapidocr>=3.10"]

# Vectorizar en GPU (Apple Silicon o NVIDIA): modelo de calidad en horas en vez de días.
gpu = ["sentence-transformers>=5", "torch>=2.8"]

[project.scripts]
curvatura-ia = "curvatura_ia.cli:main"

[tool.uv.sources]
curvatura = { path = "../physics", editable = true }

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["curvatura_ia"]
