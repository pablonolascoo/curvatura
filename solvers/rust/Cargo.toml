[package]
name = "curvatura-core"
version = "0.1.0"
edition = "2021"
description = "Núcleo numérico de Curvatura: campos de Alcubierre, energía y geodésicas. Nativo y WebAssembly."
license-file = "../../LICENSE"
publish = false

[features]
default = []
# Paralelo en todos los núcleos (app de escritorio). La web usa WebAssembly de un hilo.
parallel = ["dep:rayon"]
# GPU (Metal, DirectX 12, Vulkan) con wgpu: campos en precisión simple a millones de puntos por milisegundo.
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck", "parallel"]

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"], optional = true }
pollster = { version = "1.0.1", optional = true }
rayon = { version = "1", optional = true }
wgpu = { version = "30.0.1", optional = true }

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[dev-dependencies]
rayon = "1"
