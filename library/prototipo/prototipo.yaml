      color: "ink"
    material:
      nombre:
        es: "Cobre libre de oxígeno"
        en: "Oxygen-free copper"
        fr: "Cuivre exempt d'oxygène"
      designacion: "Cobre OFE C10100, ASTM B170"
      composicion:
        - { elemento: "Cu", porcentaje_masa: "≥ 99.99" }
      por_que:
        es: "Máxima conductividad y sin fragilización por hidrógeno; aguanta ciclos térmicos largos."
        en: "Highest conductivity and no hydrogen embrittlement; withstands long thermal cycling."
        fr: "Conductivité maximale et pas de fragilisation par l'hydrogène ; résiste aux longs cycles thermiques."
      propiedades:
        - { nombre: "Conductividad eléctrica", valor: "101", unidad: "% IACS", fuente: "ASTM B170 / Copper Development Association" }
        - { nombre: "Densidad", valor: "8.94", unidad: "g/cm³", fuente: "Copper Development Association" }
    electronica:
      - { elemento: "Transceptor óptico al exterior", especificacion: "Láser 1550 nm, modulación coherente", por_que: { es: "Única vía de datos a través de la cáscara, si es transparente." } }
    cableado:
      - { tramo: "Bus de potencia 28 V", tipo: "cobre OFE con aislamiento PTFE, trenzado", por_que: { es: "Pocas pérdidas y resistente a radiación." } }
      - { tramo: "Datos de sensores", tipo: "fibra monomodo SMF-28 1550 nm", por_que: { es: "Sin interferencias y ligera." } }
      - { tramo: "Señales de tiempo", tipo: "coaxial RG-402 semirrígido", por_que: { es: "Retardo estable para el sensor de tránsito." } }
    cifras: []
    boceto:
      es: "Mazo de cables en bandeja recorriendo la celosía, con ramales a cada caja y un enlace óptico que apunta hacia la pared."
