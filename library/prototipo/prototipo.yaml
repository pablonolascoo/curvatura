      - { tramo: "Red de FBG", tipo: "fibra monomodo SMF-28 1550 nm", por_que: { es: "Un solo cable lee decenas de galgas." } }
    cifras: []
    boceto:
      es: "Celosía octaédrica alrededor del módulo, con tres anillos ortogonales y nodos marcados."
    siguiente_paso:
      es: "Decidir cómo se mantiene la celosía centrada (propulsores o anclaje) sin cargar la pared de R1."
      en: "Decide how the truss stays centred (thrusters or anchoring) without loading the R1 wall."
      fr: "Décider comment le treillis reste centré (propulseurs ou ancrage) sans charger la paroi en R1."

  - id: "sensor-transito"
    nivel: "vehiculo"
    nombre:
      es: "Sensor de tránsito de luz (prueba del desplazamiento)"
      en: "Light-transit sensor (shift test)"
      fr: "Capteur de transit lumineux (test du décalage)"
    funcion:
      es: "Envía rayos a favor y en contra del desplazamiento por el centro y mide su diferencia δt: distingue una cáscara warp de una cáscara normal."
      en: "Sends rays along and against the shift through the centre and measures their difference δt: tells a warp shell from a normal one."
      fr: "Envoie des rayons dans et contre le sens du décalage à travers le centre et mesure leur différence δt : distingue une coque warp d'une coque normale."
    estado: "calculado"
    obstaculos: [13]
    geometria:
      tipo: "cilindro"
      radio_m: 0.3
      dimensiones_m: [18, 0.6, 0.6]
      posicion_m: [0, 3, 0]
      color: "blue"
    material:
      nombre:
        es: "Vidrio cerámico de dilatación nula (espejos)"
        en: "Zero-expansion glass-ceramic (mirrors)"
        fr: "Vitrocéramique à dilatation nulle (miroirs)"
      designacion: "ZERODUR Clase 0 (SCHOTT)"
      composicion:
        - { elemento: "SiO2", porcentaje_masa: "57.2" }
        - { elemento: "Al2O3", porcentaje_masa: "25.3" }
        - { elemento: "P2O5", porcentaje_masa: "7.9" }
        - { elemento: "Li2O", porcentaje_masa: "3.7" }
        - { elemento: "otros (TiO2, ZrO2, ZnO, MgO, Na2O)", porcentaje_masa: "resto" }
      por_que:
        es: "Dilatación casi nula: la distancia entre espejos no cambia con la temperatura y no falsea δt."
        en: "Near-zero expansion: mirror spacing does not change with temperature and does not bias δt."
        fr: "Dilatation quasi nulle : l'écart entre miroirs ne varie pas avec la température et ne fausse pas δt."
      propiedades:
        - { nombre: "Coeficiente de dilatación (0–50 °C), clase 0", valor: "0 ± 0.02e-6", unidad: "1/K", fuente: "Ficha técnica SCHOTT ZERODUR" }
        - { nombre: "Densidad", valor: "2.53", unidad: "g/cm³", fuente: "Ficha técnica SCHOTT ZERODUR" }
    electronica:
      - { elemento: "Láseres pulsados 1064 nm", especificacion: "Pulsos de 10 ps, dos emisores-detectores A y B", por_que: { es: "Rayos en ambos sentidos por el centro, como en Fuchs." } }
      - { elemento: "Detectores SPAD", especificacion: "Jitter < 30 ps", por_que: { es: "Marca la llegada de cada pulso." } }
      - { elemento: "Etiquetador de tiempos + reloj óptico", especificacion: "≤ 10 ps; estabilidad 1e-15", por_que: { es: "δt = 7,6 ns se mide con holgura; el reloj vigila la deriva." } }
    cableado:
      - { tramo: "Emisores → etiquetador", tipo: "fibra monomodo 1064 nm de retardo calibrado", por_que: { es: "Retardo conocido y estable entre A y B." } }
    cifras:
      - { nombre: "δt cáscara warp", valor: "7.6e-9", unidad: "s", fuente: "fuchs-2024 · https://arxiv.org/abs/2405.02709" }
      - { nombre: "δt cáscara de materia sin desplazamiento", valor: "0", unidad: "s", fuente: "fuchs-2024 · https://arxiv.org/abs/2405.02709" }
    boceto:
      es: "Dos emisores-detectores enfrentados a lo largo del eje x, espejos fuera de la cáscara y trayectorias de ida y vuelta."
    siguiente_paso:
      es: "Calcular δt para la cáscara corregida de 0,18 M_J y comprobar que sigue siendo invariante."
      en: "Compute δt for the corrected 0.18 M_J shell and check it is still invariant."
      fr: "Calculer δt pour la coque corrigée de 0,18 M_J et vérifier qu'il reste invariant."

  - id: "potencia"
    nivel: "vehiculo"
    nombre:
      es: "Potencia de a bordo"
      en: "Onboard power"
      fr: "Puissance de bord"
    funcion:
      es: "Da electricidad al módulo y a los sensores. No mueve la cáscara: su energía la pone la infraestructura de montaje."
      en: "Powers the module and sensors. It does not move the shell: that energy comes from the assembly infrastructure."
      fr: "Alimente le module et les capteurs. Elle ne déplace pas la coque : cette énergie vient de l'infrastructure d'assemblage."
    estado: "boceto"
    obstaculos: [2]
    geometria:
      tipo: "caja"
      dimensiones_m: [1.2, 1.2, 1.5]
      posicion_m: [-5, 0, -2]
      color: "green"
    material:
      nombre:
        es: "Dióxido de plutonio-238 (fuente de calor)"
        en: "Plutonium-238 dioxide (heat source)"
        fr: "Dioxyde de plutonium-238 (source de chaleur)"
      designacion: "PuO2 en módulos GPHS con vaina de iridio (tipo MMRTG)"
      composicion:
        - { elemento: "Pu", porcentaje_masa: "88.2" }
        - { elemento: "O", porcentaje_masa: "11.8" }
      por_que:
        es: "Calor estable durante décadas sin repostar; la masa es despreciable frente a la cáscara."
        en: "Stable heat for decades without refuelling; its mass is negligible next to the shell."
        fr: "Chaleur stable pendant des décennies sans recharge ; sa masse est négligeable face à la coque."
      propiedades:
        - { nombre: "Periodo de semidesintegración del Pu-238", valor: "87.7", unidad: "años", fuente: "NNDC / ENSDF" }
    electronica:
      - { elemento: "Conversión termoeléctrica", especificacion: "Pares PbTe/TAGS, ≈ 110 W eléctricos al inicio por unidad", por_que: { es: "Sin piezas móviles." } }
      - { elemento: "Regulador y baterías Li-ion", especificacion: "Bus de 28 V", por_que: { es: "Picos de consumo de láseres y propulsores." } }
    cableado:
      - { tramo: "Generador → bus de 28 V", tipo: "cobre OFE con aislamiento PTFE, trenzado", por_que: { es: "Pocas pérdidas y aislamiento resistente a radiación." } }
    cifras:
      - { nombre: "Energía cinética mínima de la cáscara publicada a v = 0,02 (cota inferior)", valor: "8.07e40", unidad: "J", fuente: "laboratorio: lab_evaluar((1/sqrt(1-v^2)-1)*M*c^2, v=0.02, M=4.49e27)" }
    boceto:
      es: "Caja con aletas de radiador y el símbolo de fuente radiactiva, conectada al bus del módulo."
    siguiente_paso:
      es: "Hacer el presupuesto eléctrico del módulo y sensores para dimensionar el número de unidades."
      en: "Draw up the module and sensor power budget to size the number of units."
      fr: "Établir le bilan électrique du module et des capteurs pour dimensionner le nombre d'unités."

  - id: "termico"
    nivel: "vehiculo"
    nombre:
      es: "Control térmico y radiadores"
      en: "Thermal control and radiators"
      fr: "Contrôle thermique et radiateurs"
    funcion:
      es: "Saca el calor del módulo. Dentro de una cáscara cerrada no hay cielo frío: nadie ha calculado si el calor atraviesa la pared."
      en: "Removes heat from the module. Inside a closed shell there is no cold sky: nobody has computed whether heat crosses the wall."
      fr: "Évacue la chaleur du module. Dans une coque fermée il n'y a pas de ciel froid : personne n'a calculé si la chaleur traverse la paroi."
    estado: "abierto"
    obstaculos: [7, 8]
    geometria:
      tipo: "placa"
      dimensiones_m: [4.0, 0.05, 2.0]
      posicion_m: [0, -4, 0]
      color: "green"
    material:
      nombre:
        es: "Aluminio 6063-T6 (tubos de lazo de amoníaco)"
        en: "Aluminium 6063-T6 (ammonia loop tubing)"
        fr: "Aluminium 6063-T6 (tubes de boucle à ammoniac)"
      designacion: "AA 6063-T6, ASTM B221"
      composicion:
        - { elemento: "Al", porcentaje_masa: "resto" }
        - { elemento: "Mg", porcentaje_masa: "0.45–0.9" }
        - { elemento: "Si", porcentaje_masa: "0.2–0.6" }
      por_que:
        es: "Se extruye en perfiles con canales y es compatible con amoníaco, como en la Estación Espacial."
        en: "Extrudes into channelled profiles and is ammonia-compatible, as on the Space Station."
        fr: "S'extrude en profilés à canaux et est compatible avec l'ammoniac, comme sur la Station spatiale."
      propiedades:
        - { nombre: "Densidad", valor: "2.70", unidad: "g/cm³", fuente: "ASM Handbook, Vol. 2" }
        - { nombre: "Conductividad térmica", valor: "200", unidad: "W/(m·K)", fuente: "ASM Handbook, Vol. 2" }
    electronica:
      - { elemento: "Bombas del lazo", especificacion: "Redundantes, control de caudal", por_que: { es: "Mueven el calor del módulo al radiador." } }
      - { elemento: "Sensores de temperatura PT100", especificacion: "Clase A, ±0,15 °C", por_que: { es: "Vigilancia del lazo." } }
    cableado:
      - { tramo: "PT100 → control", tipo: "par trenzado apantallado a 4 hilos", por_que: { es: "Medida sin error por resistencia del cable." } }
    cifras: []
    boceto:
      es: "Panel radiador plano con serpentín, flechas de calor que chocan con la pared de la cáscara y un signo de interrogación."
    siguiente_paso:
      es: "Calcular el transporte radiativo a través de la cáscara con su ecuación de estado; sin eso no hay sumidero de calor."
      en: "Compute radiative transport through the shell with its equation of state; without it there is no heat sink."
      fr: "Calculer le transport radiatif à travers la coque avec son équation d'état ; sans cela il n'y a pas de puits de chaleur."

  - id: "control-guiado"
    nivel: "vehiculo"
    nombre:
      es: "Control y guiado"
      en: "Control and guidance"
      fr: "Contrôle et guidage"
    funcion:
      es: "Mantiene la actitud del módulo. No puede cambiar la velocidad de la cáscara: eso exige escape de masa o un tercer cuerpo."
      en: "Keeps the module's attitude. It cannot change the shell's velocity: that needs mass ejection or a third body."
      fr: "Maintient l'attitude du module. Il ne peut pas changer la vitesse de la coque : cela exige une éjection de masse ou un troisième corps."
    estado: "abierto"
    obstaculos: [2, 12]
    geometria:
      tipo: "caja"
      dimensiones_m: [0.8, 0.8, 0.6]
      posicion_m: [3.5, 0, 1.5]
      color: "red"
    material:
      nombre:
        es: "Aleación Fe-Ni-Co de sellado (encapsulados)"
        en: "Fe-Ni-Co sealing alloy (packages)"
        fr: "Alliage Fe-Ni-Co de scellement (boîtiers)"
      designacion: "Kovar, ASTM F15"
      composicion:
        - { elemento: "Fe", porcentaje_masa: "resto" }
        - { elemento: "Ni", porcentaje_masa: "29" }
        - { elemento: "Co", porcentaje_masa: "17" }
      por_que:
        es: "Dilata como el vidrio y la cerámica: encapsulados herméticos para electrónica endurecida que duran décadas."
        en: "Expands like glass and ceramics: hermetic packages for hardened electronics that last decades."
        fr: "Se dilate comme le verre et la céramique : boîtiers hermétiques pour électronique durcie qui durent des décennies."
      propiedades:
        - { nombre: "Densidad", valor: "8.36", unidad: "g/cm³", fuente: "Ficha técnica Carpenter Kovar" }
    electronica:
      - { elemento: "Ordenador de vuelo endurecido", especificacion: "Procesador tolerante a radiación (clase RAD750), triple redundancia", por_que: { es: "Fiabilidad en entorno con partículas." } }
      - { elemento: "Unidad inercial de fibra óptica", especificacion: "Deriva < 0,01 °/h", por_que: { es: "Actitud sin referencia externa dentro de la cáscara." } }
      - { elemento: "Propulsores de gas frío", especificacion: "N2, 1 N", por_que: { es: "Mantener el módulo centrado en la región plana." } }
    cableado:
      - { tramo: "Ordenador → actuadores", tipo: "par trenzado apantallado (MIL-STD-1553B)", por_que: { es: "Bus robusto y redundante estándar en vuelo." } }
    cifras:
      - { nombre: "Ley del momento ADM (sin escape ni tercer cuerpo no cambia)", valor: "ley", unidad: "—", fuente: "docs/investigacion/ideas/c-aceleracion.md; bobrick-martire-2021 · https://arxiv.org/abs/2102.06824" }
    boceto:
      es: "Caja de aviónica con IMU, ordenador y cuatro toberas de gas frío; flecha tachada sobre la cáscara (no la puede acelerar)."
    siguiente_paso:
      es: "Simular en 1+1 el colapso de la cáscara para saber qué se puede controlar y qué no durante el montaje."
      en: "Simulate the shell's collapse in 1+1 to know what can and cannot be controlled during assembly."
      fr: "Simuler en 1+1 l'effondrement de la coque pour savoir ce qui est contrôlable pendant l'assemblage."

  - id: "interfaz-montaje"
    nivel: "vehiculo"
    nombre:
      es: "Interfaz de montaje en movimiento"
      en: "In-motion assembly interface"
      fr: "Interface d'assemblage en mouvement"
    funcion:
      es: "Puntos donde llegan las corrientes de materia lanzadas desde fuera a 0,02 c para formar la cáscara ya en movimiento."
      en: "Points where matter streams launched from outside at 0.02 c arrive to form the shell already moving."
      fr: "Points où arrivent les flux de matière lancés de l'extérieur à 0,02 c pour former la coque déjà en mouvement."
    estado: "abierto"
    obstaculos: [2, 12]
    geometria:
      tipo: "anillo"
      radio_m: 24
      posicion_m: [0, 0, 0]
      color: "yellow"
    material:
      nombre:
        es: "Acero maraging (estructura de acople de la infraestructura)"
        en: "Maraging steel (infrastructure docking structure)"
        fr: "Acier maraging (structure d'amarrage de l'infrastructure)"
      designacion: "Acero maraging 18Ni(350), UNS K93160"
      composicion:
        - { elemento: "Fe", porcentaje_masa: "resto" }
        - { elemento: "Ni", porcentaje_masa: "18" }
        - { elemento: "Co", porcentaje_masa: "12" }
        - { elemento: "Mo", porcentaje_masa: "4.8" }
        - { elemento: "Ti", porcentaje_masa: "1.4" }
        - { elemento: "Al", porcentaje_masa: "0.1" }
      por_que:
        es: "Máxima resistencia en acero con buena tenacidad para guías de lanzamiento. Aun así su arrastre como cáscara sería de 0,012 m/s: solo vale para la infraestructura."
        en: "Highest steel strength with good toughness for launch guides. Even so, as a shell its drag would be 0.012 m/s: it is only fit for the infrastructure."
        fr: "Résistance maximale pour un acier avec bonne ténacité pour les guides de lancement. Même ainsi, comme coque son entraînement serait de 0,012 m/s : il ne sert qu'à l'infrastructure."
      propiedades:
        - { nombre: "Resistencia a tracción (envejecido)", valor: "2410", unidad: "MPa", fuente: "ASM Handbook, Vol. 1 (aceros maraging)" }
        - { nombre: "Densidad", valor: "8.08", unidad: "g/cm³", fuente: "ASM Handbook, Vol. 1 (aceros maraging)" }
    electronica:
      - { elemento: "Telemetría de las corrientes de materia", especificacion: "Radar y lidar de alcance, sincronía < 1 ns", por_que: { es: "La materia debe llegar a la vez desde todas las direcciones." } }
    cableado:
      - { tramo: "Estaciones de lanzamiento ↔ cáscara", tipo: "enlace láser en espacio libre 1550 nm", por_que: { es: "No hay cable posible entre cuerpos separados a gran distancia." } }
    cifras:
      - { nombre: "Energía cinética mínima con la masa publicada", valor: "8.07e40", unidad: "J", fuente: "laboratorio: lab_evaluar((1/sqrt(1-v^2)-1)*M*c^2, v=0.02, M=4.49e27)" }
      - { nombre: "Energía cinética mínima con el suelo corregido (3,5e26 kg)", valor: "6.3e39", unidad: "J", fuente: "laboratorio: lab_evaluar((1/sqrt(1-v^2)-1)*M*c^2, v=0.02, M=3.5e26)" }
      - { nombre: "Ventaja frente a un cohete de fotones", valor: "≈ 101", unidad: "veces", fuente: "docs/investigacion/ideas/f-critica-cruzada.md (c2)" }
      - { nombre: "Gravedad en la superficie R2 (masa publicada)", valor: "7.5e14", unidad: "m/s²", fuente: "laboratorio: lab_evaluar(G*M/R^2, M=4.49e27, R=20)" }
    boceto:
      es: "Anillo ecuatorial exterior con chorros de materia convergentes desde varias direcciones, todos con una flecha común de velocidad 0,02 c."
    siguiente_paso:
      es: "Colapso esférico 1+1 de polvo hasta la cáscara de Fuchs: ¿se llega sin horizonte y cuánta energía se radia?"
      en: "Spherical 1+1 collapse of dust into the Fuchs shell: is it reached without a horizon and how much energy is radiated?"
      fr: "Effondrement sphérique 1+1 de poussière jusqu'à la coque de Fuchs : y arrive-t-on sans horizon et combien d'énergie est rayonnée ?"

  - id: "cableado-vehiculo"
    nivel: "vehiculo"
    nombre:
      es: "Cableado y comunicaciones"
      en: "Cabling and communications"
      fr: "Câblage et communications"
    funcion:
      es: "Une potencia, sensores y control dentro de la región plana; el enlace con el exterior atraviesa la cáscara solo como luz."
      en: "Links power, sensors and control inside the flat region; the link to the outside crosses the shell only as light."
      fr: "Relie puissance, capteurs et contrôle dans la région plate ; le lien vers l'extérieur traverse la coque uniquement sous forme de lumière."
    estado: "boceto"
    obstaculos: [7]
