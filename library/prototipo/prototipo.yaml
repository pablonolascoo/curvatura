# Desglose de ingeniería del prototipo (página «Prototipo», vista 3D explosionada).
# Fuentes: docs/investigacion/soluciones.md, ideas/A–F, docs/obstaculos.md, laboratorio del MCP curvatura.
# Cifras: «laboratorio: <entrada>» = lab_evaluar del MCP; el resto, cita con url o norma/ficha técnica.
version: 1
generado: "IA · 2026-10-22 · puede contener errores; verificar"

niveles:
  - id: "mesa"
    nombre:
      es: "Demostrador de mesa"
      en: "Tabletop demonstrator"
      fr: "Démonstrateur de table"
    descripcion:
      es: "Experimentos que se pueden montar hoy para poner a prueba las leyes y el único camino que sobrevive. No crean curvatura: miden los límites que deciden si el camino sigue vivo."
      en: "Experiments that can be built today to test the laws and the only surviving path. They create no curvature: they measure the limits that decide whether the path stays alive."
      fr: "Expériences réalisables aujourd'hui pour tester les lois et la seule voie qui survit. Elles ne créent aucune courbure : elles mesurent les limites qui décident si la voie reste vivante."
  - id: "vehiculo"
    nombre:
      es: "Vehículo conceptual"
      en: "Conceptual vehicle"
      fr: "Véhicule conceptuel"
    descripcion:
      es: "Cáscara subluminal de energía positiva (Fuchs 2024), montada ya en movimiento a β ≈ 0,02, descompuesta en piezas. No se puede construir: la cáscara pide materia más densa que una estrella de neutrones y varias piezas están bloqueadas por leyes."
      en: "Subluminal positive-energy shell (Fuchs 2024), assembled already moving at β ≈ 0.02, broken into parts. It cannot be built: the shell needs matter denser than a neutron star and several parts are blocked by laws."
      fr: "Coque subluminique à énergie positive (Fuchs 2024), assemblée déjà en mouvement à β ≈ 0,02, décomposée en pièces. Elle n'est pas constructible : la coque exige une matière plus dense qu'une étoile à neutrons et plusieurs pièces sont bloquées par des lois."

piezas:
  # ───────────────────────────── NIVEL MESA ─────────────────────────────
  # Escala: mesa óptica de 3,0 × 1,5 m; origen en el centro de la mesa, z hacia arriba.

  - id: "fuente-luz-comprimida"
    nivel: "mesa"
    nombre:
      es: "Banco de luz comprimida (prueba de la QEI)"
      en: "Squeezed-light bench (QEI test)"
      fr: "Banc de lumière comprimée (test de la QEI)"
    funcion:
      es: "Genera vacío comprimido a −15 dB y mide su varianza para contrastar la desigualdad cuántica electromagnética."
      en: "Generates −15 dB squeezed vacuum and measures its variance to test the electromagnetic quantum inequality."
      fr: "Produit un vide comprimé à −15 dB et mesure sa variance pour tester l'inégalité quantique électromagnétique."
    estado: "calculado"
    obstaculos: [3, 14]
    geometria:
      tipo: "caja"
      dimensiones_m: [0.9, 0.6, 0.25]
      posicion_m: [-0.9, 0.35, 0.125]
      color: "red"
    material:
      nombre:
        es: "Cristal no lineal PPKTP"
        en: "PPKTP nonlinear crystal"
        fr: "Cristal non linéaire PPKTP"
      designacion: "KTiOPO4 con polarización periódica (PPKTP), corte para cuasi-ajuste de fase 775 → 1550 nm"
      composicion:
        - { elemento: "K", porcentaje_masa: "21.5" }
        - { elemento: "Ti", porcentaje_masa: "26.3" }
        - { elemento: "P", porcentaje_masa: "17.0" }
        - { elemento: "O", porcentaje_masa: "35.2" }
      por_que:
        es: "Pocas pérdidas y alto coeficiente no lineal: la compresión a −15 dB solo sobrevive si las pérdidas totales son de pocos por ciento."
        en: "Low loss and high nonlinearity: −15 dB squeezing survives only if total losses are a few percent."
        fr: "Faibles pertes et forte non-linéarité : la compression à −15 dB ne survit que si les pertes totales sont de quelques pour cent."
      propiedades:
        - { nombre: "Densidad", valor: "3.0", unidad: "g/cm³", fuente: "Ficha técnica de KTP (Raicol Crystals)" }
        - { nombre: "Transparencia", valor: "0.35–4.5", unidad: "µm", fuente: "Ficha técnica de KTP (Raicol Crystals)" }
    electronica:
      - { elemento: "Láser semilla de fibra 1550 nm", especificacion: "Anchura de línea < 1 kHz, 2 W tras amplificador EDFA", por_que: { es: "Bombeo estable para el OPA y oscilador local de la homodina." } }
      - { elemento: "Etapa SHG 1550 → 775 nm", especificacion: "PPKTP en cavidad, > 1 W a 775 nm", por_que: { es: "El bombeo del OPA debe estar al doble de frecuencia." } }
      - { elemento: "Detector homodino equilibrado", especificacion: "Fotodiodos InGaAs de eficiencia cuántica > 99 %, ancho de banda 100 MHz", por_que: { es: "Cada pérdida de eficiencia degrada la compresión medida." } }
      - { elemento: "Bloqueo Pound-Drever-Hall", especificacion: "Modulador electro-óptico a 30 MHz + lazo digital", por_que: { es: "Mantiene la cavidad del OPA y la fase de lectura fijas durante la medida." } }
      - { elemento: "Analizador de espectro", especificacion: "9 kHz–3 GHz, RBW ≥ 1 Hz", por_que: { es: "Mide la varianza de cuadratura frente al ruido del vacío." } }
    cableado:
      - { tramo: "Láser → SHG → OPA", tipo: "fibra monomodo PM 1550 nm (PANDA)", por_que: { es: "Conserva la polarización que exige el cuasi-ajuste de fase." } }
      - { tramo: "Fotodiodos → amplificador transimpedancia", tipo: "coaxial RG-402 semirrígido", por_que: { es: "Mínimo ruido captado y fase estable en RF." } }
      - { tramo: "Lazos de control → actuadores piezo", tipo: "par trenzado apantallado", por_que: { es: "Evita que la red eléctrica entre en el lazo de bloqueo." } }
    cifras:
      - { nombre: "Varianza de cuadratura relativa al vacío a −15 dB", valor: "0.0316", unidad: "—", fuente: "laboratorio: lab_evaluar(10^(-x/10), x=15)" }
      - { nombre: "Compresión récord usada en el metaanálisis", valor: "-15", unidad: "dB", fuente: "maclay-2018 · https://arxiv.org/abs/1806.01269" }
      - { nombre: "Cota de Ford-Roman con ventana lorentziana", valor: "-3ħc/(16π²(c t0)⁴)", unidad: "J/m³", fuente: "maclay-2018 (ec. 1) · https://arxiv.org/abs/1806.01269" }
    boceto:
      es: "Vista en planta: láser, SHG, cavidad OPA en lazo, divisor 50/50 y dos fotodiodos con su resta; flechas de 1550 y 775 nm."
    siguiente_paso:
      es: "Rehacer el análisis de Maclay con la QEI de Fewster y la respuesta real del detector: ¿el cociente medido/cota cruza 1?"
      en: "Redo Maclay's analysis with Fewster's QEI and the real detector response: does the measured/bound ratio cross 1?"
      fr: "Refaire l'analyse de Maclay avec la QEI de Fewster et la réponse réelle du détecteur : le rapport mesure/borne dépasse-t-il 1 ?"

  - id: "canal-analogo"
    nivel: "mesa"
    nombre:
      es: "Canal hidráulico análogo (burbuja que respira)"
      en: "Analogue water flume (breathing bubble)"
      fr: "Canal hydraulique analogue (bulle qui respire)"
    funcion:
      es: "Reproduce con agua la cinemática de una burbuja de velocidad variable y mide la gravedad superficial de sus horizontes acústicos."
      en: "Reproduces with water the kinematics of a variable-speed bubble and measures the surface gravity of its acoustic horizons."
      fr: "Reproduit avec de l'eau la cinématique d'une bulle à vitesse variable et mesure la gravité de surface de ses horizons acoustiques."
    estado: "calculado"
    obstaculos: [4, 5, 14]
    geometria:
      tipo: "caja"
      dimensiones_m: [2.6, 0.15, 0.3]
      posicion_m: [0.0, -0.55, 0.15]
      color: "blue"
    material:
      nombre:
        es: "PMMA colado (metacrilato)"
        en: "Cast PMMA (acrylic)"
        fr: "PMMA coulé (acrylique)"
      designacion: "Poli(metacrilato de metilo) colado, ISO 7823-1"
      composicion:
        - { elemento: "C", porcentaje_masa: "60.0" }
        - { elemento: "H", porcentaje_masa: "8.1" }
        - { elemento: "O", porcentaje_masa: "32.0" }
      por_que:
        es: "Transparente para la lámina láser y la cámara; rígido y sin corrosión. El análogo copia la métrica, no la fuente: no prueba las ecuaciones de Einstein."
        en: "Transparent for the laser sheet and camera; stiff and corrosion-free. The analogue copies the metric, not the source: it does not test Einstein's equations."
        fr: "Transparent pour la nappe laser et la caméra ; rigide et sans corrosion. L'analogue copie la métrique, pas la source : il ne teste pas les équations d'Einstein."
      propiedades:
        - { nombre: "Densidad", valor: "1.19", unidad: "g/cm³", fuente: "ISO 7823-1 / ficha PLEXIGLAS GS (Röhm)" }
        - { nombre: "Transmisión luminosa (3 mm)", valor: "92", unidad: "%", fuente: "Ficha PLEXIGLAS GS (Röhm)" }
    electronica:
      - { elemento: "Bomba con variador de frecuencia", especificacion: "Caudal programable v(t) con perfil periódico, control por FPGA", por_que: { es: "Impone la velocidad del flujo que cambia entre fase lenta y rápida." } }
      - { elemento: "Sondas de nivel capacitivas", especificacion: "8 sondas, resolución 10 µm, 1 kHz", por_que: { es: "Miden la conversión de modos en la pared delantera." } }
      - { elemento: "PIV: láser verde de lámina + cámara rápida", especificacion: "532 nm, 1 kfps, 4 Mpx", por_que: { es: "Mapa del perfil de velocidad v(x) para extraer κ." } }
    cableado:
      - { tramo: "Sondas → DAQ", tipo: "par trenzado apantallado", por_que: { es: "Señales de baja tensión junto a una bomba con variador ruidoso." } }
      - { tramo: "Cámara → ordenador", tipo: "CoaXPress sobre coaxial 75 Ω", por_que: { es: "Ancho de banda para vídeo rápido sin compresión." } }
    cifras:
      - { nombre: "Velocidad de las ondas con 5 cm de agua (√(gh))", valor: "0.70", unidad: "m/s", fuente: "laboratorio: lab_evaluar(sqrt(g*h), g=9.81, h=0.05)" }
      - { nombre: "κ/σ con v = 0,9 (lento) y v = 10 (rápido)", valor: "-0.22 ; 1.8", unidad: "—", fuente: "laboratorio: lab_evaluar(2*s*(1-1/v), s=1, v=[0.9, 10])" }
      - { nombre: "Ley κ = 2σ(1 − 1/v)", valor: "demostrada", unidad: "—", fuente: "docs/investigacion/ideas/f-critica-cruzada.md (b1, lab_igual)" }
      - { nombre: "Emisión estimulada tipo Hawking en canal de agua", valor: "medida", unidad: "—", fuente: "weinfurtner-2011 · https://arxiv.org/abs/1008.1911" }
    boceto:
      es: "Canal largo con obstáculo móvil, flechas de flujo variable, lámina láser vertical y ocho sondas en fila."
    siguiente_paso:
      es: "Diseñar el perfil v(x,t) del obstáculo con la métrica acústica y predecir la conversión de modos en cada transición."
      en: "Design the obstacle's v(x,t) profile with the acoustic metric and predict mode conversion at each transition."
      fr: "Concevoir le profil v(x,t) de l'obstacle avec la métrique acoustique et prédire la conversion de modes à chaque transition."

  - id: "balanza-cascara"
    nivel: "mesa"
    nombre:
      es: "Balanza de torsión con cáscara de wolframio"
      en: "Torsion balance with tungsten shell"
      fr: "Balance de torsion avec coque en tungstène"
    funcion:
      es: "Comprueba en campo débil que el interior de una cáscara es plano (campo nulo) y calibra la cadena de gravimetría."
      en: "Checks in weak field that a shell's interior is flat (zero field) and calibrates the gravimetry chain."
      fr: "Vérifie en champ faible que l'intérieur d'une coque est plat (champ nul) et étalonne la chaîne de gravimétrie."
    estado: "calculado"
    obstaculos: [6, 13]
    geometria:
      tipo: "cascara"
      radio_m: 0.15
      posicion_m: [0.9, 0.35, 0.3]
      color: "ink"
    material:
      nombre:
        es: "Aleación pesada de wolframio"
        en: "Tungsten heavy alloy"
        fr: "Alliage lourd de tungstène"
      designacion: "ASTM B777 Clase 4 (W-Ni-Fe, 97 % W)"
      composicion:
        - { elemento: "W", porcentaje_masa: "97" }
        - { elemento: "Ni", porcentaje_masa: "2.1" }
        - { elemento: "Fe", porcentaje_masa: "0.9" }
      por_que:
        es: "Máxima densidad mecanizable: más masa por volumen da más señal gravitatoria, y el Ni-Fe permite mecanizar la cáscara hueca."
        en: "Highest machinable density: more mass per volume gives more gravity signal, and the Ni-Fe binder lets the hollow shell be machined."
        fr: "Densité usinable maximale : plus de masse par volume donne plus de signal gravitationnel, et le liant Ni-Fe permet d'usiner la coque creuse."
      propiedades:
        - { nombre: "Densidad", valor: "18.25–18.85", unidad: "g/cm³", fuente: "ASTM B777, Clase 4" }
    electronica:
      - { elemento: "Autocolimador óptico", especificacion: "Resolución < 10 nrad", por_que: { es: "Lee el giro del péndulo de torsión." } }
      - { elemento: "Control térmico", especificacion: "Estabilidad ±1 mK con termistores NTC y calentadores Peltier", por_que: { es: "La deriva térmica de la fibra imita una señal gravitatoria." } }
      - { elemento: "Bomba iónica", especificacion: "Vacío < 1e-6 mbar", por_que: { es: "Quita el ruido de gas en el péndulo." } }
    cableado:
      - { tramo: "Termistores → DAQ", tipo: "par trenzado apantallado", por_que: { es: "Lecturas de mK sin ruido inducido." } }
      - { tramo: "Autocolimador → DAQ", tipo: "fibra multimodo OM4", por_que: { es: "Aislamiento galvánico y sin cargas térmicas cerca del péndulo." } }
    cifras:
      - { nombre: "Campo exterior de 100 kg a 0,3 m", valor: "7.4e-8", unidad: "m/s²", fuente: "laboratorio: lab_evaluar(G*M/r^2, M=100, r=0.3)" }
      - { nombre: "Campo interior esperado (teorema de la cáscara)", valor: "0", unidad: "m/s²", fuente: "Teorema de Newton de la cáscara; interior plano en fuchs-2024 · https://arxiv.org/abs/2405.02709" }
    boceto:
      es: "Esfera hueca partida en dos mitades, péndulo de torsión que entra por un orificio polar, autocolimador fuera de la campana de vacío."
    siguiente_paso:
      es: "Calcular el residuo esperado por el orificio polar y la asimetría de mecanizado antes de comprar el material."
      en: "Compute the expected residual from the polar hole and machining asymmetry before buying material."
      fr: "Calculer le résidu attendu dû à l'orifice polaire et à l'asymétrie d'usinage avant d'acheter le matériau."

  - id: "ensayo-rotura-giro"
    nivel: "mesa"
    nombre:
      es: "Ensayo de rotura por giro (ley de materiales)"
      en: "Spin-burst test (materials law)"
      fr: "Essai d'éclatement par rotation (loi des matériaux)"
    funcion:
      es: "Mide la resistencia específica σ/ρ de un anillo girándolo hasta romperlo; fija el arrastre máximo 12σ/(ρc) de una cáscara de materia ordinaria."
      en: "Measures a ring's specific strength σ/ρ by spinning it to burst; this fixes the maximum drag 12σ/(ρc) of an ordinary-matter shell."
      fr: "Mesure la résistance spécifique σ/ρ d'un anneau en le faisant tourner jusqu'à rupture ; cela fixe l'entraînement maximal 12σ/(ρc) d'une coque de matière ordinaire."
    estado: "calculado"
    obstaculos: [8]
    geometria:
      tipo: "anillo"
      radio_m: 0.2
      posicion_m: [0.9, -0.1, 0.2]
      color: "yellow"
    material:
      nombre:
        es: "Anillo bobinado de fibra de carbono / epoxi"
        en: "Filament-wound carbon fibre / epoxy ring"
        fr: "Anneau bobiné fibre de carbone / époxy"
      designacion: "Fibra Toray T1100G en matriz epoxi, bobinado circunferencial"
      composicion:
        - { elemento: "C (fibra)", porcentaje_masa: "> 93 en la fibra" }
        - { elemento: "Matriz epoxi (C, H, O, N)", porcentaje_masa: "≈ 30–35 del anillo" }
      por_que:
        es: "Es el material con mayor σ/ρ de ingeniería; la ley dice que el arrastre solo depende de σ/ρ, así que el mejor material marca el techo."
        en: "It has the highest engineering σ/ρ; the law says drag depends only on σ/ρ, so the best material sets the ceiling."
        fr: "C'est le matériau d'ingénierie au plus haut σ/ρ ; la loi dit que l'entraînement ne dépend que de σ/ρ, donc le meilleur matériau fixe le plafond."
      propiedades:
        - { nombre: "Resistencia a tracción de la fibra", valor: "7.0", unidad: "GPa", fuente: "Ficha técnica Toray T1100G" }
        - { nombre: "Módulo de la fibra", valor: "324", unidad: "GPa", fuente: "Ficha técnica Toray T1100G" }
        - { nombre: "Densidad de la fibra", valor: "1.79", unidad: "g/cm³", fuente: "Ficha técnica Toray T1100G" }
    electronica:
      - { elemento: "Turbina de aire en foso de vacío", especificacion: "Hasta 60 000 rpm, foso de acero con anillo de contención", por_que: { es: "Lleva el anillo a velocidad de rotura con seguridad." } }
      - { elemento: "Sensor de velocidad óptico", especificacion: "Tacómetro láser, 1 pulso/vuelta, ±0,01 %", por_que: { es: "La velocidad de rotura da σ/ρ = v²." } }
      - { elemento: "Galgas extensométricas + telemetría", especificacion: "Puente completo, telemetría inductiva 10 kHz", por_que: { es: "Deformación de aro antes de romper, para validar el modelo." } }
    cableado:
      - { tramo: "Telemetría → DAQ", tipo: "coaxial RG-316", por_que: { es: "Flexible y apantallado cerca de la turbina." } }
      - { tramo: "Tacómetro → FPGA", tipo: "fibra multimodo OM4", por_que: { es: "Inmune al ruido del motor y a la puesta a tierra del foso." } }
    cifras:
      - { nombre: "σ/ρ de la fibra T1100G", valor: "3.9e6", unidad: "J/kg", fuente: "laboratorio: lab_evaluar(s/p, s=7e9, p=1790)" }
      - { nombre: "Arrastre máximo 12σ/(ρc) con T1100G", valor: "0.157", unidad: "m/s", fuente: "laboratorio: lab_evaluar(12*s/(p*c), s=7e9, p=1790)" }
      - { nombre: "Arrastre máximo con maraging 350", valor: "0.012", unidad: "m/s", fuente: "laboratorio: lab_evaluar(12*s/(p*c), s=2.41e9, p=8000)" }
      - { nombre: "σ/ρ que pide β = 0,02", valor: "1.5e14", unidad: "J/kg", fuente: "laboratorio: lab_evaluar(b*c^2/12, b=0.02)" }
      - { nombre: "Distancia al requisito con T1100G", valor: "3.8e7", unidad: "veces", fuente: "laboratorio: lab_evaluar(b*c^2/(12*q), b=0.02, q=3.91e6)" }
    boceto:
      es: "Corte del foso: anillo negro sobre eje vertical, turbina abajo, anillo de contención grueso alrededor, tacómetro láser apuntando al borde."
    siguiente_paso:
      es: "Contrastar el factor 12 de la ley con un integrador TOV anisótropo antes de usar el ensayo como prueba."
      en: "Check the law's factor 12 with an anisotropic TOV integrator before using the test as evidence."
      fr: "Vérifier le facteur 12 de la loi avec un intégrateur TOV anisotrope avant d'utiliser l'essai comme preuve."

  - id: "cavidad-casimir"
    nivel: "mesa"
    nombre:
      es: "Metrología de cavidad de Casimir"
      en: "Casimir cavity metrology"
      fr: "Métrologie de cavité de Casimir"
    funcion:
      es: "Mide la presión de Casimir esfera-placa entre 50 y 500 nm para fijar la energía negativa real disponible y su coste en placas."
      en: "Measures sphere-plate Casimir pressure from 50 to 500 nm to pin down the real negative energy available and its cost in plates."
      fr: "Mesure la pression de Casimir sphère-plan entre 50 et 500 nm pour fixer l'énergie négative réelle disponible et son coût en plaques."
    estado: "calculado"
    obstaculos: [3, 9]
    geometria:
      tipo: "placa"
      dimensiones_m: [0.3, 0.3, 0.05]
      posicion_m: [-0.2, 0.35, 0.1]
      color: "green"
    material:
      nombre:
        es: "Oro de alta pureza (recubrimiento)"
        en: "High-purity gold (coating)"
        fr: "Or de haute pureté (revêtement)"
      designacion: "Au 99,99 % evaporado (≥ 100 nm) sobre esfera de poliestireno y placa de silicio"
      composicion:
        - { elemento: "Au", porcentaje_masa: "99.99" }
      por_que:
        es: "Conductor casi ideal, no se oxida y su respuesta óptica está bien tabulada: así la medida se compara con la teoría sin parámetros libres."
        en: "Near-ideal conductor, does not oxidise and its optical response is well tabulated: the measurement compares to theory without free parameters."
        fr: "Conducteur quasi idéal, inoxydable, réponse optique bien tabulée : la mesure se compare à la théorie sans paramètre libre."
      propiedades:
        - { nombre: "Densidad", valor: "19.3", unidad: "g/cm³", fuente: "CRC Handbook of Chemistry and Physics" }
        - { nombre: "Resistividad a 20 °C", valor: "2.2e-8", unidad: "Ω·m", fuente: "CRC Handbook of Chemistry and Physics" }
    electronica:
      - { elemento: "Microscopio de fuerza atómica en vacío", especificacion: "Micropalanca con esfera de 100 µm, lectura interferométrica de fibra", por_que: { es: "Mide fuerzas de pN a nN." } }
      - { elemento: "Actuador piezo de lazo cerrado", especificacion: "Recorrido 20 µm, resolución 0,1 nm", por_que: { es: "Controla la separación con precisión subnanométrica." } }
      - { elemento: "Fuente de tensión de compensación", especificacion: "±1 V, ruido < 1 µV", por_que: { es: "Anula el potencial de contacto, que imita la fuerza de Casimir." } }
    cableado:
      - { tramo: "Interferómetro de lectura", tipo: "fibra monomodo SMF-28 1550 nm", por_que: { es: "Lectura de desplazamiento sin cargas eléctricas cerca de la cavidad." } }
      - { tramo: "Fuente de compensación → placa", tipo: "coaxial RG-174 con pasamuros de vacío", por_que: { es: "Tensión limpia a través de la cámara." } }
    cifras:
      - { nombre: "Presión de Casimir ideal a 100 nm", valor: "13", unidad: "Pa", fuente: "laboratorio: lab_evaluar(pi^2*h*c/(240*a^4), a=1e-7)" }
      - { nombre: "Presión de Casimir ideal a 10 nm", valor: "1.3e5", unidad: "Pa", fuente: "laboratorio: lab_evaluar(pi^2*h*c/(240*a^4), a=1e-8)" }
      - { nombre: "Órdenes que faltan con Casimir a 10 nm (burbuja de 100 m)", valor: "≈ 35", unidad: "órdenes", fuente: "docs/investigacion/soluciones.md (ley 1)" }
