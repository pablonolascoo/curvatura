  - id: "cascara-nucleo"
    nivel: "vehiculo"
    nombre:
      es: "Cáscara de masa (capa portante)"
      en: "Mass shell (load-bearing layer)"
      fr: "Coque de masse (couche porteuse)"
    funcion:
      es: "Aporta la masa positiva y la tensión de aro que sostienen la geometría con interior plano y exterior de Schwarzschild."
      en: "Provides the positive mass and hoop stress that hold the geometry with flat interior and Schwarzschild exterior."
      fr: "Fournit la masse positive et la contrainte circonférentielle qui maintiennent la géométrie à intérieur plat et extérieur de Schwarzschild."
    estado: "abierto"
    obstaculos: [6, 7, 8]
