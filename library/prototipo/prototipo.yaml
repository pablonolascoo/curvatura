        fr: "La loi des matériaux plafonne l'entraînement à 12σ/(ρc), quelques mètres par seconde ; β = 0,02 exige une densité moyenne supérieure à celle d'une étoile à neutrons."
      propiedades: []
    electronica: []
    cableado: []
    cifras:
      - { nombre: "Masa publicada (R1 = 10 m, R2 = 20 m)", valor: "4.49e27", unidad: "kg", fuente: "fuchs-2024 · https://arxiv.org/abs/2405.02709" }
      - { nombre: "Masa publicada en masas de Júpiter", valor: "2.37", unidad: "M_J", fuente: "laboratorio: lab_evaluar(x/1.898e27, x=4.49e27)" }
      - { nombre: "Suelo de masa corregido (campo débil)", valor: "0.18", unidad: "M_J", fuente: "docs/investigacion/ideas/f-critica-cruzada.md (a4, lab_barrido)" }
      - { nombre: "Cáscara certificada más ligera publicada", valor: "0.49", unidad: "M_J", fuente: "ashurst-2026 · https://doi.org/10.5281/zenodo.23459758" }
      - { nombre: "Densidad media (masa publicada)", valor: "1.5e23", unidad: "kg/m³", fuente: "laboratorio: lab_evaluar(M/(4/3*pi*(b^3-a^3)), M=4.49e27, a=10, b=20)" }
      - { nombre: "Compacidad 2GM/(c²R2)", valor: "0.333", unidad: "—", fuente: "laboratorio: lab_evaluar(2*G*M/(c^2*R), M=4.49e27, R=20)" }
      - { nombre: "Presión en R1 (TOV isótropa)", valor: "1e39", unidad: "Pa", fuente: "docs/obstaculos.md §8 (cálculo propio)" }
      - { nombre: "Masa con materia a densidad nuclear", valor: "3.0–7.7", unidad: "M_J", fuente: "docs/investigacion/ideas/f-critica-cruzada.md (contradicción 1)" }
    boceto:
      es: "Esfera gruesa cortada por la mitad, con el radio interior y exterior acotados y flechas de tensión de aro en la pared."
    siguiente_paso:
      es: "Integrar la TOV anisótropa con ecuación de estado nuclear y buscar el β máximo; resolver a la vez masa y materia."
      en: "Integrate the anisotropic TOV with a nuclear equation of state and find the maximum β; solve mass and matter together."
      fr: "Intégrer la TOV anisotrope avec une équation d'état nucléaire et chercher le β maximal ; résoudre masse et matière ensemble."

