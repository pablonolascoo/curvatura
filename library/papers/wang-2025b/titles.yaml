es: "La alimentación a escala galáctica revela una acreción circumbinaria multifase, hipermagnetizada y alabeada en torno a binarias de agujeros negros supermasivos"
en: "Galactic-scale Feeding Reveals Warped Hypermagnetized Multiphase Circumbinary Accretion Around Supermassive Black Hole Binaries"
fr: "L'alimentation à l'échelle galactique révèle une accrétion circumbinaire multiphase, hypermagnétisée et gauchie autour de binaires de trous noirs supermassifs"
