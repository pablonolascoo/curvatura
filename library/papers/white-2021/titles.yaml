es: "La numérica de líneas de universo aplicada a una geometría de Casimir a medida genera una intersección inesperada con la métrica de curvatura de Alcubierre"
en: "Worldline numerics applied to custom Casimir geometry generates unanticipated intersection with Alcubierre warp metric"
fr: "La numérique des lignes d'univers appliquée à une géométrie de Casimir sur mesure engendre une intersection inattendue avec la métrique de distorsion d'Alcubierre"
