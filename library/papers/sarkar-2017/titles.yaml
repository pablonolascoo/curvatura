es: "Acoplamiento UV-IR inducido por el potencial cuántico en la radiación de Hawking análoga: de los condensados de Bose-Einstein a los agujeros negros acústicos canónicos"
en: "Quantum Potential induced UV-IR coupling in Analogue Hawking radiation: From Bose-Einstein Condensates to canonical acoustic black holes"
fr: "Couplage UV-IR induit par le potentiel quantique dans le rayonnement de Hawking analogue : des condensats de Bose-Einstein aux trous noirs acoustiques canoniques"
