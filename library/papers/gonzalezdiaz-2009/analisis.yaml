tipo: propuesta
supuestos:
  - "Un motor warp bidimensional se expresa como un pequeño universo de de Sitter localizado."
  - "La nucleación de universos bebé en pares correlacionados equivale a un squeezing del espacio-tiempo."
  - "Los universos de Tolman-Hawking y de Giddings-Strominger son los universos bebé de referencia."
resultados:
