  - "La nucleación de motores warp viola las desigualdades de Bell, con entrelazamiento, complementariedad y colapso de la función de onda."
  - "Se generaliza a universos en aceleración con energía oscura o fantasma: su creación también equivale a squeezing y a violar las desigualdades de Bell."
