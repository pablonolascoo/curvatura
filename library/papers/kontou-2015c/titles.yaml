es: "Demostración de la condición de energía nula promediada en un espaciotiempo curvo clásico mediante una desigualdad cuántica proyectada sobre direcciones nulas"
en: "Proof of the averaged null energy condition in a classical curved spacetime using a null-projected quantum inequality"
fr: "Démonstration de la condition d'énergie nulle moyennée dans un espace-temps courbe classique à l'aide d'une inégalité quantique projetée sur les directions nulles"
