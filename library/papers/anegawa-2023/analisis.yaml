    significado: "Tensor de energía-momento de la onda de choque en el horizonte de BTZ, con alpha positivo por la condición de energía nula promediada."
  - n: 44
    latex: 'T_{UU}=\frac{\beta}{4\pi G_N }\delta(U)'
    significado: "Onda de choque en el horizonte cosmológico de de Sitter."
  - n: 45
    latex: 'ds^2=\frac{-4\ell^2 dUdV}{(1-UV)^2}-4 \ell^2\beta  \delta(U)dU^2+L^2 \left( \frac{1+UV}{1-UV} \right)^2 d\phi^2'
    significado: "Métrica de de Sitter con la onda de choque, con desplazamiento de signo opuesto al de BTZ."
  - n: 28
    latex: '(r_c^2-8G_N \ell^2 M_t)(r_c^2-8G_N \ell^2 (M - E)) =(r_c^2-8G_N \ell^2 M)^2'
    significado: "Condición de Dray-'t Hooft-Redmount en la intersección de dos ondas de choque."
