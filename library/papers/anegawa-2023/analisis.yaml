generado: "IA · 2026-10-22 · puede contener errores; verificar con el paper"
aportacion: "Estudia cómo ondas de choque débiles y tempranas modifican la complejidad holográfica de de Sitter. Halla que el tiempo crítico de divergencia siempre aumenta si la onda cumple la condición de energía nula promediada."
tipo: solucion
supuestos:
  - "Espaciotiempo BTZ y de Sitter de tres dimensiones, con ondas de choque descritas por un tensor de energía-momento proporcional a una delta."
  - "Perturbación pequeña y temprana, en un límite de doble escala (t_w grande, E/M pequeño, producto fijo)."
  - "Complejidad holográfica definida como volumen y evaluada en el parche de Wheeler-DeWitt anclado en el horizonte estirado."
  - "Para dos ondas de choque, solución perturbativa a primer orden en la intensidad y condición de Dray-'t Hooft-Redmount en la intersección."
resultados:
  - "En BTZ la onda de choque produce un retardo temporal constante alpha > 0 en el horizonte."
  - "En de Sitter el desplazamiento es el opuesto (avance temporal beta), aunque causalmente consistente: la onda encoge el universo y conecta los parches izquierdo y derecho."
  - "La condición de energía nula promediada exige alpha > 0 y beta > 0, y en de Sitter implica que la masa disminuye tras la onda."
  - "El tiempo crítico en que diverge la complejidad de de Sitter es siempre mayor con ondas de choque, es decir, el crecimiento hiperrápido se retrasa."
