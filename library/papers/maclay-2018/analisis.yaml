generado: "IA · 2026-10-22 · puede contener errores; verificar con el paper"
aportacion: "Contrasta una desigualdad cuántica para luz comprimida con datos publicados de amplificadores paramétricos ópticos. Concluye que los datos la violan, lo que cuestiona su base."
tipo: experimento
supuestos:
  - "Se usa la desigualdad cuántica para luz comprimida de Marecki, que acota la varianza del campo eléctrico promediada con una ventana temporal f(t)."
  - "Se toman como fuentes de datos experimentos publicados con amplificación paramétrica óptica y detección homodina equilibrada."
  - "Se prueban varias ventanas temporales: gaussiana, lorentziana al cuadrado y trapezoidal."
resultados:
  - "La compresión de la varianza del vacío alcanzada en tres décadas llega a -15 dB."
  - "Para la ventana gaussiana, todos los datos menos uno violan la desigualdad cuántica; con la lorentziana al cuadrado, la violan casi todos con la versión propia y la mitad con la de Marecki."
  - "Un modelo de amplificador paramétrico ideal es consistente con todos los datos, y prevé que la compresión no dura más de medio ciclo."
  - "Ninguna ventana razonable probada da una desigualdad con la forma y los valores adecuados para los datos."
