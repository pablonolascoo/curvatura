limitaciones:
  - "No hay prueba de que la cota de Marecki sea la mejor posible."
  - "La función espectral del aparato puede entrar en conflicto con la ventana temporal elegida."
  - "Meta-análisis de datos publicados; la relación entre la ventana y el tiempo de observación real es una interpretación de los autores."
