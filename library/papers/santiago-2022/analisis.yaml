  - n: 45
    latex: '\bar p = \frac{1}{3} T_{ij}\delta^{ij} = \frac{1}{24\pi} \left( -2 \mathcal{L}_n K -\frac{1}{2} K^2 - \frac{3}{2} \mathrm{tr}(K^2)\right)'
    significado: "Presión media, que junto con la densidad permite escribir las condiciones de energía."
limitaciones:
