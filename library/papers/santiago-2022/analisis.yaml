generado: "IA · 2026-10-22 · puede contener errores; verificar con el paper"
aportacion: "Demuestra que todos los warp de la clase genérica de Natário violan la condición de energía nula. Con ello también violan las condiciones débil, fuerte y dominante, y refuta las propuestas recientes de warps con energía positiva."
tipo: teorema
supuestos:
  - "Línea de universo warp genérica con lapso unidad, métrica espacial plana y vector de flujo v^i suave y acotado, junto con sus derivadas."
  - "Observadores eulerianos, con vorticidad nula, y curvatura extrínseca K_ij = v_(i,j)."
  - "Warp localizado: las derivadas de v^i decaen con rapidez en el infinito espacial."
  - "El caso trivial del espacio de Minkowski queda excluido."
resultados:
  - "Los warps de Alcubierre, de expansión nula de Natário y de vorticidad nula de Lentz y Fell-Heisenberg violan la condición de energía nula."
  - "Con la energía nula violada, quedan violadas también las condiciones débil, fuerte y dominante."
  - "Para todo warp genérico se viola la condición de energía fuerte, por el teorema de focalización de Raychaudhuri."
  - "La densidad euleriana es una divergencia espacial; si es positiva en un sitio, es negativa en otro."
  - "Las propuestas de Lentz, Bobrick-Martire y Fell-Heisenberg fallan: Lentz no resuelve las ecuaciones de Einstein y las otras dos tienen perfiles no viables."
  - "En gravedad modificada, los warps razonables seguirían violando la condición de convergencia nula."
