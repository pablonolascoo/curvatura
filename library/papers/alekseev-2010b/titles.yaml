es: "Comentario a F.J.Ernst, V.S.Manko y E.Ruiz \"Sobre las interrelaciones entre los enfoques de Sibgatullin y de Alekseev para la construcción de soluciones exactas de las ecuaciones de Einstein-Maxwell\" (J.Phys.:Conf.Ser.229(2010)012050; arXiv:1006.5118)"
en: "Comment on F.J.Ernst, V.S.Manko and E.Ruiz \"On interrelations between Sibgatullin's and Alekseev's approaches to the construction of exact solutions of the Einstein-Maxwell equations\" (J.Phys.:Conf.Ser.229(2010)012050; arXiv:1006.5118)"
