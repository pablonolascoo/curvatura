aportacion: "Construye de forma analítica y explícita un warp con vector de desplazamiento irrotacional, continuo y de tipo Hawking-Ellis I global. Reduce mucho las violaciones locales de NEC y WEC frente a Alcubierre y Natário a igualdad de parámetros."
tipo: solucion
supuestos:
  - "Lapso unidad y cortes espaciales planos e independientes del tiempo."
  - "Desplazamiento irrotacional: β es el gradiente de un potencial escalar Φ."
  - "Comparación con Alcubierre y Natário con los mismos parámetros (ρ, σ, v/c)."
resultados:
