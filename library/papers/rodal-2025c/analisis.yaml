  - "La violación máxima de la NEC es más de 60 veces menor que la de Natário."
  - "El tensor de energía-momento es de tipo Hawking-Ellis I en todo el espaciotiempo, con densidad de energía propia bien definida."
  - "Añadir vorticidad moderada deshace la mejora y aumenta mucho la energía negativa E-."
  - "Con extrapolación a R → ∞, |E+ - E-|/(E+ + E-) = 0,04 %, así que la energía propia neta es compatible con cero."
