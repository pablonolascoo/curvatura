generado: "IA · 2026-10-22 · puede contener errores; verificar con el paper"
aportacion: "Construye una geometría de Alcubierre inspirada en la longitud de punto cero de la dualidad T de cuerdas. Identifica el perfil warp con la fracción de masa acumulada complementaria de una fuente difuminada y obtiene energía y expansión en forma cerrada."
tipo: propuesta
supuestos:
  - "El perfil f(r_s) = 1 - r_s^3/(r_s^2 + l^2)^{3/2} con l^2 = R^2 + l_0^2 es un ansatz efectivo, no una derivación de ecuaciones de campo corregidas por cuerdas."
  - "La longitud de punto cero es l_0 = 2 pi sqrt(alpha'), y R es una escala macroscópica del perfil."
  - "Velocidad constante v_s y métrica de Alcubierre con observadores eulerianos."
resultados:
  - "La métrica es C^2 en el centro de la burbuja y suave en el resto; el tensor de Riemann es finito."
  - "La densidad de energía euleriana es no positiva, nula en el eje y en el centro; con l = 100 m y v_s = c vale unos 3,7e37 J/m^3 en valor absoluto."
  - "La energía total es E = -(15 pi/1024) v_s^2 l, es decir unos -5,6e44 J para l = 100 m y v_s = c."
  - "Al ser l mayor o igual que l_0, el límite R tendiendo a 0 a v_s fijo no diverge: |E| tiende a (15 pi/1024) v_s^2 l_0."
  - "La superficie de límite estacionario no es un horizonte nulo, así que no se asigna área ni entropía."
