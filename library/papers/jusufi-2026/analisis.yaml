limitaciones:
  - "El ansatz no sale de ecuaciones de campo corregidas por cuerdas, y l^2 = R^2 + l_0^2 es una interpolación."
  - "El límite clásico l_0 tendiendo a 0 es un perfil grueso y suave, no el sombrero de copa de Alcubierre; no regulariza el límite de pared fina a radio fijo."
  - "Sigue haciendo falta materia exótica; la condición de energía débil se viola en la pared."
  - "No hay cálculo del tensor de energía-impulso renormalizado, así que no se afirma estabilidad semiclásica ni una desigualdad cuántica modificada."
  - "La métrica es C^2 pero no C^3 en el centro, lo que complica la renormalización por separación de puntos."
