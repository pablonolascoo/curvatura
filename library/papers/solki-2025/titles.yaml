es: "Radiación de microondas no clásica a partir del efecto Casimir dinámico paramétrico en el régimen de disipación invertida de la optomecánica de circuitos"
en: "Nonclassical microwave radiation from the parametric dynamical Casimir effect in the reversed-dissipation regime of circuit optomechanics"
fr: "Rayonnement micro-ondes non classique issu de l'effet Casimir dynamique paramétrique dans le régime de dissipation inversée de l'optomécanique de circuit"
