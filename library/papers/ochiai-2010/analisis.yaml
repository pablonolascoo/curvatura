  - n: 8
    latex: 'B_{tot}=T(\theta,\phi)\left\{\sum_{n=0}^{\infty}R^{2n}(\phi,\theta)\right\}T(\phi,\theta)=1'
    significado: "Suma de las transmisiones múltiples que da transmisión total sin reflexión."
