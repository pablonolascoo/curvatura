    latex: '\langle T^{\mu\nu}u_\mu u_\nu\rangle = \langle T^{00} \rangle = {1\over 8\pi}G^{00} = -{1\over 8\pi}{v_s^2(t) \rho^2 \over 4 r_s^2(t) }\left(d f(r_s)\over dr_s\right)^2'
    significado: "Densidad de energía negativa de la burbuja de Alcubierre para el observador euleriano."
  - n: 9
    latex: '{\tau_0\over\pi}\int_{-\infty}^\infty {{\langle T_{\mu\nu}u^\mu u^\nu\rangle}\over{\tau^2 + \tau_0^2}}d\tau\geq -{3\over{32\pi^2 \tau_0^4}}'
    significado: "Desigualdad cuántica de Ford y Roman para campo escalar sin masa."
  - n: 23
    latex: '\Delta \leq 10^2\, v_b\; L_{Planck}'
    significado: "Cota al grosor de la pared de la burbuja."
  - n: 27
