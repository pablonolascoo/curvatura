generado: "IA · 2026-10-22 · puede contener errores; verificar con el paper"
aportacion: "Aplica las desigualdades cuánticas a la métrica de Alcubierre y deduce que la pared de la burbuja debe ser muy fina, de unos cientos de longitudes de Planck. La energía negativa total necesaria resulta físicamente inalcanzable."
tipo: cota
supuestos:
  - "Desigualdad cuántica de Ford y Roman para un campo escalar sin masa en Minkowski, aplicada a observadores con tiempo de muestreo menor que el radio de curvatura local."
  - "Burbuja de velocidad aproximadamente constante durante el muestreo y observador geodésico que cruza el ecuador de la burbuja."
  - "Función de forma aproximada por tramos con pared de grosor Delta, suficiente para estimar órdenes de magnitud."
resultados:
  - "El grosor de la pared queda acotado por Delta menor o igual que unas 10^2 v_b longitudes de Planck para alpha = 1/10."
  - "Para una burbuja de 100 m de radio, la energía negativa total es al menos 6.2e65 v_b gramos, unas 3e20 masas galácticas por v_b, unos diez órdenes de magnitud sobre la masa del universo visible."
  - "Con pared de 1 m, ignorando la desigualdad, la energía sería de un cuarto de masa solar."
  - "Una burbuja del tamaño de la longitud de onda Compton del electrón requeriría del orden de -400 masas solares."
  - "Para el campo electromagnético, la pared puede ser un factor raíz de 2 más gruesa; para campos masivos, aún más fina."
