es: "Radiación de Hawking con desplazamiento Doppler de agujeros negros acústicos en colisiones de iones pesados ultrarrelativistas"
en: "Doppler shifted Hawking radiation from acoustic black holes in ultra-relativistic heavy-ion collisions"
fr: "Rayonnement de Hawking décalé par effet Doppler issu de trous noirs acoustiques dans les collisions d'ions lourds ultrarelativistes"
