en: "Non-linear Processes and Stimulated Hawking Radiation in Hydrodynamics for Decelerating Subcritical Free Surface Flows with a Subluminal Dispersion Relation"
fr: "Processus non linéaires et rayonnement de Hawking stimulé en hydrodynamique pour des écoulements à surface libre sous-critiques en décélération avec une relation de dispersion subluminique"
