aportacion: "Resuelve numéricamente la métrica warp en coordenadas esféricas con fluido anisótropo y término de constante cosmológica, y evalúa las condiciones de energía y la masa total de la solución."
tipo: simulacion
supuestos:
  - "Métrica esférica ds^2 = -dt^2 + (dr - beta dt)^2 + r^2 dOmega^2 con función de forma beta."
  - "Materia: fluido anisótropo con presiones radial y transversal, más un término tipo constante cosmológica."
  - "Ecuación de estado politrópica extendida p_r = K rho^gamma + epsilon rho en el caso anisótropo."
  - "Soluciones de onda viajera beta(t,r) = f(r_s) v_s además del régimen completo dependiente del tiempo."
resultados:
  - "Con el término cosmológico aparece un compromiso entre las condiciones de energía débil y fuerte."
  - "La condición de energía dominante se cumple siempre en este modelo."
  - "La condición de energía nula exige que la función de forma beta no crezca con el tiempo."
  - "Hay regiones del espaciotiempo donde las condiciones de energía se cumplen al menos en parte."
  - "En algunos ejemplos la masa total calculada con la densidad numérica se mantiene positiva durante toda la evolución."
