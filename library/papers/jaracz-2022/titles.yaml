en: "Spherically symmetric counter examples to the Penrose inequality and the positive mass theorem under the assumption of the weak energy condition"
fr: "Contre-exemples à symétrie sphérique à l'inégalité de Penrose et au théorème de la masse positive sous l'hypothèse de la condition d'énergie faible"
