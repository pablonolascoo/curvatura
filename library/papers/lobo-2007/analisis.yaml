aportacion: "Capítulo de revisión sobre soluciones exóticas de la relatividad general: agujeros de gusano atravesables, la métrica warp de Alcubierre, el tubo de Krasnikov y espaciotiempos con curvas temporales cerradas. Analiza sus violaciones de las condiciones de energía."
tipo: revision
supuestos:
  - "Se resuelve la ecuación de Einstein en sentido inverso: se elige una métrica exótica y se deduce la materia que la sostiene."
  - "Agujero de gusano estático y esféricamente simétrico con funciones de forma b(r) y de corrimiento al rojo Phi(r)."
  - "Warp tratado con la métrica de Alcubierre y su versión linealizada en la velocidad."
resultados:
  - "Estas soluciones requieren materia exótica con un tensor de energía-momento que viola la condición de energía nula."
  - "En el warp de Alcubierre se violan las condiciones de energía débil y nula; se aplican a él las desigualdades cuánticas."
  - "El viaje superlumínico efectivo se asocia siempre a energía negativa significativa; se discute además el tubo de Krasnikov en 2D y su generalización a 4D."
  - "Tanto el warp como el tubo de Krasnikov pueden generar curvas temporales cerradas, y los agujeros de gusano pueden convertirse en máquinas del tiempo."
  - "Se revisan también agujeros de gusano rotantes, evolutivos, con cáscaras finas y con expansión cósmica acelerada."
ecuaciones_clave:
