    latex: 'ds^2=-e^{2\Phi(r)}dt^2+\frac{dr^2}{1-b(r)/r}+r^2(d\theta^2+\sin^2\theta d\phi^2)'
    significado: "Métrica de Morris y Thorne para un agujero de gusano estático y esférico."
  - n: 23
    latex: '\rho(r)=\frac{1}{8\pi}\frac{b^{\prime}}{r^2},\quad \tau(r)=\frac{1}{8\pi}\left[\frac{b}{r^3}-2\left(1-\frac{b}{r}\right)\frac{\Phi^{\prime}}{r}\right]'
    significado: "Densidad de energía y tensión radial que sostienen la geometría."
  - n: 30
    latex: '\xi =\frac{\tau-\rho}{|\rho|}=\frac{b/r-b^{\prime}- 2r(1-b/r)\Phi^{\prime}}{|b^{\prime}|}'
    significado: "Función de exoticidad: es positiva en la garganta, lo que indica violación de la condición de energía nula."
  - n: 32
    latex: '\xi(r_0) =\frac{\tau_0-\rho_0}{|\rho_0|}>0'
    significado: "Condición de exoticidad evaluada en la garganta."
