    latex: '\frac{\tau_0}{\pi}\int_{-\infty}^{\infty}\frac{\langle T_{\mu\nu}u^\mu u^\nu\rangle}{\tau^2+\tau_0^2}{\rm d}\tau\ge -\frac{3}{32\pi^2\tau_0^4}'
    significado: "Desigualdad cuántica de Ford y Roman usada como criterio para las soluciones superluminales."
  - n: 6
    latex: 'w(r)=\frac{1}{8\pi r^2}\left(1-\left(\frac{r}{\Lambda(r)}\right)^\prime\right)'
    significado: "Densidad de energía de la solución esférica en función de la función métrica Lambda."
  - n: 7
    latex: '\Lambda(r)=\frac{1}{1-\frac{2}{r}\int_0^r 4\pi w(r^\prime) r^{\prime 2}{\rm d}r^{\prime}}'
    significado: "Relación entre la función métrica radial y la masa encerrada."
