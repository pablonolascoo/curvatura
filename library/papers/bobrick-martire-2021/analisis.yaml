aportacion: "Define una clase general de espaciotiempos warp como cáscaras de materia que se mueven inercialmente y construye la primera familia subluminal esférica de energía positiva, además de optimizaciones de la métrica de Alcubierre."
tipo: solucion
supuestos:
  - "Un warp drive es una región exterior plana asintóticamente que encierra una región compacta con la curvatura (la cáscara) y un interior de pasajeros."
  - "Las soluciones subluminales esféricas se analizan en el sistema comóvil con la métrica de la ecuación (5) y materia con densidad y presión."
  - "Las soluciones superluminales no pueden ser esféricas, por lo que se tratan con simetría axial."
  - "Las densidades de energía se miden con observadores eulerianos."
resultados:
  - "Cualquier warp drive, incluido el de Alcubierre, es una cáscara de material normal o exótico que se mueve inercialmente, así que requiere propulsión."
  - "Se presenta el primer modelo general de warp drives subluminales esféricos con energía positiva."
  - "Se construyen soluciones superluminales que satisfacen las desigualdades cuánticas."
  - "Aplanar la métrica de Alcubierre reduce la energía negativa necesaria en dos órdenes de magnitud."
  - "Se introduce un espaciotiempo warp en el que la capacidad espacial y el ritmo del tiempo interior se eligen de forma controlada."
ecuaciones_clave:
