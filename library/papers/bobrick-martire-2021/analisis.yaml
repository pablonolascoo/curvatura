    latex: 'T^{00}=-\frac{1}{8\pi}\frac{\rho^2 v_s^2}{4r_s^2}\left(\frac{{\rm d} f}{{\rm d} r_s}\right)^2'
    significado: "Densidad de energía euleriana de la métrica de Alcubierre, siempre negativa."
