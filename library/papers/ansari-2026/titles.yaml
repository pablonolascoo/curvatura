es: "Teletransporte de materia macroscópica mediante física exótica: un marco teórico unificado que integra agujeros de gusano atravesables, ingeniería de energía negativa, control del vacío cuántico, ingeniería métrica, cirugía topológica del espaciotiempo, curvas temporales cerradas, atajos por espuma cuántica y conversión de energía en geometría"
en: "Exotic Physics Teleportation of Macroscopic Matter: A Unified Theoretical Framework Integrating Traversable Wormholes, Negative Energy Engineering, Quantum Vacuum Control, Metric Engineering, Topological Space-Time Surgery, Closed Timelike Curves, Quantum Foam Shortcuts, and Energy-to-Geometry Conversion"
fr: "Téléportation de matière macroscopique par la physique exotique : un cadre théorique unifié intégrant trous de ver traversables, ingénierie de l'énergie négative, contrôle du vide quantique, ingénierie métrique, chirurgie topologique de l'espace-temps, courbes temporelles fermées, raccourcis par mousse quantique et conversion énergie-géométrie"
