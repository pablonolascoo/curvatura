ideas_abiertas:
  - "Encontrar una forma modificada de la burbuja que sea solución estable de la ecuación con autointeracción."
  - "Evolucionar numéricamente la burbuja con la dinámica completa para ver si emerge una forma estable."
  - "Si no hay soluciones naturales, buscar burbujas estabilizables con materia no exótica o campos electromagnéticos."
