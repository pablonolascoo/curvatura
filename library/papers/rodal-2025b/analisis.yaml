    significado: "Invariante cuadrático de Ricci sin traza."
  - n: 10
    latex: 'K = I+2 \, r_{1} +\frac{1}{6} G^2'
    significado: "Escalar de Kretschmann como suma de contribuciones de Weyl, Ricci y Einstein."
  - n: 12
    latex: 'ds^2 = -dt^2 + \left(dx - X\, dt\right)^2 + \left(dy - Y\, dt\right)^2 + \left(dz - Z\,dt\right)^2'
    significado: "Métrica warp de tipo Natário en forma 3+1."
limitaciones:
  - "Análisis de curvatura sobre una geometría dada; no propone una materia concreta que la genere."
  - "Los resultados numéricos dependen de la función de forma elegida y de sus parámetros."
  - "Las comparaciones de amplitud se hacen con parámetros idénticos, no con soluciones optimizadas."
