generado: "IA · 2026-10-22 · puede contener errores; verificar con el paper"
aportacion: "Formaliza qué significa que una burbuja warp tenga masa y que se mueva respecto a las estrellas fijas, usando la masa ADM. Calcula de forma explícita el tensor energía-impulso de warp drives de Natário con vorticidad nula y confirma la violación de las condiciones de energía."
tipo: teorema
supuestos:
  - "Warp drives de Natário genéricos: tres hojas planas, lapso unidad y campo de flujo v^i(t, x) asintóticamente plano."
  - "Caso de vorticidad nula: v = gradiente de un potencial Phi, con una geometría base estática trasladada por x_*(t)."
  - "Tres formas de masa: carga útil dentro de la burbuja, masa de la propia burbuja (warp negro) o masa de fondo externa."
  - "No se exige hiperbolicidad global, para poder discutir problemas de causalidad."
resultados:
  - "La carga útil es más sencilla de lo que se suele suponer: se obtiene uniendo con una función bump una métrica masiva y una métrica warp."
  - "Al activar el campo warp solo cambian las componentes espaciales del tensor energía-impulso, de forma lineal en la velocidad v_*."
  - "La presión media vale p_media = p_0 - (1/(12 pi)) v_*^k d_k laplaciano(Phi)."
  - "Para el warp basado en Schwarzschild en coordenadas de Painlevé-Gullstrand, rho = 0 con T_ij distinto de cero, por lo que se viola la condición de energía dominante, y también la nula, débil y fuerte."
  - "Se confirma que las condiciones nula, débil, fuerte y dominante se violan en todas las subclases (Alcubierre, expansión nula y vorticidad nula)."
ecuaciones_clave:
