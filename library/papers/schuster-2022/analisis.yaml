    significado: "Warp drive de vorticidad nula como traslación de una geometría base."
  - n: 31
    latex: '\rho=\rho_0;\ f_i=0;\ T_{ij}=(T_0)_{ij}+\frac{1}{8\pi}v_*^k(t)\partial_k\left[\Phi_{,ij}-\nabla^2\Phi\,\delta_{ij}\right]'
    significado: "Tensor energía-impulso del warp de vorticidad nula."
  - n: 43
    latex: '\bar{p}=\frac{1}{3}\delta^{ij}T_{ij}=-\frac{1}{12\pi}v_*^k(t)\partial_k\nabla^2\Phi'
    significado: "Presión media del warp basado en Schwarzschild."
limitaciones:
