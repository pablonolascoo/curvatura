generado: "IA · 2026-10-22 · puede contener errores; verificar con el paper"
aportacion: "Apuntes de un curso de 25 horas sobre viaje más rápido que la luz y viaje en el tiempo dentro de la relatividad general y la teoría cuántica de campos. Cubre estructura causal, ecuación de Raychaudhuri, condiciones de energía, taquiones, warps, agujeros de gusano y paradojas."
tipo: revision
supuestos:
  - "Lectores con relatividad general de nivel introductorio de grado."
  - "El material se presenta dentro de la ciencia establecida: relatividad general y teoría cuántica de campos."
  - "Las condiciones de energía se tratan como suposiciones adicionales, no como axiomas de la relatividad general."
resultados:
  - "Una constante cosmológica positiva y un campo escalar de acoplamiento mínimo violan la condición de energía fuerte."
  - "Un campo escalar de acoplamiento conforme viola la condición de energía nula y, con ella, las demás, incluso la condición de energía nula promediada."
  - "Si el tensor de energía-impulso es arbitrario, cualquier métrica resuelve la ecuación de Einstein; por eso se usan condiciones de energía."
  - "Los espacio-tiempos de viaje superlumínico global exigen casi siempre materia que viola las condiciones de energía, o materia exótica."
  - "Los taquiones permiten viajar al pasado o comunicar con él en relatividad especial."
