ideas_abiertas:
  - "Comprobar si la fórmula C = kappa (F F - F F) es compatible con las ecuaciones de Einstein-Maxwell."
  - "Calcular el tensor de energía-impulso total de la burbuja propuesta y revisar las condiciones de energía."
  - "Diseñar una configuración electromagnética concreta que produzca el perfil de curvatura buscado."
