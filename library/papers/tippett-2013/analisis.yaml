    como: "compara"
  - paper: everett-1996
    como: "compara"
ideas_abiertas:
  - "Estudiar con las desigualdades cuánticas si una TARDIS podría sostenerse físicamente."
  - "Analizar el control causal de una burbuja que recorre una curva cerrada."
