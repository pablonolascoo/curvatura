es: "Perspectivas para observar efectos Casimir dinámicos y antidinámicos en QED de circuitos mediante la modulación rápida de los parámetros del cúbit"
en: "Prospects for observing dynamical and anti- dynamical Casimir effects in circuit QED due to fast modulation of qubit parameters"
fr: "Perspectives d'observation des effets Casimir dynamiques et anti-dynamiques en QED de circuit par modulation rapide des paramètres du qubit"
