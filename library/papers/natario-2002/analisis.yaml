generado: "IA · 2026-10-22 · puede contener errores; verificar con el paper"
aportacion: "Demuestra que la expansión y contracción del espacio en el warp drive de Alcubierre es una consecuencia marginal de su elección, y construye un espaciotiempo warp similar con expansión nula."
tipo: solucion
supuestos:
  - "Un espaciotiempo warp es globalmente hiperbólico, con M igual a R^4 y métrica ds^2 = -dt^2 + sum (dx^i - X^i dt)^2 definida por un campo vectorial X."
  - "El campo X se construye con la identificación de R^3 con las 2-formas mediante el operador de Hodge, de modo que su divergencia sea nula."
  - "La burbuja se mueve con velocidad constante v_s y función de forma f(r) que vale 1 en el interior y 0 en el exterior."
resultados:
  - "La expansión de los observadores eulerianos es theta = div X; en la métrica de Alcubierre vale v_s f'(r_s)(x - x_s)/r_s, y es nula en la nueva construcción."
  - "La densidad de energía euleriana es rho = (theta^2 - K_ij K^ij)/(16 pi); con expansión nula queda rho = -K_ij K^ij/(16 pi), siempre negativa."
  - "Con velocidad constante v_s mayor que 1 hay un horizonte: los sucesos dentro de la burbuja no pueden influir en los de valores grandes de x positivos."
  - "Lejos de la burbuja el ángulo del horizonte cumple sin alpha = 1/v_s, la expresión del cono de Mach."
  - "La energía medida por observadores eulerianos de una geodésica nula cumple E(1 + X·n) = E_0, lo que da el corrimiento al rojo y al azul."
ecuaciones_clave:
  - n: 1
    latex: 'ds^2=-dt^2+\sum_{i=1}^3(dx^i-X^idt)^2'
    significado: "Métrica general de un espaciotiempo warp en términos del campo vectorial X."
  - n: 10
    latex: '\theta = K^i_{\,\,i}=\partial_iX^i'
    significado: "Expansión de los observadores eulerianos."
  - n: 11
    latex: '\rho=T_{ab}n^an^b=\frac{1}{16 \pi}\left( \theta^2 - K_{ij}K^{ij}\right)'
    significado: "Densidad de energía euleriana en función de la expansión y la curvatura extrínseca."
  - n: 24
    latex: '\rho = -\frac{1}{16\pi}K_{ij}K^{ij}=-\frac{v_s^2}{8\pi}\left[ 3(f^{\prime})^2 \cos^2 \theta + \left(f^{\prime} + \frac{r}2 f^{\prime\prime}\right)^2\sin^2\theta\right]'
    significado: "Densidad de energía del warp drive de expansión nula."
limitaciones:
  - "La densidad de energía euleriana sigue siendo negativa, así que no elimina el problema de la energía negativa."
  - "Las burbujas superlumínicas con velocidad constante tienen horizontes, lo que impide el control causal desde dentro."
  - "Solo se estudia la métrica estacionaria en el sistema de la burbuja, sin dinámica de aceleración."
obstaculos: [1, 4]
relacion:
  - paper: alcubierre-1994
    como: "corrige"
  - paper: clark-1999
    como: "extiende"
ideas_abiertas:
  - "Buscar campos X con expansión nula y menor energía negativa."
  - "Analizar el efecto de los horizontes sobre la comunicación entre el interior y el exterior."
