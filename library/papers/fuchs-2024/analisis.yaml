ideas_abiertas:
  - "Optimizar los perfiles radiales de densidad, presión y desplazamiento para reducir la masa necesaria, posiblemente en órdenes de magnitud."
  - "Estudiar la aceleración sin romper las condiciones de energía, por ejemplo con transferencia de momento, emisión de masa o radiación gravitatoria."
  - "Explorar espaciotiempos no vacíos con condiciones de contorno distintas de Schwarzschild."
