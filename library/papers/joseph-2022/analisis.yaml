aportacion: "Acopla la métrica de Alcubierre a un campo escalar cuántico en gravedad cuántica bohmiana. El requisito de materia exótica se convierte en una ecuación de onda conformal de cuarto orden para la densidad cuántica."
tipo: propuesta
supuestos:
  - "Gravedad cuántica bohmiana: gravedad clásica en geometría de Weyl con un campo escalar cuántico de de Broglie-Bohm."
  - "La métrica de Alcubierre es el fondo y la energía exótica la aporta el término cuántico T^qm(Ω)."
  - "Se usa el vector u de los observadores eulerianos."
resultados:
  - "La densidad de energía necesaria, proporcional a v_s2 (y2+z2) (df/dr_s)2, se iguala al término cuántico."
  - "Resulta una ecuación diferencial de cuarto orden en la raíz de la densidad cuántica ρ."
  - "Esa ecuación admite soluciones extra, como funciones hiperbólicas de la densidad, que no aparecen en la teoría cuántica usual."
  - "Si se encuentra una densidad ρ que cumpla la ecuación, se resolvería el problema de la materia exótica en este marco."
