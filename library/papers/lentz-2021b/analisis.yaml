aportacion: "Resume el solitón warp hiperrápido de Lentz con densidad de energía euleriana no negativa y lo sitúa en la literatura. Responde a las críticas sobre su validez y enumera los retos pendientes."
tipo: revision
supuestos:
  - "Espaciotiempos de clase Natário: lapso unidad y 3-métrica plana, con toda la curvatura en el vector de desplazamiento."
  - "Desplazamiento como gradiente de un potencial phi que satisface una ecuación de onda lineal con fuente rho."
  - "Dependencia de las fuentes en el plano (x,y) mediante la norma l1 y condición de que los signos de la densidad de fuente y de su gradiente coincidan."
  - "Unidades G = c = 1."
resultados:
  - "El solitón cumple la condición de energía débil incluso a velocidades superlumínicas; es el primer ejemplo con energía positiva."
  - "La energía total sigue la estimación de Pfenning y Ford: E_tot ~ C v_s^2 R^2 / w, con C de orden uno."
  - "Para R = 100 m y w = 1 m, la masa equivalente es de unas pocas décimas de masa solar por v_s^2, del mismo orden que un Alcubierre del mismo tamaño."
  - "Las pruebas de Olum y de Lobo y Crawford sobre la necesidad de violar la condición de energía nula no se aplican, porque sus precondiciones no se cumplen en este solitón."
  - "La objeción de Santiago y colaboradores no vale, ya que la divergencia total exige suavidad que el solitón no tiene en x = 0 e y = 0."
