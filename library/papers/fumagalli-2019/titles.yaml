es: "(In)estabilidad del vacío de Higgs durante la inflación: la peligrosa relevancia de la desviación de De Sitter y de los operadores suprimidos por la escala de Planck"
en: "Higgs vacuum (in)stability during inflation: the dangerous relevance of de Sitter departure and Planck-suppressed operators"
fr: "(In)stabilité du vide de Higgs pendant l'inflation : la dangereuse pertinence de l'écart à de Sitter et des opérateurs supprimés par l'échelle de Planck"
