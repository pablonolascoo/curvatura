aportacion: "Propone un modelo de laboratorio de la métrica de Alcubierre con metamateriales magnetoeléctricos. Muestra que el rango de parámetros del material limita la velocidad warp emulable a un máximo de c/4."
tipo: propuesta
supuestos:
  - "Las ecuaciones de Maxwell en un espacio-tiempo curvo equivalen a las de un medio magnetoeléctrico con permitividad, permeabilidad y acoplo dados por la métrica."
  - "Métrica de Alcubierre en 1+1 dimensiones con índice de refracción de fondo n_inf."
  - "Se exige estabilidad termodinámica del material: el acoplo magnetoeléctrico está acotado por la raíz de (epsilon-1)(mu-1)."
resultados:
  - "Las condiciones del medio equivalente son epsilon y mu iguales a h^(-1/2) y un acoplo g_x no nulo, determinados por v_0 y f."
  - "La cota de estabilidad impide la burbuja en vacío, pero un medio material permite un modelo estable al menos a velocidades subluminales."
  - "La velocidad máxima emulable es v_0 = c/4."
  - "Los materiales magnetoeléctricos comunes (Cr2O3, multiferroicos) tienen susceptibilidades dos órdenes de magnitud por debajo del límite, por lo que no sirven."
  - "Metamateriales magnetoeléctricos perfectos y no recíprocos, basados en anillos resonantes abiertos o estructuras tipo fishnet, podrían alcanzarlo."
