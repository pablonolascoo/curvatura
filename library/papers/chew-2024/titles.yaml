es: "¿Puede formarse una singularidad desnuda durante el colapso gravitacional de una solución de Janis-Newman-Winicour?"
en: "Can a naked singularity be formed during the gravitational collapse of a Janis-Newman-Winicour solution?"
fr: "Une singularité nue peut-elle se former lors de l'effondrement gravitationnel d'une solution de Janis-Newman-Winicour ?"
