aportacion: "Simula el espaciotiempo de Alcubierre con un medio de Tamm (metamaterial) y calcula las trayectorias de rayos de luz en óptica geométrica, mostrando cómo la burbuja desvía y enfoca la luz."
tipo: simulacion
supuestos:
  - "La métrica de Alcubierre se representa como un medio material en espacio plano mediante el formalismo de Tamm."
  - "El medio es asintóticamente idéntico al vacío, con parámetros constitutivos continuos en las coordenadas espaciales."
  - "Régimen de óptica geométrica, con transformación de Lorentz al sistema de la burbuja."
  - "Función de forma con perfil tipo tanh, con radio R y grosor de transición controlado por sigma."
resultados:
  - "Se identifican direcciones de propagación evanescentes en la región del medio que equivale a la burbuja warp, sobre todo perpendiculares a la velocidad y a alta velocidad."
  - "Las trayectorias de los rayos son muy sensibles al módulo y a la dirección de la velocidad de la burbuja."
  - "Dependen poco del grosor de la zona de transición entre la burbuja y el fondo."
  - "Para rayos que viajan en la dirección de la burbuja, esta actúa como una lente de enfoque, más marcada a alta velocidad."
