es: "Excitación del campo electromagnético clásico en una cavidad que contiene una lámina delgada con conductividad dependiente del tiempo"
en: "Excitation of the classical electromagnetic field in a cavity containing a thin slab with a time-dependent conductivity"
fr: "Excitation du champ électromagnétique classique dans une cavité contenant une lame mince à conductivité dépendant du temps"
