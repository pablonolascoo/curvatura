es: "¿Pueden sostenerse con materia ordinaria espaciotiempos de agujero de gusano en gravedad unimodular? Una demostración general del requisito de materia exótica"
en: "Can wormhole spacetimes in Unimodular Gravity be supported by ordinary matter? A general proof of the exotic matter requirement"
fr: "Les espaces-temps de trou de ver en gravité unimodulaire peuvent-ils être soutenus par de la matière ordinaire ? Une preuve générale de la nécessité de matière exotique"
