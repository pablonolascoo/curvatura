aportacion: "Extiende la mecánica de Bohm con geometrodinámica: las partículas que atraviesan una barrera de potencial siguen geodésicas de un espaciotiempo tipo Alcubierre. El modelo reproduce el efecto Hartman con un mecanismo geométrico de autorregulación."
tipo: propuesta
supuestos:
  - "Mecánica de Bohm: ψ = √ρ exp(iS) con potencial cuántico Q."
  - "Las trayectorias son geodésicas de una métrica de tipo Alcubierre que depende del potencial cuántico."
  - "Barrera rectangular de anchura a y altura V0."
resultados:
  - "Se obtienen expresiones analíticas para el potencial cuántico, la dinámica y el tiempo de túnel."
  - "Para barreras estrechas, el tiempo de túnel depende de la anchura."
  - "Para barreras anchas, el tiempo satura a un valor constante: efecto Hartman."
  - "La saturación se interpreta como autorregulación: Q ajusta la distorsión del espaciotiempo, con causalidad preservada pese a la propagación superlumínica efectiva."
