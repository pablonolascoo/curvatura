aportacion: "Capítulo de revisión sobre la métrica de Alcubierre y el tubo de Krasnikov. Repasa la violación de las condiciones de energía, los horizontes, las curvas temporales cerradas y las desigualdades cuánticas."
tipo: revision
supuestos:
  - "Relatividad general con G = c = 1 y burbuja esférica con función de forma f(r) de tipo tanh."
  - "Para el análisis lineal, nave de masa finita con velocidad no relativista v << 1."
  - "Tubo de Krasnikov modificado a lo largo de la trayectoria de la nave, con propagación radial limitada por causalidad."
resultados:
  - "La densidad de energía medida por observadores eulerianos es negativa en todo punto y se reparte en una región toroidal."
  - "La condición de energía nula se viola para todo v, incluso promediando sobre las direcciones +z y -z."
  - "Con la cota cuántica, el grosor de la pared queda limitado a unas 10^2 veces la longitud de Planck por v_b, y la energía a unos -3 x 10^20 masas galácticas por v_b."
  - "En el límite lineal, la energía neta del campo de warp no puede superar la masa de la nave, lo que impone velocidades muy bajas."
  - "Una burbuja superlumínica tiene horizonte: los fotones emitidos hacia delante no alcanzan el borde, así que la nave no puede crearla ni controlarla."
  - "El tubo de Krasnikov permite un viaje de ida y vuelta arbitrariamente corto medido desde el origen, y dos tubos generan curvas temporales cerradas."
