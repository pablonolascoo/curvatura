    como: "extiende"
ideas_abiertas:
  - "Usar las geometrías de dos burbujas warp como banco de pruebas teórico y de laboratorio para la protección de la cronología."
  - "Estudiar qué papel juegan los efectos semiclásicos cerca de la formación del horizonte cronológico en el sistema análogo."
