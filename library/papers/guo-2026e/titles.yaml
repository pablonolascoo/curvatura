es: "Análisis de agujeros de gusano atravesables sostenidos por materia oscura de Taylor-Silk en gravedad de Einstein mediante la estabilidad de capa delgada con perturbación radial linealizada"
en: "Analyzing traversable wormholes supported by Taylor-Silk dark matter in Einstein gravity by using thin-shell stability with linearized radial perturbation"
fr: "Analyse de trous de ver traversables soutenus par la matière noire de Taylor-Silk en gravité d'Einstein via la stabilité en couche mince avec perturbation radiale linéarisée"
