  - n: 36
    latex: 'E=-v_s^2{c^4\over 12G}\int_0^\infty\rho^2\left({dg\over d\rho}\right)^2\left(\frac{1}{A^4}\right)d\rho'
    significado: "Energía total negativa de la burbuja con lapso."
  - n: 32
    latex: '\Delta\leq 10^2(v/c)l_{Pl}A_0'
    significado: "Cota al grosor de la pared por las desigualdades cuánticas."
