generado: "IA · 2026-10-22 · puede contener errores; verificar con el paper"
aportacion: "Propone introducir una función de lapso arbitraria A(ct,ρ) en la métrica de Alcubierre. Afirma que así se reduce tanto como se quiera la energía negativa total y revisa las desigualdades cuánticas con ese lapso."
tipo: propuesta
supuestos:
  - "Métrica de Alcubierre modificada con un lapso A(ct,ρ) en g_00, con g_00 = A^2 - [v_s g(ρ)]^2."
  - "Desigualdades cuánticas de tipo Ford-Roman con función de muestreo lorentziana, adaptadas al lapso."
  - "El lapso es un recurso matemático; los autores admiten que no conocen un mecanismo en cuatro dimensiones para fijar N>1."
resultados:
  - "La energía total E = -(v_s^2 c^4/12G) ∫ ρ^2 (dg/dρ)^2 A^-4 dρ decrece al aumentar A."
  - "Una cota sobre el grosor de la pared: Δ ≤ 10^2 (v/c) l_Pl A_0, según el análisis con desigualdades cuánticas."
  - "Las desigualdades cuánticas son poco adecuadas en espacio curvo, aunque modificarlas reduce también las restricciones."
  - "Propone un truco matemático, con N=2 y un espaciotiempo AdS de cinco dimensiones, para mantener la burbuja en régimen superlumínico."
