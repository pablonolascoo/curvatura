es: "¿Por qué el efecto Unruh depende de la invariancia de Lorentz y la radiación de Hawking no?"
en: "Why does the Unruh effect rely on Lorentz invariance, while Hawking radiation does not ?"
fr: "Pourquoi l'effet Unruh repose-t-il sur l'invariance de Lorentz, alors que le rayonnement de Hawking non ?"
