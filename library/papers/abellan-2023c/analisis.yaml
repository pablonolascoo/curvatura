aportacion: "Escribe la métrica de Alcubierre en coordenadas esféricas y resuelve las ecuaciones de Einstein para un fluido perfecto y para un fluido anisótropo con constante cosmológica, analizando las condiciones de energía."
tipo: solucion
supuestos:
  - "Simetría esférica con métrica ds2 = -(1-β2)dt2 - 2β dt dr + dr2 + r2 dΩ2 y observadores eulerianos."
  - "Fluido perfecto o fluido anisótropo (presiones radial y tangencial), sin flujo de calor."
  - "Caso estacionario: β depende solo de r y existe un vector de Killing temporal."
resultados:
  - "En el caso independiente del tiempo aparece la ecuación de estado p = -ρ (presión radial = -densidad)."
  - "Con p = -ρ se cumplen las condiciones de energía débil, dominante y nula si ρ ≥ 0."
  - "La condición de energía fuerte exige densidad negativa (ρ ≤ 0) con presión positiva."
  - "La métrica propuesta no admite disipación de calor."
