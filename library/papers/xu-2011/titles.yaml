es: "¿A qué velocidad puede moverse un átomo de hidrógeno antes de que su protón y su electrón se separen?"
en: "How Fast a Hydrogen Atom can Move Before Its Proton and Electron Fly Apart?"
fr: "À quelle vitesse un atome d'hydrogène peut-il se déplacer avant que son proton et son électron ne se séparent ?"
