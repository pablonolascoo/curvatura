aportacion: "Propone criterios para verificar las condiciones de energía en burbujas warp para todo observador admisible. Los expresa como desigualdades matriciales lineales 4x4 mediante el lema S, sin clasificación de Hawking-Ellis ni límite de rapidez."
tipo: propuesta
supuestos:
  - "El tensor energía-impulso se obtiene de la métrica por las ecuaciones de Einstein, con diferenciación automática."
  - "Rebanadas planas con lapso unidad para los resultados sobre momento y vorticidad del desplazamiento."
  - "Cuatro geometrías comparadas con parámetros iguales: Alcubierre, Van den Broeck, Natário y el perfil irrotacional de Rodal."
resultados:
  - "Las condiciones nula, débil y fuerte son una desigualdad matricial 4x4 y la dominante requiere dos pruebas."
  - "La evaluación por intervalos da cotas globales que establecen la violación de la condición de energía nula en las cuatro paredes."
  - "El momento euleriano se anula para todo desplazamiento liso de R^3 con vorticidad acotada solo si es un gradiente más una rotación rígida."
  - "Para el perfil de Rodal, la lectura euleriana pierde cerca del 73% de las violaciones débiles muestreadas en la pared."
  - "Hay regiones de tipo IV en las paredes de Alcubierre y Natário; la de Rodal es de tipo I en todas partes."
