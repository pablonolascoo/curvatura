es: "La cota inferior del radio de sombra es más robusta que la cota inferior del radio de la esfera de fotones en gravedad de Einstein $n$-dimensional"
en: "The shadow radius lower bound is more robust than the photon sphere radius lower bound in $n$-dimensional Einstein gravity"
fr: "La borne inférieure du rayon d'ombre est plus robuste que celle du rayon de la sphère de photons en gravité d'Einstein à $n$ dimensions"
