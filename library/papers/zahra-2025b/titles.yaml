es: "Radiación de ondas gravitacionales de órbitas periódicas y oscilaciones cuasiperiódicas en el agujero negro de Einstein con electrodinámica no lineal de Maxwell-Yukawa"
en: "Gravitational wave radiation from periodic orbits and quasi-periodic oscillations in Einstein non-linear Maxwell-Yukawa black hole"
fr: "Rayonnement d'ondes gravitationnelles issu d'orbites périodiques et oscillations quasi périodiques dans le trou noir d'Einstein à électrodynamique non linéaire de Maxwell-Yukawa"
