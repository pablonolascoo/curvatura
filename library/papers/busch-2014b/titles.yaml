en: "Suppression of infrared instability in transsonic flows by condensation of zero-frequency short wave length phonons"
fr: "Suppression de l'instabilité infrarouge dans les écoulements transsoniques par condensation de phonons de fréquence nulle et de courte longueur d'onde"
