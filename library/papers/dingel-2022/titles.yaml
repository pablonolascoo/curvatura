es: "Análogo óptico del efecto Thomas en relatividad especial con un interferómetro de Michelson-Gires-Tournois: análisis exhaustivo de errores y recuperación del sentido del ángulo de rotación de Thomas"
en: "Optical analogue of the Thomas effect in special relativity using Michelson-Gires-Tournois interferometer: Comprehensive error analysis and recovery of the direction of the Thomas rotation angle"
fr: "Analogue optique de l'effet Thomas en relativité restreinte à l'aide d'un interféromètre de Michelson-Gires-Tournois : analyse complète des erreurs et récupération du sens de l'angle de rotation de Thomas"
