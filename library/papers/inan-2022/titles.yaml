es: "Un nuevo enfoque para detectar ondas gravitacionales mediante el acoplamiento de la gravedad a la energía de punto cero de los modos fonónicos de un superconductor"
en: "A new approach to detecting gravitational waves via the coupling of gravity to the zero-point energy of the phonon modes of a superconductor"
fr: "Une nouvelle approche pour détecter les ondes gravitationnelles via le couplage de la gravité à l'énergie de point zéro des modes de phonons d'un supraconducteur"
