es: "«Presión oscura»: una métrica que produce una velocidad orbital circular independiente de la distancia en el espacio profundo con una masa total «ajustable»"
en: "'Dark pressure': A metric that yields distance-independent circular orbital speed in deep space with 'tunable' total mass"
fr: "« Pression sombre » : une métrique donnant une vitesse orbitale circulaire indépendante de la distance dans l'espace lointain avec une masse totale « ajustable »"
