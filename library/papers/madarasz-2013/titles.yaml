es: "¿Por qué disminuyen las masas y momentos relativistas de las partículas más rápidas que la luz al aumentar su velocidad?"
en: "Why Do the Relativistic Masses and Momenta of Faster-than-Light Particles Decrease as their Speeds Increase?"
fr: "Pourquoi les masses et impulsions relativistes des particules plus rapides que la lumière diminuent-elles lorsque leur vitesse augmente ?"
