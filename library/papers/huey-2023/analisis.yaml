aportacion: "Construye modelos de juguete de warp subluminal y superlumínico uniendo espacio-tiempos distintos mediante membranas finas con fluido perfecto. Muestra que el modelo superlumínico cumple la condición de energía débil en todo punto."
tipo: solucion
supuestos:
  - "Espacio-tiempo quimérico: regiones de tipo Lambda-K, Minkowski y Minkowski modificado, unidas por membranas de codimensión 1."
  - "Simetría plana: las membranas son infinitas en las direcciones paralelas, y no compactas."
  - "Tensor energía-impulso de las membranas de fluido perfecto, ajustado para membranas superlumínicas, con condiciones de empalme de Israel."
  - "No se consideran efectos cuánticos ni estabilidad."
resultados:
  - "La discontinuidad de curvatura extrínseca en la membrana produce una aceleración aparente en cada región, ajustable con los parámetros."
  - "La condición de energía débil se cumple en todo el espacio-tiempo en ambos modelos, y la ecuación de estado queda en el rango [-1, 1]."
  - "El modelo logra una trayectoria global efectivamente superlumínica con trayectoria local temporal para el pasajero."
  - "El argumento de Olum no se aplica porque las membranas no son compactas, y el singular en las uniones modifica la ecuación de Raychaudhuri."
  - "Se especula con una transición de subluminal a superlumínico cambiando lentamente el cociente de los parámetros del fondo."
