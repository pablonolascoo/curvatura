aportacion: "Tesis doctoral sobre fenómenos de gravedad análoga en condensados de Bose-Einstein. Un capítulo muestra, con técnicas de gravedad análoga, que las burbujas warp superlumínicas son semiclásicamente inestables por flujo de tipo Hawking."
tipo: solucion
supuestos:
  - "La métrica de Alcubierre se escribe en forma de fluido, como una métrica acústica con velocidad v = v_0 f(r)."
  - "Aproximación de óptica geométrica para la propagación de rayos en geometrías dinámicas."
  - "Campo escalar sin masa y tensor de energía-impulso renormalizado calculado en 1+1 dimensiones."
  - "Creación de la burbuja a partir de Minkowski con un factor de conmutación en la velocidad."
resultados:
  - "Una burbuja warp que pasa de espacio plano a velocidad superlumínica desarrolla un horizonte negro y otro blanco."
  - "Recupera a tiempos tardíos la misma relación exponencial entre coordenadas afines que un colapso gravitatorio, y un observador dentro de la burbuja recibe un flujo tipo Hawking."
  - "El centro de la burbuja se comporta como la región asintótica de un agujero negro: el término estático de la densidad de energía se anula y solo queda la radiación."
  - "Cerca del horizonte de Cauchy, la densidad de energía renormalizada diverge a tiempos tardíos."
  - "Un cálculo numérico confirma estos resultados con un perfil de velocidad a trozos."
