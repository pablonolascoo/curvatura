generado: "IA · 2026-10-22 · puede contener errores; verificar con el paper"
aportacion: "Revisa el cálculo de energías de Casimir con aproximaciones autoconsistentes de teoría cuántica de campos. Concluye que la condición de energía nula promediada (ANEC) se sigue cumpliendo en los sistemas estudiados, lo que excluye fenómenos exóticos."
tipo: revision
supuestos:
  - "Campo escalar libre en espacio plano con fondo de platos o discos que imponen condiciones de Dirichlet o Neumann."
  - "Principio de Babinet: plato de Dirichlet con agujero igual a plato completo más disco de Neumann."
  - "Teoría de dispersión en coordenadas elípticas (funciones de Mathieu en 2D y esferoidales en 3D)."
resultados:
  - "Con un plato de Dirichlet con un agujero, la geodésica que atraviesa el agujero no encuentra materia y el resultado es finito."
  - "En 2D y 3D el agujero compensa el comportamiento que viola la condición de energía nula lejos del plato, de modo que se cumple ANEC."
  - "Para el plato completo, la suma de contribuciones da -1/(32 pi z^3) en 2D y -1/(16 pi^2 z^4) en 3D."
  - "No se conoce ningún ejemplo de violación de ANEC en espacio plano por efectos cuánticos con campos no gravitatorios."
ecuaciones_clave:
  - n: 2
    latex: 'T_{\mu\nu}V^\mu V^\nu\ge 0'
    significado: "Condición de energía débil para vectores V temporales (nula si V es nulo)."
  - n: 3
    latex: '\text{[plato de Dirichlet con agujero]}=\text{[disco de Neumann]}+\text{[plato de Dirichlet]}'
    significado: "Aplicación del principio de Babinet."
  - n: 21
    latex: '\langle\dot\phi^2\rangle+\langle(\partial_z\phi)^2\rangle=-\frac{1}{16\pi^2z^4}'
    significado: "Contribución a la condición de energía nula del plato completo en 3D (en 2D, -1/(32 pi z^3))."
limitaciones:
  - "Los resultados son para campos escalares libres y geometrías idealizadas, en espacio plano."
  - "El cálculo cerca del agujero requiere extrapolación a una distancia mínima fija."
  - "En espacio curvo se conocen violaciones de ANEC, de magnitud pequeña frente a los efectos de la fuente de curvatura."
  - "No se tiene un argumento analítico general de que ANEC siempre se cumpla."
obstaculos: [1, 3, 9, 13]
relacion:
  - paper: olum-1998
    como: "aplica"
ideas_abiertas:
  - "Buscar una prueba analítica de que ANEC se cumple en espacio plano para teorías realistas."
  - "Comprobar si la violación conocida en espacio curvo persiste en la teoría completa."
