    latex: 'L = \frac{1}{2}(\dot x^2 - \dot y^2) - \frac{\omega^2}{2}(x^2 - y^2)'
    significado: "Lagrangiano del oscilador bidimensional pseudoeuclídeo."
  - n: 12
    latex: 'H = \omega (c_x^{\dagger} c_x - c_y^{\dagger} c_y)'
    significado: "Hamiltoniano ordenado normalmente, con energía de punto cero nula."
  - n: 14
    latex: 'E = \omega (n_x - n_y)'
    significado: "Espectro de energías: puede ser positivo o negativo."
  - n: 24
    latex: 'H = \omega \left( a^{\mu \dagger} a_{\mu} + \frac{d}{2} \right), \quad d = \eta^{\mu \nu} \eta_{\mu \nu}'
    significado: "Caso general con métrica arbitraria: la energía de punto cero es proporcional a la traza d, que se anula si hay igual número de signos."
limitaciones:
