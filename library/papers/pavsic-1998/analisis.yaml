aportacion: "Estudia el oscilador armónico en un espacio pseudoeuclídeo, donde las componentes de signatura negativa dan energía negativa estable. Con campos escalares de signatura (+...-...) la energía del vacío y la constante cosmológica se anulan, y aparece materia exótica estable."
tipo: propuesta
supuestos:
  - "Métrica del espacio de campos con igual número de signaturas positivas y negativas."
  - "Estado de vacío definido por la aniquilación c_x|0> = 0 y c_y|0> = 0, sin exigir energía positiva."
  - "La energía negativa se acopla a la gravedad con signo contrario al de la materia ordinaria."
resultados:
  - "El oscilador pseudoeuclídeo (+ -) puede tener energía negativa pero es estable, pues la partícula describe una curva cerrada alrededor del origen."
  - "La energía de punto cero de la componente positiva cancela la de la negativa: el vacío tiene energía cero."
  - "Para un sistema de campos escalares con métrica de signatura (+ + + ... - - -) la densidad de energía del vacío y la constante cosmológica son exactamente cero."
  - "La teoría predice excitaciones estables de energía negativa (materia exótica), fuentes de campos gravitatorios repulsivos."
  - "Esa materia sería necesaria para máquinas del tiempo y para el warp drive de Alcubierre."
