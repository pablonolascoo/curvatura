generado: "IA · 2026-10-22 · puede contener errores; verificar con el paper"
aportacion: "Tesis doctoral que acopla la métrica de Alcubierre a fuentes de materia (polvo, fluido perfecto, fluido anisótropo, polvo cargado y constante cosmológica) y resuelve las ecuaciones de Einstein. Conecta algunas soluciones con ondas de choque de tipo Burgers."
tipo: solucion
supuestos:
  - "Métrica de Alcubierre en formalismo ADM, con el vector de desplazamiento beta como función de t y de una coordenada espacial."
  - "Fuentes de materia: polvo, fluido perfecto, fluido casi perfecto con presiones anisótropas, polvo cargado y fluido perfecto con constante cosmológica."
  - "Se imponen las ecuaciones de Einstein y la divergencia nula del tensor de energía-impulso."
resultados:
  - "Con polvo, la densidad de materia sale nula y aparece una solución de vacío ligada a una ecuación de tipo Burgers con un término que solo depende del tiempo."
  - "La suma de dos presiones estáticas puede dar soluciones de onda de choque en la ecuación de Burgers."
  - "Con fluido perfecto hay cuatro soluciones; dos coinciden con las de vacío del polvo, y otras dos tienen p = 3 mu y exigen mu negativa si beta es real."
  - "Con densidad positiva, el desplazamiento es complejo en esos casos y no viola las condiciones de energía."
  - "Con fluido anisótropo, dos soluciones cumplen todas las condiciones de energía si el parámetro de presión A es positivo y beta está acotado."
  - "Con polvo cargado, según la intensidad de los campos eléctrico y magnético, se pueden respetar las condiciones de energía o violarse las dominante y nula."
