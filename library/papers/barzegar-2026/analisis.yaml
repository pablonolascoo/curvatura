generado: "IA · 2026-10-22 · puede contener errores; verificar con el paper"
aportacion: "Clasifica las métricas warp actuales en el formalismo 3+1 y revisa críticamente la literatura. Señala errores de aplicación de la relatividad general y prueba varios teoremas de imposibilidad nuevos."
tipo: critica
supuestos:
  - "Topología trivial R^4 y descomposición 3+1 con lapso N, desplazamiento y métrica espacial h."
  - "Burbuja warp definida por un campo vectorial W, en línea con Natário, y espaciotiempo asintóticamente plano."
  - "Materia descrita como fluido con cuadrivelocidad u, con ecuaciones de conservación de energía, momento y masa en reposo."
resultados:
  - "Los modelos se agrupan en tipos con restricciones distintas: ortogonales al flujo (S-Warp) y restringidos (R-Warp), con casos de expansión nula, sin vorticidad o sin cizalla."
  - "Rechaza la hiperbolicidad global que Alcubierre atribuyó a toda métrica ADM con h definida positiva; hacen falta hipótesis adicionales."
  - "La energía total ingenua de los modelos R-Warp es ambigua, y la energía ADM sale nula aplicando bien la definición."
  - "Detecta errores en Lentz, Bobrick y Martire, Fell y Heisenberg, y Fuchs y otros, entre ellos soluciones que no resuelven las ecuaciones de Einstein."
  - "Concluye que justificar una burbuja física es muy difícil, no solo por la violación de las condiciones de energía."
