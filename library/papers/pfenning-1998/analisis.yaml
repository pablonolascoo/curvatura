aportacion: "Deriva desigualdades cuánticas generales sobre la densidad de energía negativa de campos escalares y electromagnéticos en espaciotiempos estáticos curvos. Las aplica al warp de Alcubierre y concluye que la energía negativa total necesaria supera con creces la masa del universo visible."
tipo: cota
supuestos:
  - "Espaciotiempos estáticos curvos con campos cuánticos libres, escalar y electromagnético."
  - "Desigualdad cuántica escrita con el operador de ondas euclídeo actuando sobre la función de Green euclídea."
  - "Límite de tiempo de muestreo corto, con expansión de la función de Green a distancias pequeñas."
resultados:
  - "En el límite de muestreo corto la desigualdad cuántica se reduce a la forma del espacio plano con términos subdominantes que dependen de la geometría."
  - "Se hallan formas exactas para Robertson-Walker estático en 3 y 4 dimensiones, plano con espejos perfectos, Rindler, de Sitter estático y exterior de un agujero negro."
  - "Aplicadas al warp de Alcubierre, las desigualdades limitan estrictamente el grosor de la región de energía negativa."
  - "Con esas restricciones, la energía negativa total requerida supera unas cien mil millones de veces la masa del universo visible."
