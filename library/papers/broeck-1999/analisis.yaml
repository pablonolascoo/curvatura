generado: "IA · 2026-10-22 · puede contener errores; verificar con el paper"
aportacion: "Revisa las objeciones a la geometría de Alcubierre y concluye que las burbujas superlumínicas son poco plausibles, mientras que las subluminales siguen abiertas."
tipo: revision
supuestos:
  - "Métrica de Alcubierre con función de forma f de soporte compacto."
  - "Validez de las desigualdades cuánticas de Ford y Roman para campos escalares y electromagnéticos."
  - "Relatividad general más teoría cuántica de campos en espacio-tiempo curvo."
resultados:
  - "Con la desigualdad cuántica, una burbuja de 100 m de radio requiere al menos 6.2e62 v_s kg de energía negativa, unos diez órdenes de magnitud por encima de la masa del universo visible."
  - "Con una métrica modificada (factor de expansión espacial B), la energía total baja a escala estelar y se respeta la desigualdad cuántica."
  - "Aun así, las densidades de energía siguen siendo enormes y aparecen estructuras a pocos órdenes de magnitud de la escala de Planck."
  - "En el caso superlumínico, parte de la materia exótica se mueve de forma taquiónica respecto al cono de luz local."
