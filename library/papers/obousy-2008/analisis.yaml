  - "Con una dimensión extra reducida a la longitud de Planck, el límite de velocidad sería de 10^32 c, aunque alcanzarlo exigiría más energía que la del universo observable."
  - "Hay una discrepancia entre las predicciones de la relatividad general y de la teoría cuántica de campos sobre el signo de la expansión, que se menciona como tema pendiente."
