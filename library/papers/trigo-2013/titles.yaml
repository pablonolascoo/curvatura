es: "Medida directa de las correlaciones densidad-densidad dependientes del tiempo en un sólido mediante el análogo acústico del efecto Casimir dinámico"
en: "Direct measurement of time-dependent density-density correlations in a solid through the acoustic analog of the dynamical Casimir effect"
fr: "Mesure directe des corrélations densité-densité dépendantes du temps dans un solide grâce à l'analogue acoustique de l'effet Casimir dynamique"
