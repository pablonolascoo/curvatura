es: "Restricción de la transición de fase de primer orden en el interior de las estrellas de neutrones mediante técnicas bayesianas aplicadas a los datos de NICER de PSR J0437-4715"
en: "Constraining first-order phase transition inside neutron stars with application of Bayesian techniques on PSR J0437-4715 NICER data"
fr: "Contraindre la transition de phase du premier ordre à l'intérieur des étoiles à neutrons par des techniques bayésiennes appliquées aux données NICER de PSR J0437-4715"
