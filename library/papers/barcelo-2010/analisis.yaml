  - "Campo escalar sin masa tratado con la aproximación semiclásica y el tensor de energía-momento renormalizado del caso bidimensional."
  - "Horizontes que se forman en un tiempo finito cuando la velocidad de la burbuja supera la de la luz."
resultados:
  - "La geometría warp requiere materia exótica que viola las condiciones de energía débil y dominante, incluso a velocidades subluminales."
