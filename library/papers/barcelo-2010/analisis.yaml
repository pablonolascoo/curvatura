  - "Esa divergencia desestabiliza la burbuja: la reacción cuántica impide mantener un warp superlumínico creado desde espacio plano."
  - "Se sugiere que esto es un nuevo éxito del postulado de la luz, de modo que la reacción cuántica protegería el límite de velocidad."
