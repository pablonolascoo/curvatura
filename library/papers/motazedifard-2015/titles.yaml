es: "Un modelo análogo para la radiación de Casimir controlable en una cavidad no lineal con bombeo modulado en amplitud: generación y propiedades estadísticas cuánticas"
en: "An analogue model for controllable Casimir radiation in a nonlinear cavity with amplitude-modulated pumping: Generation and quantum statistical properties"
fr: "Un modèle analogue de rayonnement Casimir contrôlable dans une cavité non linéaire à pompage modulé en amplitude : génération et propriétés statistiques quantiques"
