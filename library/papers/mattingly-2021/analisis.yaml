  - "Los invariantes de Alcubierre y de Natário a velocidad constante no tienen singularidades."
  - "En todas las burbujas aparece una zona plana en el centro, apta para viajar, y espacio asintóticamente plano fuera."
  - "La burbuja deja una estela dinámica y tiene estructura interna rica."
