es: "Fenomenología de época tardía necesaria para resolver la tensión de $H_0$ a la vista de las escaleras cósmicas y de los conjuntos de datos BAO anisótropos y angulares"
en: "Late-time phenomenology required to solve the $H_0$ tension in view of the cosmic ladders and the anisotropic and angular BAO data sets"
fr: "Phénoménologie tardive nécessaire pour résoudre la tension sur $H_0$ au vu des échelles cosmiques et des jeux de données BAO anisotropes et angulaires"
