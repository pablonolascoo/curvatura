aportacion: "Presenta un modelo con una segunda coordenada temporal compacta que permite viaje superlumínico causal sobre un fondo FLRW, modificando localmente el radio de ese tiempo. Es una prueba de principio, no una construcción."
tipo: propuesta
supuestos:
  - "Espacio-tiempo de 5 dimensiones con un segundo tiempo compactificado y derivadas respecto a él nulas."
  - "Un campo 3-forma con intensidad F(4) que se acopla al valor esperado m de campos de materia que se supone variable."
  - "Cuatro postulados físicos sobre el segundo tiempo, derivados de supuestos razonables."
resultados:
  - "El aumento de g_{0'0'} cerca de la trayectoria da una violación aparente de Lorentz con v_max^2 - 1 = g_{0'0'}."
  - "Para un observador en movimiento respecto al sistema cósmico, esa violación vale g_{0'0'}/gamma^2."
  - "La superluminosidad no puede convertirse en curvas temporales cerradas, al menos para v_max menor o igual que raíz de 2."
