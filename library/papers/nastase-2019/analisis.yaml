  - n: 39
    latex: 'v^2_{\rm max}=\frac{d\vec{x}^2}{dt^2}=1+g_{0^\prime0^\prime}\frac{dt^{\prime 2}}{dt^2}=1+g_{0^\prime0^\prime}'
    significado: "Velocidad máxima aparente en función de la componente del segundo tiempo."
  - n: 42
    latex: '\tilde v_{\rm max}^2-1=\frac{g_{0^\prime0^\prime}}{\gamma^2}=\frac{v^2_{\rm max}-1}{\gamma^2}'
    significado: "Violación aparente de Lorentz vista desde un sistema en movimiento."
  - n: 2
    latex: 'S=\frac{M^3_{\rm Pl,5}}{2}\int d^5x \sqrt{+g^{(5)}}R^{(5)}+\frac{M^3}{2}\int d^5x\sqrt{+g^{(5)}}f\left|\frac{1}{4!}F_{(4)MNPQ}F_{(4)}^{MNPQ}-m^2\right|+\int \sqrt{+g^{(5)}} {\cal L}_{\rm matter}'
    significado: "Acción del modelo con el término de la 3-forma."
limitaciones:
