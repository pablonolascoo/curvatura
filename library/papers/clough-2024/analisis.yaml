tipo: simulacion
supuestos:
  - "Datos iniciales de Alcubierre con lapso 1, métrica espacial plana y desplazamiento -v_s f(r_s), con f tipo tanh."
  - "Materia efectiva con tensor energía-impulso obtenido de las ecuaciones de Einstein y evolución de ρ y S_i con presión media y cizalla amortiguada."
  - "Evolución 3+1 con un código de relatividad numérica, con validación y convergencia en el apéndice."
resultados:
