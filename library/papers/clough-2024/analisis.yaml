  - "El flujo de ondas gravitatorias es positivo todo el tiempo y el flujo neto de energía es negativo, con lo que la masa final del volumen aumenta."
  - "Para una nave de 1 km la señal ronda 300 kHz, muy por encima de los detectores actuales."
  - "A 1 Mpc la amplitud de la deformación es parecida a la sensibilidad máxima de LIGO."
