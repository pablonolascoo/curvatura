es: "¿Son válidos los espaciotiempos de Petrov de tipo N y D que admiten CTC en la gravedad $$f(R,\\\\mathcal {L}_m,\\\\Phi ,X)$$?"
en: "Are Petrov type-N and D spacetimes admitting CTCs valid in $$f(R,\\\\mathcal {L}_m,\\\\Phi ,X)$$ gravity?"
fr: "Les espaces-temps de Petrov de type N et D admettant des CTC sont-ils valides en gravité $$f(R,\\\\mathcal {L}_m,\\\\Phi ,X)$$ ?"
