es: "Estabilidad dinámica de nuevas soluciones de agujeros de gusano mediante materia oscura fría y halos de ondas cuánticas solitónicas en gravedad $f(\\\\mathcal{R},\\\\mathcal{L}_m)$"
en: "Dynamical stability of new wormhole solutions via cold dark matter and solitonic quantum wave halos in $f(\\\\mathcal{R},\\\\mathcal{L}_m)$ gravity"
fr: "Stabilité dynamique de nouvelles solutions de trous de ver via la matière noire froide et des halos d'ondes quantiques solitoniques en gravité $f(\\\\mathcal{R},\\\\mathcal{L}_m)$"
