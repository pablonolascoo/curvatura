tipo: critica
supuestos:
  - "Cualquier métrica es solución de alguna ecuación de Einstein, con el tensor de energía-momento definido por el tensor de Einstein."
  - "Las condiciones de energía puntuales dependen de observadores y del vínculo entre geometría y materia."
  - "Fluido ideal irrotacional, tipo vórtice, como ejemplo de espacio-tiempo análogo."
