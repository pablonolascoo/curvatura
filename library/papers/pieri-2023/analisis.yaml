generado: "IA · 2026-10-22 · puede contener errores; verificar con el paper"
aportacion: "Explora el límite de radio pequeño de la burbuja de Alcubierre, donde la energía negativa total baja a la de un rayo. Propone aceleración con una distribución tubular de energía negativa externa y detección de partículas emitidas al frenar, como base de comunicación superlumínica."
tipo: propuesta
supuestos:
  - "Métrica de Alcubierre con burbuja superlumínica de radio cercano a la longitud de Planck y pared de grosor del orden de la longitud de Planck."
  - "La energía negativa se genera desde fuera, en un tubo (Hypertube), dispuesta de antemano a lo largo de la trayectoria."
  - "Las partículas de prueba no modifican de forma apreciable la densidad de energía de la pared."
  - "Se acepta la violación puntual de las condiciones de energía, localizada por el pequeño tamaño."
resultados:
  - "La energía total crece con el cuadrado del radio; con v = 1,15c, R = 1,01 L_P y grosor L_P resulta E del orden de -2 x 10^8 J."
  - "Esa energía es unos 70 órdenes de magnitud menor que la de la burbuja de Alcubierre original y comparable a la de un rayo."
  - "El grosor cumple las desigualdades cuánticas, con escala mínima del orden de L_P."
  - "La aceleración se controla desde fuera cambiando el perfil de energía negativa en el tubo, lo que evita el problema de control desde el interior."
  - "Al frenar la burbuja desaparece el horizonte y las partículas capturadas salen en la dirección de movimiento, con fuerte corrimiento al azul."
