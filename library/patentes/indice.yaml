  resumen: "Translated from Japanese 本発明の超高周波（ＵＨＦ）磁気エンジンは、極めて短い強力な電気、磁気または電磁パルスを発生させ、そのフィルドパルスを発信源から分離または解放することをベースにしている。フィルドパルス発生後、ターゲットに到達するまでの間、フィルドパルスはエミッタ装置、ターゲットとなる装置およびこれらの装置を支持する支持構造から分離または解放される。ターゲットに到達すると極性パルスがだされ、エンジンの一部を形成するターゲットに対して吸引力または反発力が生じる。電源モジュール、マイクロコントローラをベースにした制御ユニット、キャパシタバンクおよびオーバーシュート抑制回路によってフィルドパルスは十分に同期される。これら全ての回路はＵＨＦ及び超高周波（ＳＨＦ）帯域で作動するパルス発生器または連続信号発生器を形成するように接続される。 The ultra high frequency (UHF) magnetic engine of the present invention is based on generating very short, powerful electric, magnetic or electromagnetic pulses and separating or releasing the filled pulses from the source. After the filled pulse is generated and until it reaches the target, the filled pulse is separated or released from the emitter device, the target device, and the support structure that supports these devices. When the target is reached, a polarity pulse is emitted and a suction or repulsive force is generated against the target that forms part of the engine. The filled pulses are well synchronized by the power module, microcontroller based control unit, capacitor bank and overshoot suppression circuit. All these circuits are connected to form a pulse generator or continuous signal generator operating in the UHF and very high frequency (SHF) bands."
