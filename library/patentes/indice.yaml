  url: "https://patents.google.com/patent/US20060065789A1/en"
  resumen: "A method for producing thrusts in devices where a “Mach” effect mass fluctuation is driven by applying a high voltage, high frequency electrical signal to capacitive circuit elements made with high dielectric constant core material and at the same time applying a current signal of the same frequency to inductive circuit elements arranged so that the magnetic fields produced thereby thread the capacitors perpendicular to the electric fields between their plates. With appropriate relative phase established between the electric and magnetic fields in the dielectric material between the plates of the capacitor, the Lorentz force acting on the lattice ions in the dielectric yields a net force. That net force is a consequence of the fact that in each cycle when the Lorentz force acts in one direction the effective masses of the ions are different from their effective masses in the parts of each cycle where lattice forces act to restore the initial configuration. Operated at sufficiently high frequencies and powers, such devices can produce useful levels of thrust."
