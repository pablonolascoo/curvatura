  resumen: "A gravitational wave generating device comprises a population of energizable elements, involving magnetic, electrical and electromechanical functions under the control of a computer and accompanying computer software system. The magnetic and electrical elements, when energized under computer guidance, cooperate to produce rapid third derivative motion of the substance. This action causes the generation of high frequency gravitational waves that can be modulated and shaped for use in communications, propulsion, and various physical experiments. The energizable element may be a very small coil or set of coils embedded in a computer chip, a current carrying conductor, or a small electromechanical device. The substance acted on by the coil element may be a permanent magnet or a plurality of magnets, or an electromagnet. In the electromechanical element structure, the device can be used for both the generation and detection of gravitational waves."
