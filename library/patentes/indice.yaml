  resumen: "The present invention relates to a new form of air, land, underwater or space propulsion achieved by the use of suitable electromagnetic interactions. By using capacitors formed by symmetric or asymmetric conductors ( 1 ) and ( 2 ), surrounded by a dielectric ( 3 ), subjected to asymmetric voltage pulses or with asymmetric electric field derivative we obtain directional propulsion forces. This is possible due to a new electromagnetic propulsion mechanism that uses conservation of total momentum where the sum of the mechanical momentum with the electric field momentum should always be conserved resulting in a constant and zero total sum of the two components, where the change in electric field momentum will generate a corresponding change in the mechanical momentum of the capacitor thus generating propulsion forces where the inertia forces are attenuated and can generate force fields."
