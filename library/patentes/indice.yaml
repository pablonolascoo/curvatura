  resumen: "A chamber or series of chambers is formed from layers of nested shells and used to manipulate a work product within the chambers. The shells are formed from highly ordered material structures, such as superconductors and metamaterials, and the work product is manipulated using energy that is directed from the outside of the chamber, through the nested shells and into the chamber. The nested shells have an open position and a closed position or have a bridge through which a working material can be passed from one set of nested shells to another set of nested shells. The superconducting shells can be type-1 or type-2, and the metamaterial shells can include any combination of a frequency agile metamaterial, a split ring resonator, an artificial structure of a wire medium, a unit cell of an artificial magnetic metamaterial, metamaterial superlattices and any combination thereof, or other highly ordered composite metamaterials."
