  resumen: "The present invention discloses a pulsed electric field propulsion system for spacecraft. The system includes a capacitor stack comprising an array of supercapacitors. Solid-state electronic circuits generate high time-rate-of-change currents and pulsed electric fields in pulse coils. The pulse coils direct the electric fields onto separated electric charges stored in the capacitor stack. The resulting unidirectional Lorentz Forces thereby generate thrust without reaction mass. Reaction momentum is carried away by Poynting Vector fields in conformity with the currently understood principles of electrodynamics. The design is scalable down to micro-chip sized thrusters."
