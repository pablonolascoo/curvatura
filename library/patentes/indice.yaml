  resumen: "The present invention relates to a new form of aerial, terrestrial, underwater or space propulsion, achieved through the use of electromagnetic interactions. By using the well known Euler-Lagrange electromagnetic force equation many different concepts can be devised to transform electromagnetic forces and interactions into a useful propulsive force. In particular, this process can be used to propel a mass (21) that contains the propulsion units (16). A possible propulsion unit uses electromagnetic interactions between the longitudinal electric field emitted by a sphere (18) near a capacitor with cathode (10) connected to ground, a dielectric (3) and with anode (11) connected to any high voltage polarity."
