  resumen: "A superconductive, electromagnetic launch system is implemented on a stratospheric airship. The launcher includes a plurality of twisted cylinders, wherein each of the plurality of cylinders has an infinity-type shape or other shape including one or two lobes. The lobes of the plurality of cylinders are aligned, and adjacent cylinders are connected by a bridge to form one continuous guideway. Superconducting coils are positioned external to a bore in the guideway and generate a magnetic field or flux within the bore that levitates and propels the vessel. A cooling system cools the superconducting coils to a transition temperature at which one or more superconducting materials in the plurality of coils transition to a superconducting state. The vessel is accelerated in the guideway and launched from a stratospheric altitude of the airship at a velocity necessary to reach space."
