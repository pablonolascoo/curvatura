  resumen: "The present application discloses a propulsion system and method which provides thrust without propellant. The basic propulsion system comprises a means of motion to convey rotary motion to a rotor carrying a rotor magnet generating a magnetic field that interact magnetically with the stationary magnetic field originating in a stator magnet. Magnetic interactions between the moving magnetic field from the rotor magnet travels through the stationary magnetic field space in the stator magnet and generates; a gyroscopic force and a Lorentz force without the ejection of propellant, without reliance on an external mass to react against, and without reaction as recognized in the Newton's Third Law Exception in accordance with the established principles in electrodynamics and modern physics."
