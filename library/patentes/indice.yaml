  resumen: "The Invention's application is aviation and airspace equipment. The invention allows to produce a force that works against gravitation, much higher than the gravitational pull in opposite direction or as a dynamic force of an aircraft. The practical result of this invention is the possibility to deliver useful load to Earth orbiting, aircraft's graduate vertical takeoff/landing and holding at height. As well as in different applications where an efficient low-cost anti-gravitational force is required at hydrosphere, atmosphere, and outer space. The method is a low-cost solution for overcoming a gravitational force by aircraft without losing aircraft load. The method's efficiency is no less than magnetic levitation (maglev) train efficiency. However, the method allows an aircraft don't be tied with maglev train's guideway as a source of magnetic field and makes its movements unlimited in a space."
