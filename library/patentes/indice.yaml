  resumen: "A high frequency ion source, and in particular a high frequency ion engine, comprises a discharge container 2, a gas inlet 10 discharging into the discharge container 2 for a gas to be ionised in the discharge container 2 and a source 9 for the gas to be ionised. The source 9 is connected to the gas inlet 10. A high frequency generator 4 is connected to the high frequency coil 3 for generating a high frequency electromagnetic alternating field ionising the gas present in the discharge container 2. An acceleration grid 11 connected to an acceleration voltage source 12 is arranged at the open end of the discharge container 2 so as to accelerate the ions generated in the discharge container 2. The shape of the discharge container 2 in a longitudinal section is a taper reducing towards the end opposite the open end 5 (as can be seen in Figure 2); and the high frequency coil 3 at least partly surrounds the discharge container 23 in the tapered section."
