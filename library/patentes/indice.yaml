  url: "https://patents.google.com/patent/US9712031B2/en"
  resumen: "A system for propelling craft which is applicable in any environment. It employs an alternating magnetic field supplied by a coil. A parallel plate capacitor is situated so that the flux of the magnetic field flows between the plates of the capacitor. The capacitor is charged and discharged in synchronization with the alternating magnetic field. The changing magnetic field creates an electric field that applies a force to the charge in the plates which is then transferred to the body of the device. Any induced reactive electric force on the coil affects equally the protons and electrons in the wires of the coil creating the magnetic field, thus the force is non-reactive. At the same time, the changing electric field in the capacitor creates a magnetic field. The current in the coils and/or the surface current in the ferromagnetic material (if present) experiences a force from the magnetic field. The magnetic field created by these currents, however, has no free charge between the plates of the capacitor with which to react, thus this force is also non-reactive. The two forces are in opposite directions, but are not the same magnitude, thus the device is propelled in a single direction."
