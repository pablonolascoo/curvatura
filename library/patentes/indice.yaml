  resumen: "The present invention discloses systems and methods for electromagnetic spacecraft propulsion or thrust generation without the expulsion of reaction mass. The systems include capacitor assemblies with a switch-controlled conductive discharge path, a means of charging the capacitor assemblies, a means of generating magnetic fields using electromagnetic coils, and a means for periodically shaping the intensity, duration and polarity of magnetic fields from the coils. Thrust is generated through the interaction of the shaped magnetic fields and the segmented current in the conductive discharge path during capacitor discharge."
