  resumen: "PROBLEM TO BE SOLVED: To provide a plasma generator that remarkably reduces losses caused by recombination of ions and/or electrons on walls of an ionization chamber, and a control method of the plasma generator.SOLUTION: The plasma generator includes an ionization chamber 5 and a housing 20. Further, at least one working fluid supply pipe 30 is included that is opened within the ionization chamber 5, and the ionization chamber 5 includes at least one output hole 21. Further, at least one electric coil assembly 4 is included, and the coil assembly 4 surrounds at least a partial area of the ionization chamber 5. The coil assembly 4 is electrically connected to a high frequency AC current source, and the high frequency AC current source feeds a high frequency AC current to at least one coil of the coil assembly 4. The plasma generator includes a further current source, and the current source feeds an AC voltage of a frequency that is lower than a frequency of a DC voltage or a voltage fed by the high frequency AC current source, to at least one coil of the coil assembly 4."
