  resumen: "A system is disclosed for converting high frequency zero point electromagnetic radiation energy to electrical energy. The system includes a pair of dielectric structures which are positioned proximal to each other and which receive incident zero point electromagnetic radiation. The volumetric sizes of the structures are selected so that they resonate at a frequency of the incident radiation. The volumetric sizes of the structures are also slightly different so that the secondary radiation emitted therefrom at resonance interfere with each other producing a beat frequency radiation which is at a much lower frequency than that of the incident radiation and which is amenable to conversion to electrical energy. An antenna receives the beat frequency radiation. The beat frequency radiation from the antenna is transmitted to a converter via a conductor or waveguide and converted to electrical energy having a desired voltage and waveform."
