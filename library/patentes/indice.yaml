  url: "https://patents.google.com/patent/US11527387B2/en"
  resumen: "A multi-mode thruster system for use in a spacecraft includes a microwave source; a cavity coupled to the microwave source and including a first inlet to receive a first fluid and a second inlet to receive a second fluid; and a nozzle provided at one end of the cavity. The thruster operates in a microwave electrothermal thruster (MET) mode to (i) generate a standing wave in the cavity using the microwave source and (ii) raise a temperature of the first fluid to generate a first hot gas that exits the cavity via the nozzle to generate thrust. The thruster operates in a chemical propulsion mode to (i) produce a reduction-oxidation reaction between the first fluid and the second fluid and (ii) generate a second hot gas that exits the cavity via the nozzle to generate thrust."
