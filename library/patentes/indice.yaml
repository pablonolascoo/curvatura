  resumen: "This is a detector wherein a dynamic mass quadrupole arrangement includes electrons and electromagnetic energy in a re-entrant cavity structure consisting of coaxially disposed inner and outer members of superconducting material. The arrangement is coupled to a dynamic gravitational force gradient having a characteristic frequency, at which frequency the cavity structure is electromagnetically resonant. The coupling occurs through a dynamic stress-energy-momentum tensor in the arrangement, and a coupling loop is disposed in the cavity for coupling out electromagnetic energy propagating in the structure."
