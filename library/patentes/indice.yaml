  url: "https://patents.google.com/patent/CN102434414A/en"
  resumen: "A magnetic nozzle of a variable specific impulse magnetic plasma rocket aims to solve the problem of speed waste in the process of accelerating plasma in an electric propulsion system. The invention relates to a design technology of a magnetic nozzle of a variable ratio impact magnetic plasma rocket, which is used for converting the circumferential speed of plasma into axial speed and belongs to the technical field of magnetofluid. The magnetic jet pipe is used as the last stage of the variable ratio impact magnetic plasma rocket, is arranged at the tail end of a rocket engine and consists of a jet pipe and a superconducting coil. Wherein, the spray pipe is arranged at the tail end of the rocket engine shell, the shape of the spray pipe adopts an expansion type spray pipe, and the expansion ratio of the spray pipe (namely the area ratio of the outlet area to the throat part of the spray pipe) is 40: 1; the material of the nozzle is made of high-temperature resistant and ablation resistant alloy materials so as to reduce ablation and reduce thrust eccentricity."
