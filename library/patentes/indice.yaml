  resumen: "The present invention discloses electromagnetic propulsion systems and methods. The electromagnetic propulsion or thrusting systems include a multi-element capacitor, a means for charging and discharging the capacitor, a means for rotating parts of the capacitor, one or more electromagnetic coils, and a means for periodically shaping the intensity, duration and polarity of magnetic fields from the coils. In particular, these systems and methods use interactions between electromagnetic fields and rotating charged elements of capacitors to achieve thrust without expelling mass and with power requirements several orders of magnitude less than current proposed systems."
