  resumen: "Translated from Chinese 涉及可微型化的等离子推进器的本发明包括：‑通过接近于出口并且位于用于注入推进剂气体的装置内部的微空心阴极放电对等离子进行点火，该注入装置为磁性体并且在其下游端处包括尖端；‑在注入装置的排出端处使被磁化的等离子的电子进行旋磁旋转；‑通过电子回旋谐振(ECR)维持等离子，注入装置为金属并且被用作用于电磁(EM)发射的天线，ECR等离子在注入装置的出口处的容积被用作EM波的谐振腔；‑通过反磁力在磁流体喷管中加速等离子，被喷射的等离子为电中性的。 The present invention relates to a miniaturizable plasma thruster comprising: ignition of plasma by a micro hollow cathode discharge located close to an outlet and inside a device for injecting propellant gas, the injection device being magnetic and comprising a tip at its downstream end; gyromagnetic rotation of electrons of the magnetized plasma at the discharge end of the injection device; maintenance of the plasma by electron cyclotron resonance (ECR), the injection device being metallic and serving as an antenna for electromagnetic (EM) emission, the volume of the ECR plasma at the outlet of the injection device serving as a resonant cavity for the EM waves; acceleration of the plasma in a magnetohydrodynamic nozzle by diamagnetic forces, the ejected plasma being electrically neutral."
