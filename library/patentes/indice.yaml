  url: "https://patents.google.com/patent/US5052638A/en"
  resumen: "An electromagnetic ramjet propulsion system is provided for accelerating high mass payloads through the upper atomsphere at orbital velocities. The propulsion system comprises a plurality of coplaner self-supporting superconducting dipole coils several hundred meters in diameter that is initially accelerated to high altitude and supersonic speed by magnetic repulsive forces generated by a plurality of superconducting field coils several kilometers in diameter embeded beneath the earth's surface. The ramjet is accelerated to orbital velocities by a multigigawatt microwave beam that is transmitted from the earth's surface. A reflecting grid of conducting wires is mounted inside the inner dipole which shock ionizes the low dentisy atmospheric gas passing through it. The frequency of the microwave beam is adjusted to produce electron cyclotron resonance with the free electrons passing through the magnetic field of the dipoles thereby accelerating them away from the dipoles by magnetic repulsive forces, taking the positively charged ions with them. The system becomes a giant hypervelocity ionospheric ramjet propelled by magnetic repulsive forces without any velocity limitations. By utilizing a plurality of microwave transmitters located along the ground track of the ramjet, it is possible to accelerate payloads of several thousand tons to orbit."
