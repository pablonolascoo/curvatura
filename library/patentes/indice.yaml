  resumen: "A microwave engine, which produces high thrust, may be used to propel spacecraft where the thrust vector is at ninety degrees to the main velocity vector. It may also be used in an airborne vehicle to counteract gravitational force. The engine comprises a gimbal mounted matrix of a number of superconducting microwave thrusters 11 which are supplied with pulses of microwave energy via an array of switches 15 and enclosed in a Dewar 19 which is maintained at low temperature by liquefied gas. The engine may include an automatic control system to maintain the correct frequency of the microwave generator 7, a means 17 of dissipating the stored microwave energy, and a gyroscopic instrument 21 and motors 22,23 for maintaining the axis of thrust parallel to the direction of gravitational acceleration for an airborne vehicle."
