  resumen: "A method for developing thrust from current flow is disclosed. In a first embodiment, a plurality of loops (201) of wire wound in an asymmetrical pattern is physically connected to a source of electrical power (204), developing thrust in a direction (210). In a second embodiment, a plurality of stationary vanes (306, 307) are provided, and charged with alternating polarity high voltage. A rotor having U-shaped conductors (305) attached thereto rotates the conductors (305) past the vanes. As the rotor turns, an alternating current is electrostatically induced in the legs of the conductors (305), the current generating thrust (304). In two other embodiments, a U-shaped conductive path (405, 506) is inductively coupled to an RF or high frequency power supply in order to generate an alternating current in the conductive paths, thereby generating thrust."
