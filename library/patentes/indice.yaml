  resumen: "A pulsed-plasma thruster using an unbalanced theta-pinch is provided, which comprises a gas jet generator, an ionization convergent-divergent nozzle, and an accelerating coil set. The gas jet generator supplies gas puff in a pulsed manner. The acceleration coil set is positioned at one side of the throat of the ionization convergent-divergent nozzle. When the gas jet is fed to the ionization convergent-divergent nozzle, the electrodes of the ionization convergent-divergent nozzle responds by generating an electric arc and ionizing the gas jet to form a plasma plume. Meanwhile, the electrodes are also utilized to power the accelerating coil set, which generates an axially non-uniform magnetic field to accelerate the plasma plume. As a result, the control of thrust generation is simple and reliable, with high energy utilization efficiency."
