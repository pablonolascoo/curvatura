  resumen: "The current invention relates to a spacecraft propulsion system designed to enable travel through interplanetary and interstellar spaces. The propulsion system functions by modifying the momentum of electrons ejected from the spacecraft as they interact with external electric fields found in both interplanetary and interstellar settings. Additionally, it incorporates a mechanism to maintain the spacecraft's mass and electric charge neutrality. Such an approach enables the spacecraft to accelerate or decelerate without the traditional requirement of expelling propellant mass."
