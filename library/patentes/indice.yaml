  url: "https://patents.google.com/patent/US20190352023A1/en"
  resumen: "The force cell provides propellant-less propulsion for linear thrust applications and fuel-less torque for rotary applications. Linear thrust applications include propulsion for aircraft, spacecraft, flying cars, construction equipment for use in low and zero gravity environments, stabilization for ultra high buildings and realization of ultra long unsupported spans. Rotary torque applications include engines to drive electric generators of all sizes—from mobile phone size to power station size. Force cells use radiation pressure originating from the zero-point fields in the vacuum of space—the force in the Casimir effect, to produce a macroscopic external force through use of a multiplicity of microscopic Casimir cavities consisting of wedge shaped non-charged conducting plates attached to a matrix of non-conducting material. Force cells arranged in balanced pairs can produce modulated external thrust. Force cells arranged circularly can produce modulated torque."
