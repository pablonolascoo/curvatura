  resumen: "An electronic propulsion engine that creates a propulsive force or thrust using electromagnetic forces or electrostatic forces, with an effect that is similar to the thrust of a jet or rocket engine. Forces are generated using electromagnets or capacitor plates that are separated by dielectric spacer cores and are operated with two modulated currents. The two modulated currents are synchronized, but with a relative phase such that the forces on the two magnets or capacitor plates are not balanced. Included are techniques to reduce circuit impedance and control electric-magnetic field dispersion, such as tuned LCR circuits, dielectric core materials between the magnets or capacitor plates, and RF superconductors result in high propulsion efficiencies. The system operates at RF frequencies and can also be used as a communication device."
