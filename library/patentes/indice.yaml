  resumen: "Apparatus for measuring gravitational attraction of the Earth comprising a loop formed from a superconductor material. The loop being divided into a first portion and a second portion having a predetermined length and configuration. The loop being positioned under predetermined angle with respect to a horizontal plane. There are also means for initiation of a flow of superconducting carriers in each of first and second portions, and at least one phase shift inducing means formed in the loop. The first portion being positioned with respect to the second portion in such a way that the superconducting carriers conducted through the first portion spend a period of time at a different gravitational potential of the Earth than superconducting carriers conducted through the second portion, thus creating a gravitationally induced phase shift. The apparatus being completely isolated from influence of any external magnetic field. There also shown a method of measuring an absolute value of gravity of the Earth including measuring the current flowing through the superconductor loop of the apparatus at initial position, tilting the apparatus by tilting means under predetermined angle, wherein the current flowing through the superconductor loop is being continuously measured during tilting of the apparatus, measuring the current flowing through the superconductor loop at a final position. The tilting means are adapted to facilitate a precise control of an angular displacement of the appara…"
