  resumen: "The invention relates to an optical gravitational wave detector, belonging to the technical field of weak signal detection. The light-like gravitational wave detector comprises an emitting electrode, a graphene substrate, a light-like beam splitter, a collecting electrode, an insulating layer and a substrate electrode, wherein the emitting electrode and the collecting electrode are respectively and electrically connected with the graphene substrate, a carrier emitted by the emitting electrode is split by the light-like beam splitter after passing through an electronic light-like quantity selector and is respectively and vertically collected to a collector through three mutually perpendicular detection arms, and grid electrodes of the electronic light-like quantity selector and the light-like beam splitter are respectively arranged above the graphene substrate. The method has the advantages that the wavelength of the graphene light transmission is shorter, the graphene light transmission is more sensitive to gravitational waves, the sensitivity of the gravitational wave detector is improved, the size of the gravitational wave detector can be reduced, and the coordinate azimuth information of the gravitational wave source can be obtained by utilizing three mutually perpendicular detection arms."
