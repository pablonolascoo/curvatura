  resumen: "Translated from Japanese (57)【要約】 （修正有） 【目的】 電磁エネルギー推進エンジンは、独自に組み 立てられかつ組み合わされたハウジングの内側に強烈な 磁場が発生する新規な手段と方法の提供。 【構成】 電磁場は、パルスで上記ハウジングの後部か ら放出される結果、対応する推力のパルスが上記ハウジ ングに作用される。推力のパルスは周波数と発生した推 力の全体の平均に関して制御されうる。その結果、光速 度に達する速度で使用する燃料を推進エンジンが発生し て放出する。 (57) [Summary] (Modified) [Purpose] An electromagnetic energy propulsion engine provides a novel means and method for generating an intense magnetic field inside a uniquely assembled and assembled housing. The electromagnetic field is emitted from the rear part of the housing in pulses, so that a corresponding pulse of thrust is exerted on the housing. Thrust pulses can be controlled with respect to frequency and overall average thrust produced. As a result, the propulsion engine generates and releases fuel for use at speeds that reach the speed of light."
