  resumen: "A vehicle 100 comprising a propulsion arrangement 102 including a chamber arrangement 104 storing antimatter by magnetic and/or electrostatic fields. The chamber and vehicle centre of gravity 106 form a matter-antimatter dipole providing a propulsion force to the vehicle, e.g. space vehicle, or deep-space satellite. Juxtaposition of antimatter, e.g. positrons near matter may result in antigravity, or negative gravity, or a gravitational repulsion between contained anti-matter and matter. Positrons may be produced by a high intensity or pulsed laser beam directed towards a target. Q-switched laser of high intensity may generate a high ratio of positrons to electrons, possibly approaching a neutral “pair plasma” with equal numbers of positrons and electrons. The target may be integrated within a tokamak ring-shaped chamber. Propulsion force may be increased by adding positrons to the chamber, and acceleration may be decreased by dissipating positrons."
