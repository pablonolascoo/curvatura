  resumen: "Translated from Chinese 本发明提供了一种采用无质损磁动力推进的深空探测器，包括：探测器本体、供电装置、驱动装置、磁帆展开机构、磁场发生装置，所述探测器以磁帆作为无质损推进系统，与探测器本体进行连接；所述供电装置对探测器进行供电，所述磁帆展开机构将磁帆伸缩展开，所述磁场发生装置作为磁帆的主要装置，通电后电流产生磁场与太空中太阳风等离子体流相互作用产生推力。本发明所述的深空探测器无需携带推进剂，推力可持续，是一种具有广阔应用前景的新型动力深空探测形式。 The invention provides a deep-space probe that adopts mass-lossless magnetic power propulsion, including: a probe body, a power supply device, a driving device, a magnetic sail deployment mechanism, and a magnetic field generating device. The propulsion system is connected with the detector body; the power supply device supplies power to the detector, the magnetic sail deployment mechanism stretches and expands the magnetic sail, and the magnetic field generating device is the main device of the magnetic sail, and the current generates a magnetic field after being energized Interacting with the solar wind plasma flow in space generates thrust. The deep space probe of the present invention does not need to carry propellant, and has sustainable thrust, and is a new type of power deep space detection form with broad application prospects."
