  resumen: "A thrust levitation mechanism comprising a main rotor having a plurality of lifting rotor locations about the periphery thereof driven lifting rotors located at each lifting rotor location, said lifting rotors each having a rotational axis substantially in the plane of said main rotor and positioned at substantially a right angle to radii of said main rotor. Bob rotors or disc rotors may be used as the lifting rotors and may be angled out of the plane of the main rotor to induce thrust at an angle to the axis of the main rotor or to otherwise induce thrust asymmetrically. The thrust levitation devices of this invention are useful to induce movement in vehicles including automobiles, airplanes and space ships, among other applications. Use of paired, counter rotating main rotors and a plurality of levitation devices are contemplated."
