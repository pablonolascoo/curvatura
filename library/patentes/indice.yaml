  resumen: "Systems and methods of interacting complex electric fields and static electric fields to effect motion are disclosed. An example method includes producing an action force having a reaction force perpendicular to the action force by interacting a relative velocity electric field based on charge of a moving first charged object and a static charge on a second charged object in a different inertial frame of reference. Another example method includes producing an action force having a reaction force perpendicular to the action force by interacting an acceleration generated electric field based on acceleration of a first charged object and a static charge on a second charged object in a different inertial frame of reference. Another example method includes producing an action force having a reaction force perpendicular to the action force by interacting a scalar electric potential and static electric field."
