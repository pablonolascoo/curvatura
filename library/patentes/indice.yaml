  resumen: "A method for generating a force acting on a body, preferably made of superconducting material, comprising the steps of rotating the body and causing an electron flow through the body simultaneously in the direction of rotation and contrary to the direction of rotation, so that a flow of gravitons are released. Preferably the body is spherical. The currents flow in one direction in the upper hemisphere of the body and in the opposite direction in the lower half. In accordance with the space-time lattice model, this will result in a greater release of gravitons in the upward direction and a lesser release in the downward direction, which distorts space-time, impelling the body upwards."
