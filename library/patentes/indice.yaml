  resumen: "The present invention is directed to a magnetohydrodynamic pump adapted for use in a closed propulsion system. In one embodiment, the magnetohydrodynamic pump includes a duct having a plurality of inlet openings for joining a plurality of streams of liquid into a common single stream and an outlet opening in fluid communication with a nozzle. The magnetohydrodynamic pump includes a pump chamber coupled to a diverging end of the nozzle, and the pump chamber includes a plurality of material output ports. Further, the magnetohydrodynamic pump includes two electrodes mounted on opposite sides of the pump chamber and two mutually attractive superconducting magnets mounted on opposite sides of the pump chambers."
