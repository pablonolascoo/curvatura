  resumen: "The device and method of measuring the gravitational field includes a superconducting string (1), which is fixed to the both ends, forming part of a close superconducting circuit, inductively coupled with two induction solenoids (Ld1, Ld2). Displacement of the string in reply to gravitational field is recovered by two magnetic flux converters, each containing a signal coil and two search coils (Lp1, Lp2). The pair of search coils is placed in two perpendicular planes, creating two individual measuring channels. Two arms of each flux converter are balanced so as to transform the oscillation amplitude into the output tension for their own asymmetric modes of the spring. The output tension of each channel is used for distribution formation of the feedback current (Iy1, Iy2) parallel to the string, in a close proximity to it. Adjusting the feedback current, there can be adjusted the relaxation time and the resonance frequency of the first asymmetric mode of the string, while the symmetric modes remaining unchanged, that improves the device sensibity to the gravitation gradient."
