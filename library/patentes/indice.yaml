  resumen: "A gravitational-wave generating device is positioned on one side of a material object and a gravitational-wave detection device is positioned on the other side of the material object. The intervening material object's texture and internal structure will modify the gravitational wave's polarization, backscatter, phase velocity (which results in gravitational-wave bending), phase, frequency, or other characteristics and serve to image the material object's texture and internal structure when the gravitational-wave detector on the other side of the material object is connected to a display device. The gravitational waves can also be generated by a celestial background source or sources. Multiple gravitational wave generators and/or detectors, which can be in motion, can be utilized in order to obtain stereoscopic, three-dimensional views of the material object's texture and internal structure and to eliminate or screen out unwanted features of the material object."
