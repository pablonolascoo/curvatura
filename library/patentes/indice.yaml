  resumen: "An electromagnetic propellant-less thruster comprises at least one electric current transmission line 5a, a means of producing electrical pulses (1, 2, 4a, 4b in figure 1) of short predetermined duration and predetermined rate, and an electromagnetic shielding means forming a plurality of volumes, each volume containing at least one segment / section of the electric current transmission line, the shielding means preventing electromagnetic fields in one volume interacting with electric current in different volumes. Ideally, the arrangement comprises two superconducting parallel wires 5a, 5b located within the shielding means 6a, 6b, while the electric pulse duration, and the duration between the pulses in the first and second wires are of picosecond duration. The electromagnetic thruster claims to operate by making one wire react off the field created by the other wire thereby creating a force vector, but wherein the field created by the second wire does not does not affect the first wire. The device does not require propellant, only electrical energy."
