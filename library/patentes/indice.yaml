  resumen: "A device (10) for generating a force suitable for moving a mass and/or modifying the gravitational effect of masses, comprising a layer assembly (102), axially symmetrical with respect to a centre axis (107) and rotatable at a first predetermined rotational speed about the centre axis (107). The layer assembly (102) further comprises at least a first dielectric layer (1 18) arranged at one end of the layer assembly (102), a superconducting layer (120), operable at a predetermined temperature and adapted to be electrically connected to a high voltage generator (130) during use, a positron emitter layer (122), operatively mounted above the superconducting layer (120) when in use, and adapted to emit positrons toward the superconducting layer (120), and a second dielectric layer (124) arranged at the other end of the layer assembly (102). The device (10) further comprises a plurality of diametrically opposed field plates (112) adapted to provide an electromagnetic field (138) within the layer assembly (102) that is counter-rotating to the direction of rotation of the layer assembly (102) at a second predetermined rotational speed."
