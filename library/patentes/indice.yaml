  url: "https://patents.google.com/patent/US3722290A/en"
  resumen: "The invention is an instrument for detecting and measuring dynamic gravitational force gradient fields having a characteristic frequency and includes a body of elastic material having distributed mass including a dynamic mass quadrupole moment responsive to dynamic gravitational force gradients by the excitation of a mechanical vibrational resonant mode in the body of elastic material. The resonant mode has a vibration node in the body of elastic material whereat the body is supported. An electrical output is provided by means of at least one piezoelectric transducer coupled to the body which in conjunction with the aforementioned vibrational resonant mode forms an electromechanical circuit which is resonant at a selected frequency corresponding to the characteristic frequency of the dynamic gravitational force gradient."
