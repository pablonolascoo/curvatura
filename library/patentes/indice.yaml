  resumen: "Translated from German Die vorliegende Erfindung betrifft eine neue Form des Luft-, Land-, U-Boot- oder Weltraumantriebs, die durch die Nutzung geeigneter elektromagnetischer Wechselwirkungen erreicht wird. Durch die Verwendung von Kondensatoren, die aus symmetrischen oder asymmetrischen Leitern (1) und (2) bestehen, von einem Dielektrikum (3) umgeben sind und asymmetrischen Spannungsimpulsen oder einer asymmetrischen Ableitung des elektrischen Feldes ausgesetzt sind, erhalten wir gerichtete Antriebskräfte. Dies ist durch einen neuen Mechanismus des elektromagnetischen Antriebs möglich, der die Erhaltung des Gesamtmoments nutzt, wobei die Summe des mechanischen Moments und des Moments des elektrischen Felds immer erhalten bleiben muss, was zu einer konstanten und Null-Gesamtsumme der beiden Komponenten führt, wobei die Änderung des Moments des elektrischen Feldes eine entsprechende Änderung des mechanischen Moments des Kondensators erzeugt und so Antriebskräfte erzeugt, wobei die Trägheitskräfte abgeschwächt werden, wodurch Kraftfelder erzeugt werden können. The present invention relates to a new form of air, land, submarine or space propulsion achieved through the use of appropriate electromagnetic interactions. By using capacitors consisting of symmetrical or asymmetrical conductors (1) and (2), surrounded by a dielectric (3) and subjected to asymmetrical voltage pulses or asymmetrical derivation of the electric field, we obtain directional driving forces. This is possible …"
