  resumen: "Synchronous Polyphase Alternating Current Electrostatic Ion Thruster (SPACE-IT) for propulsion of spacecraft, comprising an ionization chamber with a central axis, the ionization chamber including a propellent gas inlet port for a propellent gas to be ionized in the ionization chamber, an inlet, an exit and an igniter between the propellent gas inlet port and the inlet of the ionization chamber, a propellent gas source, the propellent gas source being connected to the propellent gas inlet port, an ion accelerator arranged at the exit of the ionization chamber opposite the propellent gas inlet port in the direction of the central axis of the ionization chamber, the ion accelerator including at least three acceleration grids spaced apart from each other in the direction of the central axis of the ionization chamber and each extending perpendicular to the central axis of the ionization chamber, an ignition circuit electrically connected to the igniter, at least three high frequency coils surrounding at least a part of the ionization chamber, a high frequency ionization power generating unit electrically connected to the at least three high frequency coils, and a polyphase high voltage high frequency power generating unit electrically connected to the at least three acceleration grids of the ion accelerator."
