  url: "https://patents.google.com/patent/CA2638667A1/en"
  resumen: "The propulsion method is based on a gravito-inertial phenomenon predicted by the Basic Structures of Matter - Supergavitation Unified Theory (BSM-SG), the practical demonstration of which is called a Stimulated Anomalous Reaction to the Gravity (SARG) effect. The SARG effect is a unidirectional change of the gravito-inertial mass of an object by modulation the parameters of the physical vacuum. The suggested technique employs an asymmetrical envelope of EM activated neutral plasma. The result is a unique force field distinguished from the reactive jet propulsion by lack of throwing mass and effect of reduced gravito-inertial mass of the spacecraft and the surrounding gas molecules. This means a less power for acceleration and less turbulence when moving in a planetary atmosphere. A small scale SARG effect is verified by laboratory experiments. A unique field shield protection against micrometeorites, also predicted by BSM-SG theory, can be achieved by emission of properly space and time correlated EM field packets and superluminal waves, known also as X-waves. KEYWORDS: massless propulsion, space drive, field shield, X-waves, three-phase Tesla coil"
