  resumen: "Translated from German Vorrichtung zur Einkopplung von Ionisationsenergie in eine induktiv oder induktiv-kapazitiv angeregte Ionen- oder Elektronenquelle, mit – einem Entladungsgefäß (4) für ein zu ionisierendes Gas, – einer um das Entladungsgefäß (4) gewickelten Koppelspule (5) zur Einspeisung einer zur Plasma-Anregung notwendigen Hochfrequenz-Energie, – einem mit der Koppelspule (5) elektrisch gekoppelten Koppelkondensator (22), – einem mit der Koppelspule (5) elektrisch gekoppelten Hochfrequenzgenerator (16), der zusammen mit dem zumindest einen Koppelkondensator (22) einen Resonanzkreis ausbildet, wobei der Hochfrequenzgenerator (16) eine PLL-Regelungsvorrichtung (34) zur automatischen Impedanzanpassung des Resonanzkreises aufweist, so dass der Resonanzkreis mit einer Resonanzfrequenz betreibbar ist, dadurch gekennzeichnet, dass der zumindest eine Koppelkondensator (22) und die Koppelspule (5) über einen Transformator (42) an den Hochfrequenzgenerator angeschlossen sind, wobei der Transformator (42) primärseitig kapazitiv mit dem Hochfrequenzgenerator gekoppelt ist und sekundärseitig mit dem zumindest einen Koppelkondensator (22) und der Koppelspule (5) den Resonanzkreis bildet. Device for coupling ionization energy into an inductively or inductively-capacitively excited ion or electron source, with - a discharge vessel (4) for a gas to be ionized, - a coupling coil (5) wound around the discharge vessel (4) for feeding a plasma Excitation of necessary high-frequency energ…"
