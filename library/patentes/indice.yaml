  resumen: "Provided are a method and device for driving movement of a target object by a gravitational field generated by a varying electromagnetic field which relate to the technical field of physics. The method includes: generating, by a variable electromagnetic field generator, a time-varying electromagnetic field in space where a target is located; adjusting a frequency, amplitude and phase of the time-varying electromagnetic field so as to generate an effect of a varying magnetic field in the space; and based on the time-varying electromagnetic field, generating an acting force on the target object to drive the target object to move along a predetermined trajectory or direction. The present invention breaks through limitation that the traditional electromagnetic mechanics can only drive metal materials, utilizes the varying characteristics of the electromagnetic field to drive and realize accurate control of movement of all objects comprising a non-magnetic substance and a non-conductive substance."
