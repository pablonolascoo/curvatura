  resumen: "The present disclosure provides a plasma electric propulsion device comprising a capacitive energy storage device as a power source for an engine configured to heat and/or ionize and/or accelerate a propellant due to action of an electric field and/or magnetic field. The energy storage device comprises: a first electrically conductive electrode, a second electrically conductive electrode; and at least one metadielectric layer located between the first and second conductive electrodes. The metadielectric layer comprises at least one organic compound with at least one electrically resistive substituent and at least one polarizable unit. The polarizable unit is selected from intramolecular and intermolecular polarizable units. The organic compound is selected from the list comprising compounds with rigid electro-polarizable organic units, composite organic polarizable compounds, composite electro-polarizable organic compounds, composite non-linear electro-polarizable compounds, Sharp polymers, Furuta co-polymers, para-Furuta polymers, YanLi polymers, and any combination thereof."
