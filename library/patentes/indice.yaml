  resumen: "The invention relates to a solar control method for spacecraft. The inventive method can be used for the three-dimensional control of a spacecraft ( 10 ) comprising a body ( 12 ) which is equipped with means of creating internal kinetic moments ( 14 ) and bearing two wings ( 16 a, 16 b ) which are provided with solar panels. The aforementioned wings are disposed symmetrically on either side of the body of the craft ( 10 ) and can be oriented independently on the body ( 12 ) around a common axis (K). In addition, said wings are provided with elements ( 18 a , 18 b ) which create a solar pressure force that is offset in relation to the axis of rotation (K) on one wing ( 16 a , 16 b ) when said wing ( 16 a , 16 b ) is mispointed around the aforementioned axis (K) in relation to the sun. In order to create a moment that can change the orientation of the craft ( 10 ) around a windmill axis (J) which is orthogonal to the mid-plane of the wings ( 16 a , 16 b ), the wings ( 16 a , 16 b ) are mispointed in an opposing member. Moreover, in order to create a moment that can change the orientation of the craft ( 10 ) around an axis of imbalance (I) which is located in the nominal plane of the wings ( 16 a , 16 b ) and which is orthogonal to the axis of rotation (K) of the wings ( 16 a , 16 b ) on the body ( 12 ), the wings ( 16 a , 16 b ) are mispointed in the same direction."
