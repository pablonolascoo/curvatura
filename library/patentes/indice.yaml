  resumen: "Cooled system, which is exposed to a hot gas flow, comprises at least one wall (18) and a cooling device (30) which is integrated at least partially in the wall. At least one wall is made of a porous material at least in a partial region and at least one wall is cooled by transpiration and/or effusion cooling, where at least one magnetic field generating coil of superconducting material is arranged in at least one wall. Independent claims are also included for: (1) a driving device for a missile comprising at least one thrust chamber, which is formed as cooled system; (2) a re-entry body comprising the cooled system; (3) operating a system loaded with a hot gas stream with at least one porous wall, in which at least one wall is cooled by transpiration and/or effusion cooling, where a superconducting material is arranged in at least one wall of at least one coil, and at least one coil is cooled below the transition temperature by the transpiration and/or effusion cooling, and at least one coil deflects and/or accelerates a magnetic field which acts on an ionized stream of hot gas and ions; and (4) producing a cooled system comprising producing at least one wall using a preform, where the preform comprises fabric layers, which are infiltrated with resin, and inserting in the preform preparation of a helical conductor housing between fabric layers."
