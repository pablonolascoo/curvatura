  resumen: "An energy conversion system for extracting energy from the zero-point field of space is disclosed and described. This system includes a primary transducer operatively associated with a secondary transducer. The primary transducer can include a substrate having an arm rotatably coupled to the substrate, while the substrate can be confined to move along a linear oscillatory path. The secondary transducer converts kinetic energy of the substrate and arm to usable energy. The multi-mode motion of the substrate and arm combination is sufficient to impart a momentum influx to rotational motion of the arm. The momentum influx can then be converted to usable energy such as mechanical, electrical and/or thermal energy. As described in more detail herein, the momentum influx appears to be a result of radiation pressure due to scattering in part of the electro-magnetic momentum-energy contained within the zero-point field of space opposite to centripetal acceleration of the arm."
