  resumen: "The present invention relates to a novel form of air, land, subsea or space propulsion, achieved through the use of appropriate electromagnetic interactions. Through the use of coils (1) with an inner core (2) and a support part (3) that are subjected to current pulses with asymmetrical magnetic field and current derivatives directional propulsion forces are obtained. This is made possible by a novel electromagnetic propulsion mechanism that uses the conservation of total momentum in which the sum of the mechanical momentum and the electric field momentum should always be conserved, resulting in a constant and zero sum total of the two components, wherein the variation in the electric field momentum generates a corresponding change in the mechanical momentum of the coil, thus generating propulsion forces. When magnetic fields with an asymmetrical derivative are generated in an external volume, they can also generate force fields."
