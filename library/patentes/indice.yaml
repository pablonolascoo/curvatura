  resumen: "An aerospace electric motor using pulsed electromagnetic waves is a 100% electric motor that allows thrust to be generated even in the vacuum of space using high-voltage generators to charge low-inductance capacitors that are subsequently discharged onto field pulse emitters, whether these are electric, magnetic, or electromagnetic field pulse emitters, using electronic synchronisation and control circuits to generate high-power field pulses lasting fractions of a nanosecond, thereby achieving sustained thrust without the use of fuel or propellant. This technology is based on the concept that a force field can alter the dynamic state of a susceptible body without involving a momentum balance."
