  resumen: "Methods and systems for generating electric energy and mechanical power using principles of ECE-Theory are presented. The electric energy function uses an old Faraday Disk generator type system. Uniquely, it is embedded in a crossfield device (CFD). The CFD is based on ECE-Theory, and provides the external magnetic field (and a reduced gravity environment) for the generator portion of the crossfield-homopolar device. The device functions as both a generator and a motor. This anti-gravity effect is in accordance with the new ECE (Einstein-Cartan-Evans)-Theory of physics. ECE-Theory shows gravitation and electromagnetism are both defined as manifestations of the curvature of spacetime."
