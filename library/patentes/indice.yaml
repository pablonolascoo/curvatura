  resumen: "Primarily (but not exclusively) in the field of natural resources exploration, there is a requirement to measure the absolute value and variation of gravity at a given point and over an area gradient, thereby detecting the presence of sub-surface anomalies which give rise to the variation in the measured gravity value. In order to provide a portable, accurate, efficient and cost effective method for making the measurements, a gravity sensing apparatus (ABCD) can be deployed using a variety of vehicles, such as (for example, but not limited to) an aircraft or helicopter, with compensation applied by a motion sensing apparatus (EFGH) to reduce or eliminate the effects of vibration and vehicle motion and structural flexure on the gravity and gravity gradiometry data."
