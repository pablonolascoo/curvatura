  resumen: "The invention is a neutral atom (and/or molecule) matter-wave interferometer (and/or set of interferometers) that can be used as an inertial sensor with a sensitivity exceeding that of conventional mechanical sensors and multiple circuit optical interferometers (including ring lasers) by many powers of ten. An interferometer in which matter-wave propagation beam paths enclose a finite area will sense rotations via the Sagnac effect. One with the paths displaced from each other will sense acceleration plus gravity. The matter-wave energy and mass dependence of the phase shifts that are due to rotation and acceleration are different. Thus a pair of interferometers with different energies and/or masses can perform simultaneous independent measurements of rotation and acceleration. Interferometers with paths that follow a figure-eight pattern yield a gravitational gradiometer. Laser cooling and slowing of a beam of neutral atoms provides a low energy nearly monochromatic source. One form of the invention comprises a sequence of slits and/or diffraction gratings operation in high order. Gratings consist of slits in a solid material or near-resonant standing-wave laser beams. Path curvature due to acceleration and rotation is canceled by magnetic and/or electric field gradients that produce an effective levitation of slow atoms. A feedback system that maintains an interferometer phase null is employed with its error signal yielding the inertial effect signals. Magnetic fields are u…"
