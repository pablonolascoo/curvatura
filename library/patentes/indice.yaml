  resumen: "Translated from Chinese 本发明是一种改进设计的无质损电磁推进系统，包括控制器、功率测量模块、信号源、放大器、环行器、功率分配器、移相器、相位测量模块、耦合器、推力器谐振腔等，本发明将包括两个功率入口的推力器谐振腔引入无质损电磁推进系统，要求两个功率入口输入的微波同频率且相位差保持在90度附近，将功率‑频率闭环控制和两个功率入口之间的相位差控制同时引入无质损电磁推进系统，使得无质损电磁推进能够同时实现频率匹配和相位差控制，能够满足具有两个功率入口的无质损电磁推力器的频率稳定匹配和功率入口相位差控制，可以有效改进无质损电磁推进的工作性能，延长航天器使用寿命，并能够在此基础上产生新概念航天器。 The present invention is a massless electromagnetic propulsion system with an improved design, comprising a controller, a power measurement module, a signal source, an amplifier, a circulator, a power distributor, a phase shifter, a phase measurement module, a coupler, a thruster resonant cavity, etc. The present invention introduces a thruster resonant cavity including two power inlets into the massless electromagnetic propulsion system, requires that microwaves inputted into the two power inlets have the same frequency and the phase difference is kept at about 90 degrees, and simultaneously introduces power-frequency closed-loop control and phase difference control between the two power inlets into the massless electromagnetic propulsion system, so that the massless electromagnetic propulsion can simultaneously realize frequency matching and phase difference control, can meet the frequency stability matching and power inlet phase difference control of a massless electromagnetic thruster with two power inlets, can effectively improve the working performance of the massless electromagnetic propulsion, extend the service life of a spacecraft, and can produce a new concept …"
