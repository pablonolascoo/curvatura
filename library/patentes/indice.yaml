  resumen: "Systems and methods for orbit and attitude control of nanosatellites are provided. A spacecraft can be equipped with a plurality of pulsed ablative thrusters (PAT), mounted on at least one of the spacecraft body orientations. The PATs are integrated with the spacecraft structure. The actual spacecraft attitude is measured by a sensor and compared with the desired thrust direction. In order to reduce attitude errors, a control system is used to determine the firing sequence of thrusters. During maneuvering the thrusters are continuously being fired. To conserve energy a thrust switch control is utilized, selecting a single PAT to be fired each pulse. The result of this operation is that the attitude of the spacecraft is adjusted continuously. Therefore, thrust deviation from a selected path can be minimized during orbital maneuvering."
