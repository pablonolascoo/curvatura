  resumen: "A portable generator produces gravitoelectric and/or gravitomagnetic fields 1. A high speed turbine 5 which may rotate between 500,000 and 1 million revolutions per minute is connected from said turbine via drive shafts 4 to a superconductor 2 possibly made from a ring of niobium contained within a freezing chamber 3 that may be cooled to a temperature of 4 degrees Kelvin or lower. Said chamber may also be subject to a vacuum, induced by a vacuum pump 8. A cooling system 7 may be provided. A second drive shaft 4 may be outputted from said turbine 5 and rotate a generator 6 which provides power to said vacuum pump and cooling system. An energy supply 9 may provide power for the device. A control system 10 may be employed to control the device. Cooling the niobium superconductor to, or below, the critical temperature and rotating it at speeds above 500,000 rpm is claimed to produce gravitomagnetic fields which may be employed in anti gravity or lifting devices. Rapidly accelerating said ring may cause the production of gravitoelectric fields. A plurality of generators may be linked together to increase the field strength."
