  resumen: "The prior art has discovered that a rotating high temperature ceramic superconductor cooled below 70 °K creates a gravitational 'shielding' effect. The present invention differs by instead of rotating a superconductor material the material is held fixed in a varying magnetic field to maximize the continuous variation of the distribution, location and configuration of the circulating currents so as to continuously vary the sites of transition of the material between more stressed and less stressed conditions of circulating currents to produce a gravitational alteration effect which, in a superconductor corresponding to sites transitioning between superconducting and normal conducting states, produces an even more pronounced gravitational alteration effect. The apparatus includes an excitation assembly in which an insulator (10) is a mechanical substrate to support magnetic field pole pieces (20)."
