  url: "https://patents.google.com/patent/US20090183951A1/en"
  resumen: "Inertial propulsion is a largely undeveloped field. Inertial propulsion is defined as propelling a vehicle without the use of a propellant such as rocket fuel or ions, or by the application of an external force. Disclosed herein are two separate processes that do not require a propellant and do not produce an equal and opposite reaction against any external form of matter in the Local Inertial Reference Frame and do not violate Newton's Laws in the Universal Reference Frame. The first process produces horizontal motion, relies on the earth's gravitational field as an external force, and has been successfully tested. The second process produces vertical motion and relies only on the aether. It has been successfully tested considering the effect of the earth's gravity. The two processes referenced above are examples of converting the rotary motion of a spinning rotor into unidirectional linear motion. Due to the law of conservation of angular momentum, the first process is normally considered not possible, but with the proper use of an external field (for example, gravity) and the phenomenon of precession, it becomes possible. A clear distinction is made between a simple rotor and a gyroscope which is a far more complex device."
