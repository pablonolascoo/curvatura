  resumen: "The invention relates to an electromagnetic toroidal impeller in the field of physics applied to electromagnetism. The invention comprises a cylindrical arrangement of superconducting antennas (9) which are separated by a dielectric (8) over a superconducting cylindrical pate (7) and exposed in a resonant cavity (6). The radiation in the cavity is incident on the force ring having a superconducting surface (4) containing ferrite (11), the coolant (5) introduced through the pipes (1) flowing through the toroidal interior of same. The force received in the ring (4) is transmitted via the supporting members (3) to the support (2). The cavity is thermally insulated with insulation (12) and is cooled with the liquid (10) through the pipes (14). The invention provides a device capable of generating driving force from the conversion of the energy available in electromagnetic waves that are contained in a resonant cavity."
