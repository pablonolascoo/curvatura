  resumen: "The present invention discloses systems and methods for electromagnetic field spacecraft propulsion. The system includes reaction thrust assemblies comprising conductor coils with alternating segments of magnetic field shield assemblies. Unshielded reaction thrust assembly segments are bracketed by field activation coils generating shaped magnetic fields. The action of the magnetic fields on currents in the unshielded coil segments of the reaction thrust assemblies produce unidirectional Lorentz Forces, thereby generating thrust without reaction mass, while reaction momentum is carried away by Poynting Vector fields in conformity with the currently understood principles of electrodynamics."
