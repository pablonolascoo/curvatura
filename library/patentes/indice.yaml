  resumen: "The present invention discloses a kind of water-cooling structure magnetic plasma propeller, forms arc chamber using expanded anode, hollow cathode and inner conical surface insulating ceramics；Insulator connection cathode and anode are designed, realizes insulation connection；Reach sealing purpose in crucial cooperation position installation flexible graphite gasket；Design installation insulating part realizes that thruster is connect with magnetic coil radial fit, guarantees alignment, improves the precision of complementary field bit-type；Using locking post fastening structure thruster, realize that thruster is arbitrarily adjustable relative to magnetic coil axial position；Cathode and anode all use cavity water-cooling structure；It is supplied using argon gas as propellant, cathode and anode, is discharged in arc chamber through the high-voltage breakdown between cathode and anode simultaneously, and continue to ionize out plasma and spray under additional electromagnetic field action from anode to generate thrust.The present invention can in 10~20kW power bracket steady operation, and provide bold and unconstrained ox grade thrust, be of great significance to the design of magnetic plasma propeller structure, experimental study."
