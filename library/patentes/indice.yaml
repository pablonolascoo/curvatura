  resumen: "A magnetic field propulsion unit (1) for generating a drive force when being arranged in an external magnetic field (100) is described. The magnetic field propulsion unit (1) includes a support structure (5), a magnetic field generating device (10) attached to the support structure (5) and configured to generate a first magnetic field (12), an energy supply unit (30), and a control unit (40). The energy supply unit (30) provides the magnetic field generating device (10) with electrical energy. The control unit (40) controls the energy supply unit (30) so that the energy supply unit (30) supplies energy to the magnetic field generating device (10). The control unit (40) supplies varying current to the magnetic field generating device (10). The magnetic field generating device (10) has a central axis (11) and is arranged in the external magnetic field (100) such that the central axis (11) is inclined with respect to magnetic field lines (101) of the external magnetic field (100) at an angle different from 0°, 90°, 180°, and 270°."
