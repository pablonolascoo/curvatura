  resumen: "Translated from Japanese 【課題】核融合パワーロケットエンジンから高比推力および適度な推力を発生する方法を提供する。【解決手段】連続核融合反応から高推力および所望の比推力を生成し、制御するためのシステムおよび方法を開示する。結果として、比較的小さなロケットエンジンは、惑星系全体およびそれを越える宇宙船のミッションを可能にする従来技術の開発、試験および操作にかかる費用を削減できる。ロケットエンジンの方法およびシステムは、リアクタチャンバと、定常プラズマ中に核融合反応を生成する加熱システムと、を有する。磁石は、定常プラズマを閉じ込める磁場を生成する。燃料噴射システムおよび推進剤噴射システムは組み込まれている。リアクタチャンバの一端において低温推進剤を高温推進プラズマに変換するため低温推進剤をガスボックスに導入する。推進剤および核融合生成物は磁気ノズルを介してリアクタチャンバの外へ放出され、推力を生成する磁力線から脱離される。【選択図】図３ A method for generating high specific force and moderate thrust from a fusion power rocket engine is provided. Systems and methods for generating and controlling high thrust and desired specific thrust from continuous fusion reactions are disclosed. As a result, a relatively small rocket engine can reduce the costs of developing, testing, and operating prior art that allows for missions of the entire planetary system and beyond. The rocket engine method and system includes a reactor chamber and a heating system that generates a fusion reaction in a stationary plasma. The magnet generates a magnetic field that confines the stationary plasma. A fuel injection system and a propellant injection system are incorporated. At one end of the reactor chamber, a low temperature propellant is introduced into the gas box to convert the low temperature propellant into a high temperature propulsion plasma. The propellant and fusion product are released out of the reactor chamber via a magnetic nozzle and desorbed from the magnetic field lines that generate thrust…"
