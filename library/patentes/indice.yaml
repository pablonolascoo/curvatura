  resumen: "The present invention relates to the use of technical drive systems, which operate by the modification of gravitational fields. These drive systems do not depend on the emission of matter to create thrust but create a change in the curvature of space-time, in accordance with general relativity. This allows travel by warping space-time to produce an independent warp drive system. Differential electron flow through a body in rotation is directed so as to simultaneously pass through a said body in its direction of rotation and contrary to its direction of rotation so as to release a directed flow of gravitons."
