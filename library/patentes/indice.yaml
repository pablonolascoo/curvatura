  resumen: "The invention discloses a small-size high-power helicon wave plasma source device and a magnetic plasma engine, which are used for solving the problems that the loading power of a helicon wave plasma source in the existing magnetic plasma engine is low, the operation of the magnetic plasma engine is unstable and the size of the magnetic plasma engine is increased. The device specifically comprises an ionization antenna, a vacuum shell and a superconducting magnet; the ionization antenna is wound outside the discharge chamber and is used for ionizing a gas working medium in the discharge chamber and generating plasma; the vacuum shell is coaxially sleeved outside the discharge chamber and the ionization antenna, and the inside of the vacuum shell is in a vacuum environment; the superconducting magnet is coaxially sleeved outside the vacuum shell and corresponds to the ionization antenna."
