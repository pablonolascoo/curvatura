  resumen: "Disclosed herein are two separate processes that do not require a propellant and do not produce an equal and opposite reaction against any external form of matter in the Local Inertial Reference Frame and do not violate Newton's Laws in the Universal Reference Frame. The first process produces horizontal motion, relies on the earth's gravitational field as an external force, and has been successfully tested. The second process produces vertical motion and relies only on the aether. It has been successfully tested considering the effect of the earth's gravity. Due to the law of conservation of angular momentum, the first process is considered by some to not be possible, but with the proper use of an external field (for example, gravity) and the phenomenon of precession, it is clearly possible. A clear distinction is made between a simple rotor and a gyroscope which is a far more complex device."
