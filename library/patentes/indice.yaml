  resumen: "A propulsion system for aerial, terrestrial, underwater or space propulsion, achieved through the manipulation (or engineering) of the vacuum with the proper electromagnetic interactions. This vacuum manipulation will allow the use of a new form of propulsion, and has applications in energy production and on the change of the time decay of radioactive elements. Opposing magnetic or electric fields create a mass repelling force, while attracting magnetic or electric fields create a mass attracting force. In particular, this vacuum manipulation process can be used to propel a mass that contains the field sources that perturb the vacuum. One possible application is the creation of a repulsion point in space through the interference of two or more longitudinal electrodynamic wave beams, which cause a repulsion force on the mass."
