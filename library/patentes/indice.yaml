  resumen: "The invention relates to space engineering, in particular, to electric propulsion systems (EP) with electric rocket engines with electrodeless plasma source and acceleration stage using a wide variety of substances as a propellant, designed mainly for installation onboard a spacecraft for transferring it from parking orbit to the target orbit, orbit maintenance, attitude control, altitude control, unloading attitude control systems, maneuvers between orbits, and de-orbiting. The bi-directional wave plasma thruster for spacecraft consists of a gas discharge chamber defining thrust axis, antenna, RF-generator module electrically coupled with antenna, magnetic systems, wherein the gas discharge chamber is configured open to outer atmosphere from two opposite end-faces to form two thrust vectors opposite in direction and having common axis being the axis of the gas discharge chamber, while the antenna is on the outer side of the gas discharge chamber and is surrounded by a ring of dielectric material from its outer side, and there is one magnetic system on each opposite end of the gas discharge chamber, while the gas discharge chamber has a gas dynamic connection line with a propellant supply and storage system by means of two radial gas feedthroughs tightly connected to the gas discharge chamber in two places upstream of the magnetic systems. The technical result is the reduction of thruster weight and dimensions, increase of the specific thrust and specific impulse per consumed…"
