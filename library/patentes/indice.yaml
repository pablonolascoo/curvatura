  resumen: "Translated from German Der rein elektrische Raumantrieb ist ein Antrieb für Raumsonden, Satelliten und ähnliches, der ohne den Ausstoß von Materie Schub erzeugt. Der Antrieb arbeitet mit der Interaktion zwischen elektromagnetischen Feldern und Wellen. Damit der Antrieb effizienter arbeiten kann, kommen virtuelle elektromagnetische Wellen zum Einsatz die sich schneller bewegen können als Licht. Diese virtuellen elektromagnetischen Wellen erlauben es dem Antrieb Lichtgeschwindigkeit zu erreichen und zu überschreiten. The purely electric space propulsion is a propulsion for space probes, satellites and the like, which generates thrust without the emission of matter. The drive works with the interaction between electromagnetic fields and waves. For the drive to work more efficiently, virtual electromagnetic waves are used which can move faster than light. These virtual electromagnetic waves allow the drive to reach and exceed the speed of light."
