  resumen: "A system and method for generating one or more electrostatic pressure forces or one or more divergence in electric field forces, or both, acting on at least one surface of an object. Asymmetries in the resulting force vectors result in a net resulting force acting on the object. The magnitude of the net resulting force may be a function of the geometry of the object surfaces, the amount of electric charge present on the surfaces, and the dielectric constant(s) of materials present in a gap between the object surfaces. The invention may be produced on a nanoscale using nanostructures such as carbon nanotubes. The invention may be utilized to provide a motivating force to an object. A non-limiting exemplary use case example is the use of electrostatic pressure force apparatus as a propellantless thruster to propel a spacecraft through a vacuum."
