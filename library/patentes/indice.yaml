  url: "https://patents.google.com/patent/US9287840B1/en"
  resumen: "A method of producing accelerations without ejecting any material exhaust which relies on inducing mass fluctuations in conventional electrical circuit components and combining them with a mechanically coupled periodic thrust to produce propulsive forces without the ejection of any propellant. Ferroelectric force transducers, in particular, piezoelectric transducers, are driven by at least two phase-locked voltage waveforms so that the rest mass fluctuation and mechanical excursion needed to produce a stationary thrust are both produced in the transducer itself. Parametric amplification is used to achieve high amplitude, correctly phase-locked voltages of correct frequencies to activate the transducer by the simple addition of a DC voltage to the AC voltage of a single frequency driving signal. The driving voltage waveforms may be pulsed to maximize the thrust and reduce the duty cycle of the active components of the system."
