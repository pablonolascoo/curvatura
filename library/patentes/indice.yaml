  resumen: "This invention discloses an ultra-strong propulsion system, operating by the implementation of magnetic pressure of a rectangular-shape coil on its wires and support. In the normal cases, the pressure on the wires of electromagnetic coils is equal and uniform on all faces. The thrust force is generated by making the magnetic pressure on opposite faces of the electromagnetic coil support unbalanced, such that, the magnetic force on one face of rectangular coil is much greater than the opposite face. The resultant vector addition of two counter forces on the two counter-faces of the rectangular support acts as the thrust force. The propulsion system consists of a big rectangular electromagnetic coil that is immersed in two different materials with very different relative magnetic permeability such that exactly half of the rectangular electromagnetic coil is immersed in higher relative permeability (ferromagnetic or superparamagnetic) material and the second half is immersed in a low magnetic permeability material such as air. Magnetic materials fill completely inside the rectangular electromagnetic coil, such that there is no gap in the support (figs.1 and 2.). covering-materials have enough thickness to conduct all of the magnetic field inside themselves. Due to the difference in the magnetic permeability of two materials, the magnetic field on the two opposite faces of the rectangular electromagnetic coil are drastically different that make one of counter-forces much greater …"
