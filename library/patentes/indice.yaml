  url: "https://patents.google.com/patent/US5197279A/en"
  resumen: "An electromagnetic energy propulsion engine system including a hollow housing having a front part (50) and a rear end part (4) of material transparent to the passage of electromagnetic fields, electromagnetic field generating solenoidal windings (23), (25), having central axes parallel with the central axis of the engine and axially spaced from each other to provide a forward field generating winding (25) and a rear field generating winding (23), a power source (44), a control computer (42), and a power pulse generator (40) connected between the electromagnetic field generating windings and the power source and control computer. The forward field generating winding generates a rearwardly directed magnetic field toward the rear wall parallel to the central axis, and the rear field generating winding produces a forwardly directed magnetic field opposing the rearwardly directed magnetic field of the forward field generating winding so that the rearwardly directed magnetic field repels forwardly directed pulses of the rear magnetic generating winding. As the electrical current conduction in the rear field generating winding suddenly reduces, the continuing rearwardly directed magnetic field force transmits pulsating magnetic field energy produced by the rear field generating winding through the rear of the housing. The reaction to the rearwardly transmitted field energy produces a thrust propelling the engine and a vehicle in which it is mounted."
