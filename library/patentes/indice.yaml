  resumen: "The electromagnetic field generator includes a shell, an electrostatic generator, a power plant, a thermoelectric generator, and an electric motor. The shell has embedded polycrystalline ferroelectric ceramic material which is polarized such that the ceramic material exhibits strong Piezoelectric Effect properties thus inducing high frequency vibrations. The shell may be further doped with radioactive elements which under high frequency vibrations induce gamma ray emission. The electrostatic generator is for charging up the shell and is disposed within the shell. The power plant is to generate thermal power, and is disposed within the sphere. The thermoelectric generator is to convert the thermal power generated by the power plant to electrical energy. The electric motor powered by the electrical energy generated by the thermoelectric generator, and supplies input voltage such that the shell spins at high angular speeds, vibrates at high frequencies, and generates an electromagnetic field."
