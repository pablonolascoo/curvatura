  resumen: "A gravitational radiation communication system. The system includes a gravitational radiation transmitter and a gravitational radiation receiver. Each of the transmitter and the receiver includes a first cylindrical superconducting cavity, having a first length, a first diameter, and an entrance aperture for electromagnetic radiation; a second cylindrical superconducting cavity, having a second length, a second diameter, and a first aperture for gravitational radiation, the second cavity being coaxial with and adjacent the first cavity; and a superconducting movable membrane positioned between the first cavity and the second cavity and configured to provide parametric amplification of electromagnetic fields in the second cavity. The first aperture is configured to pass gravitational radiation."
