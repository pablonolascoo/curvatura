  url: "https://patents.google.com/patent/US20230253896A1/en"
  resumen: "Numerous patents have been granted for methods to extract useful zero-point energy (ZPE). However, these methods utilize the Casimir force, which is orders of magnitude too small to power an electrical grid. The method and apparatus described here uses counter-rotating mercury based plasmas pulsed with a high frequency, high voltage discharge to create a coherence with the zero-point field, allowing for unlimited extraction of ZPE, which may ultimately replace polluting fossil fuel derived energy. Mainstream physics models gravity as a curvature of space (general relativity), but there are profound problems with this model. An alternative model of gravity advanced by some physicists models gravity (and inertia) as an induced effect resulting from the interaction of ZPE with subatomic charge. By creating a coherence with the zero-point field, this method causes an interference with this interaction, allowing gravity and inertia to be engineered or nullified, representing a breakthrough in propulsion."
