  resumen: "The present invention relates to a novel form of air, land, underwater or space propulsion, achieved through the use of appropriate electromagnetic interactions. By using a toroidal coil (1) with an internal magnetic core (2), forces can be developed in a dielectric (3) placed close to the coil (1), through the asymmetrical variation of the electric fields applied to the same, due to the variation of the magnetic flux that takes place inside the coil (1). This is possible due to a novel electromagnetic propulsion mechanism that uses the conservation of total momentum, in which the sum of the mechanical momentum and the electric field momentum must always be conserved, resulting in a constant and zero-sum total of the two components, wherein the variation in the electric field momentum will generate a corresponding change in the mechanical momentum of the dielectric, thereby generating propulsion forces."
