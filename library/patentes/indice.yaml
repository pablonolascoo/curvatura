  resumen: "A pulsed plasma thruster provides for an advanced lightweight design with solid propellant and predominately electromagnetic thrust in a coaxial geometry. Electromagnetic forces are generated in a plasma by current flowing from a small central electrode to an electrically conducting diverging nozzle electrode. The thruster employs a series of electric current pulses of limited duration and varying frequency between the pair of electrodes creating a series of electric arcs. The electric arcs pass over a propellant surface located between the electrodes, forming a plasma, which is then exhausted from the device to produce thrust. The thruster maintains a low plasma resistance and cavity pressure, which in turn yields strong electromagnetic body forces, resulting in a high efficiency and consistent pulse-to-pulse performance."
