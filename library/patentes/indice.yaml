  resumen: "A gravitational wave generating device comprising an excitation means acting on an excitable element such as a molecule, atom, nucleus or nuclear particle to produce a nuclear reaction or collision, the product of which is movable in a single preferred direction over a very short period of time by additional impact (jerk or harmonic oscillation) of a set of target nuclei or other excitable elements. The target nuclei or excitable elements acting in concert produce a gravitational wave. A preferred embodiment involves the use of a pulsed particle beam moving at a local gravitational wave velocity in a target body consisting of target nuclei, so as to trigger nuclear reactions and establish a coherent gravitational wave when the particles of the beam move through the target body and hit the target nuclei over a very short time span. An information processing device connected to the computer controls the high frequency (GHz to THz) pulse rate of the particle beam and the number of particles in each cluster comprising pulses to produce a modulated gravitational wave capable of carrying information. The gravitational wave generating device exhibits directivity. The gravitational wave detection device exhibits directivity and can be tuned. A medium is used in which the velocity of gravitational waves is reduced in order to influence gravitational wave refraction."
