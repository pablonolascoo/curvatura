  url: "https://patents.google.com/patent/KR20250127079A/en"
  resumen: "Translated from Korean 자유 전자와 같은 자유 렙톤에 흡수된 광자 에너지의 보존과 관련된 무반응 추진 수 단. 구체적으로, 자유 전자와 같은 기본 입자의 보존 법칙은 광자 흡수 중 관성 운동량 및 운동 에너지에 해당하는 질량/에너지의 관성 파라미터가 교환에서 3의 신체 반응 파트너의 반응이 없는 상태에서 운동 에너지에 해당하는 관성 파라미터의 증가를 초래한다. 일 실시예에서, 마이크로파 방 사선과 같은 방사선은 자유 전자에 흡수되어 우선 축을 따라 운동 에너지를 얻고 양이온과 플라즈마 흐름을 끌 수 있다. 전자 또는 반발 정전기장 또는 강성 피스톤에 입사하여 운동 에너지를 추진 변환한다. 또는 플라즈마의 운동 에너지는 자기 유체 역학 변환기에 의해 추진 변환되어 플라즈마 흐름이 MHD 채널의 짧은 거리 내에서 정지된다. A non-reaction propulsion mechanism involving the conservation of energy of a photon absorbed by a free lepton, such as a free electron. Specifically, the conservation laws of elementary particles, such as free electrons, result in an increase in the inertial parameter corresponding to kinetic energy in the absence of a reaction of the three-body reacting partner in the exchange of inertial momentum and kinetic energy during photon absorption. In one embodiment, radiation, such as microwave radiation, can be absorbed by free electrons, gaining kinetic energy along a preferred axis and attracting positive ions and plasma flows. The kinetic energy is converted to propulsion by incident electrons or repulsive electrostatic fields or rigid pistons. Alternatively, the kinetic energy of the plasma is converted to propulsion by a magnetohydrodynamic converter, so that the plasma flow is stopped within a short distance of the MHD channel."
