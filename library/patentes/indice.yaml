  resumen: "Translated from Chinese 本发明是一种低功率、磁场可调的圆柱型电磁等离子体推进器，属于电推进领域。本发明推进器包括前后线圈、环形阳极、陶瓷放电通道、纯铁套筒、铁芯、前后封盖等。陶瓷放电通道形成的放电室为圆柱型。在陶瓷放电通道前后分别安装前后线圈，通过调整线圈电流来改变放电室内的磁场分布。本发明还在陶瓷放电通道出口端安装磁导环，有利于放电室内等离子体生成区和加速区分离，使离子获得充分加速，提高了推进器比冲。本发明的推进器将常规霍尔推进器的放电室改进为完全的圆柱型，改变其内部电子约束方式，解决了环形霍尔推进器在低功率下腐蚀率较高的问题，电离效率显著提升，而且能在100W以下稳定工作，拓展了常规电推进器在低功率领域的应用。 The invention relates to a cylindrical electromagnetic plasma thruster with low power and adjustable magnetic field, belonging to the field of electric propulsion. The thruster of the present invention includes front and rear coils, annular anodes, ceramic discharge channels, pure iron sleeves, iron cores, front and rear covers, and the like. The discharge cells formed by the ceramic discharge channels are cylindrical. The front and rear coils are installed before and after the ceramic discharge channel, and the magnetic field distribution in the discharge chamber can be changed by adjusting the coil current. The invention also installs a magnetic guide ring at the outlet end of the ceramic discharge channel, which is beneficial to the separation of the plasma generation area and the acceleration area in the discharge chamber, so that the ions can be fully accelerated, and the specific impulse of the propeller is improved. The thruster of the invention improves the discharge chamber of the conventional Hall thruster into a complete cylindrical shape, changes its internal electronic restraint mode, solves the problem of high corrosion rate of the annular Hall…"
