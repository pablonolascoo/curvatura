  resumen: "The present invention relates to a new form of air, land, underwater, or space propulsion, achieved by the use of suitable electromagnetic interactions. When using coils (1), with internal core (2) and support piece (3), subjected to current pulses with asymmetric current derivative and magnetic field, we obtain directional propulsion forces. This is possible due to a new electromagnetic propulsion mechanism that uses the conservation of total momentum where the sum of the mechanical moment with the moment of the magnetic field must always be conserved, resulting in a constant and null total sum of the two components, where the variation of the magnetic field moment will generate a corresponding change in the mechanical moment of the coil, thus generating propulsion forces. When magnetic fields with asymmetric derivative are produced in an external volume, they may also generate force fields."
