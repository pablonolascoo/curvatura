  resumen: "A superconducting microwave radiation thruster used to accelerate a spacecraft or an airborne vehicle. The thruster includes a flat superconducting surface for the major end plate and a specially shaped, non-superconducting minor end plate and a non- superconducting taper section. This geometry considerably simplifies the manufacturing of the thruster. The thruster includes circularly polarised input and detector antennae which, when combined with a phase locked loop control circuit, enable the input frequency to be corrected for Doppler shifts, caused by acceleration of the thruster. These Doppler shifts would otherwise cause a decrease in cavity Q value, and thus an unacceptable decrease in output thrust."
