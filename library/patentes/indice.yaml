  resumen: "A Fiber-fed Pulsed Plasma Thruster (FPPT) has an anode, a coaxial insulator, and a fiber propellant feed system. At least two cathodes insulated from each other are configured about the coaxial insulator to define an interior profile shaped into a nozzle region. At least one igniter fitted through each cathode. Wherein when the igniters are triggered, the igniters expel electrons toward the anode to ignite a primary high energy discharge between the anode and the cathodes thereby creating a plasma that vaporizes the fiber propellant. The dissociated fiber propellant combines with the primary high energy discharge to create a partially or fully ionized plasma, that is electromagnetically and electrothermally accelerated to produce predominantly {right arrow over (j)}×{right arrow over (B)}{right arrow over (j)}×{right arrow over (B)} thrust."
