  resumen: "A magnetic field propulsion unit includes a first magnetic field generating device (“FMFGD”) generating a magnetic field; a second magnetic field generating device (“SMFGD”) generating a magnetic field; an energy supply unit providing the FMFGD and the SMFGD with electrical energy; and a control unit controlling the energy supply unit in accordance with a predefined switching scheme. The SMFGD is a rod-like antenna that lies in a plane in which also the FMFGD lies. The control unit is: supplying the SMFGD with electrical energy so that a second magnetic field surrounding the SMFGD is generated; supplying the FMFGD with electrical energy so that a first magnetic field surrounding the FMFGD is generated. The FMFGD is supplied with electrical energy a predetermined period of time after the SMFGD is supplied with electrical energy."
