  url: "https://patents.google.com/patent/US20020085661A1/en"
  resumen: "A propulsion system for a space vehicle is designed as a fully self-contained system which does not eject particles to effect the propulsion, referred to as a “reactionless drive”. Propulsion is effected by changing the mass of rings of charged particles by acceleration of the rings of charged particles to velocities near the speed of light and back to a rest or near rest speed in an oscillatory manner. While this is taking place, the charged particles are moved back-and-forth within a contained housing to impart thrust when the large mass particles are moved, and allowing the return of the low mass particles to the original starting place before imparting high velocity rotation to increase the mass of the particles. The average velocity is less than the actual velocity; so that if the vehicle is placed within a singularity, the singularity might travel faster than light without passing through a condition where the vehicle mass approaches infinite mass."
