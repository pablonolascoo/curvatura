  resumen: "An electromagnetic energy momentum thruster has a cavity resonator and an electromagnetic radiation source for emitting an electromagnetic wave in evanescence into the cavity resonator. The electromagnetic wave produces a greater electromagnetic field amplitude and a greater electromagnetic radiation pressure on a primary interior surface area of the cavity resonator than on a secondary interior surface area of the cavity resonator. The difference between the electromagnetic field amplitude on the primary interior surface area and on the secondary interior surface area of the cavity resonator forms a highly directional electromagnetic energy momentum tensor and provides a highly directional general relativistic metric tensor. As a result, a force is produced on the cavity resonator in the form of a thrust or an acceleration that propels the device in a direction substantially perpendicular to the primary interior surface area."
