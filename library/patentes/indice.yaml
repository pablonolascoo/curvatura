  resumen: "The invention relates to the technical field of celestial physics and discloses a method, a device, equipment and a medium for acquiring gravitational wave signals, wherein the method comprises the steps of acquiring a first orbit parameter, a first quality parameter and a first structure parameter of dual-white dwarf, determining a target radius based on the first orbit parameter and the first quality parameter, comparing the target parameter in the first structure parameter with the target radius, determining a second quality parameter, a second structure parameter and a second orbit parameter, acquiring dual-white dwarf gravitational wave signals or dual-white dwarf gravitational wave signals and gravitational wave signals of a suction disc based on the second quality parameter and the second orbit parameter, judging whether a termination condition is met, and if the termination condition is not met, determining the target radius based on the first orbit parameter and the first quality parameter, and repeatedly executing until the termination condition is met, so as to obtain a gravitational wave signal set. The gravitational wave signal can be accurately obtained by updating the orbit parameters, the quality parameters and the structural parameters."
