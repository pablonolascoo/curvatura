  resumen: "Methods and a typical minimum system for generating propulsion system is provided. The propulsion is generated by making magnetic pressure nonuniform which exerted on the lateral surface of a racetrack-shape superconducting coil. In normal conditions the magnetic pressure is exerted uniformly (equal value) on all of the lateral surfaces of the coil which exhibits itself as huge amounts of tension on the support of the coil. By inserting a ferromagnetic or a superparamagnetic material in half of the core from top to bottom or by immersing the half of core from top to bottom the magnetic field of filled part is limited to the value of magnetic saturation of the ferromagnetic or superparamagnetic material but the magnetic field in empty parts remain unchanged consequently magnetic the net magnetic pressure is not equal zero. The net magnetic pressure pushes the superconducting coil in the resultant direction.The net magnetic pressure is exerted to the support of the superconducting coil which is fixed firmly to the vehicle which in turn pushes the vehicle."
