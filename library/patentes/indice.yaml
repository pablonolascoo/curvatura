  url: "https://patents.google.com/patent/US5170623A/en"
  resumen: "A hybrid chemical/electromagnetic propulsion system which combines thermal expansion of a chemically-reacted propellant with electromagnetic acceleration of the propellant to provide an efficient propulsion system that operates in the specific impulse I sp range of 800 to 2500 seconds. The hybrid chemical/electromagnetic propulsion system includes a reaction chamber, an expansion nozzle mounted to the exit of the reaction chamber, and an induction coil wound around a portion of the expansion nozzle. The reaction chamber supports the combustion or chemical reaction of a propellant to form high-temperature ionizable reaction products. The expansion nozzle then expands these high-temperature reaction products to generate thrust. The induction coil generates a varying electric and magnetic field which ionizes and magnetically accelerates the reaction products to generate additional thrust. A drive circuit supplies current to the induction coil in a manner that maximizes this additional thrust."
- numero: "US5142861A"
