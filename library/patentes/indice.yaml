  resumen: "A dipolar force field propulsion system having a alternating electric field source for producing electromotive lines of force which extend in a first direction and which vary at a selected frequency and having an electric field strength of a predetermined magnitude, a source of an alternating magnetic field having magnetic lines of force which extend in a second direction which is at a predetermined angle to the first direction of the electromotive lines of force and which cross and intercept the electromotive line of force at a predetermined location defining a force field region and wherein the frequency of the alternating magnetic field substantially equal to the frequency of the alternating electric field and at a selected in phase angle therewith and wherein the magnetic field has a flux density which when multiplied times the selected frequency is less than a known characteristic field ionization potential limit; a source of neutral particles of matter having a selected dipole characteristic and having a known characteristic field ionization potential limit which is greater than the magnitude of the electric field and wherein the dipoles of the particles of matter are capable of being driven into cyclic rotation at the selected frequency by the electric field to produce a reactive thrust, a vaporizing stage which vaporizes said particles of matter into a gaseous state at a selected temperature, and a transporting system for transporting the vaporized particles of matter…"
