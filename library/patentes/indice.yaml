  resumen: "The present invention discloses an electromagnetic propulsion device for generating unidirectional force and method thereof. The electromagnetic propulsion device comprises one or more pod units, a power source, a control unit. Each pod unit comprises an enclosure, one or more magnetic flux-controlling cores, one or more pairs of magnetic materials, and one or more electrically conductive elements. The one or more pod units operatively form a structure of the vehicle in a pre-defined shape, configured to generate the unidirectional force. The pre-defined shape is configured to provide a distributed propulsion and a control redundancy based on arranging the one or more pod units in defined geometries to form the structure of the vehicle. The control unit is configured to activate and deactivate the one or more pod units, regulate thrust levels, and change propulsion direction of the vehicle."
