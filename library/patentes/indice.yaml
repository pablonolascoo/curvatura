  resumen: "The operation of the ultra-high frequency (UHF) electromagnetic motor or thruster, is based on generating extremely short and powerful electrical, magnetic or electromagnetic field pulses and separating (unrooting) or disassociating said field pulses from the originating source, so that subsequently the emitting device and a device that is the objective or target, a support structure that supports both devices and another elements connected to said support structure are for an instant disassociated from the field, waiting for the pulsed field to reach the objective or target. At that moment, the element emits a field with a polarization that allows the exertion of a force that attracts or repels the field pulse, with respect to the objective or target and consequently with respect to the motor of which they form part as a unit, both the emitter and the target being joined by a support structure."
