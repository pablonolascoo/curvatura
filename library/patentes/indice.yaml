  resumen: "Translated from Chinese 本发明涉及一种类光引力波探测器，属于弱信号探测技术领域。类光引力波探测器，包括：发射电极、石墨烯基底、类光分束镜、收集电极、绝缘层和基底电极，发射电极和收集电极分别与石墨烯基底电连接，发射电极发射的载流子通过电子类光动量选择器后被类光分束镜分束，分别通过三个相互垂直探测臂到收集电极上，电子类光动量选择器和类光分束镜的栅极均设置在石墨烯基底的竖直上方。有益效果：墨烯类光输运的波长更短，对引力波更敏感，提高引力波探测器的灵敏度，可以减小引力波探测器的尺寸；且利用三个相互垂直探测臂可以获得引力波源的坐标方位信息。 The invention relates to an optical gravitational wave detector, which belongs to the technical field of weak signal detection. The light-like gravitational wave detector includes: an emitting electrode, a graphene substrate, a light-like beam splitter, a collecting electrode, an insulating layer and a substrate electrode, the emitting electrode and the collecting electrode are electrically connected to the graphene substrate respectively, and the current carrying After passing through the electron-like photomomentum selector, the electrons are split by the light-like beam splitter, and then pass through three mutually perpendicular detection arms to the collecting electrodes. Vertically above the alkenyl base. Beneficial effects: the wavelength of graphene light transport is shorter, more sensitive to gravitational waves, the sensitivity of gravitational wave detectors can be improved, and the size of gravitational wave detectors can be reduced; and the source of gravitational waves can be obtained by using three mutually perpendicular detection arms coordinate orientation information."
